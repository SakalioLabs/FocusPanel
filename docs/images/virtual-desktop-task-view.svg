<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#182842"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#56afff"/>
      <stop offset="1" stop-color="#917dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1120" height="600" rx="30" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei">
    <text x="56" y="68" fill="#f3f8ff" font-size="28" font-weight="600">任务视图：从入口升级为虚拟桌面控制器</text>
    <text x="56" y="104" fill="#9fb2cc" font-size="17">不增加紧凑栏按钮，用滚轮和右键缩短多桌面操作路径</text>

    <g filter="url(#shadow)">
      <rect x="56" y="144" width="216" height="364" rx="28" fill="#202f48" stroke="#435875"/>
      <rect x="116" y="178" width="96" height="96" rx="24" fill="url(#accent)"/>
      <rect x="137" y="202" width="24" height="20" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
      <rect x="168" y="212" width="24" height="20" rx="3" fill="none" stroke="#fff" stroke-width="3"/>
      <text x="164" y="316" text-anchor="middle" fill="#fff" font-size="21" font-weight="600">任务视图</text>
      <text x="164" y="350" text-anchor="middle" fill="#aabbd2" font-size="15">左键 · Win+Tab</text>
      <path d="M142 392 L164 372 L186 392" fill="none" stroke="#77baff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M142 430 L164 450 L186 430" fill="none" stroke="#77baff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="164" y="485" text-anchor="middle" fill="#8fc8ff" font-size="15">滚轮 · 切换桌面</text>
    </g>

    <rect x="316" y="144" width="748" height="364" rx="24" fill="#1b2a40" stroke="#3b506d"/>
    <text x="348" y="187" fill="#fff" font-size="20" font-weight="600">右键 · 虚拟桌面操作</text>

    <rect x="340" y="212" width="700" height="58" rx="14" fill="#263a58" stroke="#64aaff"/>
    <text x="362" y="248" fill="#fff" font-size="17">上一个虚拟桌面</text>
    <text x="1014" y="248" text-anchor="end" fill="#a8bed9" font-size="15">Win+Ctrl+←</text>

    <rect x="340" y="278" width="700" height="58" rx="14" fill="#203149"/>
    <text x="362" y="314" fill="#e4edf9" font-size="17">下一个虚拟桌面</text>
    <text x="1014" y="314" text-anchor="end" fill="#91a6c2" font-size="15">Win+Ctrl+→</text>

    <line x1="356" y1="352" x2="1024" y2="352" stroke="#3b506b"/>

    <rect x="340" y="368" width="700" height="58" rx="14" fill="#203149"/>
    <text x="362" y="404" fill="#e4edf9" font-size="17">新建虚拟桌面</text>
    <text x="1014" y="404" text-anchor="end" fill="#91a6c2" font-size="15">Win+Ctrl+D</text>

    <rect x="340" y="434" width="700" height="58" rx="14" fill="#203149"/>
    <text x="362" y="470" fill="#e4edf9" font-size="17">关闭当前虚拟桌面</text>
    <text x="1014" y="470" text-anchor="end" fill="#91a6c2" font-size="15">Win+Ctrl+F4</text>

    <rect x="56" y="538" width="1008" height="42" rx="14" fill="#17253a" stroke="#334967"/>
    <text x="80" y="565" fill="#9eb2cc" font-size="15">160ms 防抖 · 修饰键逆序释放 · 失败进入状态中心 · Esc 焦点准确返回状态中心入口</text>
  </g>
</svg>
