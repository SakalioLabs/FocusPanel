    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8ecff" stop-opacity=".20"/><stop offset="1" stop-color="#65b8ef" stop-opacity=".07"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dff3ff" stop-opacity=".34"/><stop offset="1" stop-color="#4da8e5" stop-opacity=".14"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".38"/></filter>
