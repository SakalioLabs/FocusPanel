    <rect x="24" y="44" width="422" height="238" rx="16" fill="#10233a" stroke="#6c9bc1" stroke-opacity=".35"/>
    <path d="M165 44v238M305 44v238" stroke="#86abc8" stroke-opacity=".18" stroke-dasharray="7 7"/>
    <path d="M24 163h422" stroke="#42b7f4" stroke-opacity=".24" stroke-dasharray="7 7"/>
    <rect x="432" y="44" width="14" height="238" rx="7" fill="#38a9ed" opacity=".90"/>
