<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 本地优先 OKR 与飞书同步</title>
  <desc id="desc">展示本地目标管理、关键结果进度以及可选的飞书双向同步。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef5ff"/>
      <stop offset="1" stop-color="#dce9f7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".88"/>
      <stop offset="1" stop-color="#e7f0fb" stop-opacity=".68"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#496582" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1120" height="500" rx="30" fill="url(#background)"/>
  <text x="44" y="54" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#16283c">本地优先 OKR</text>
  <text x="44" y="81" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" fill="#60758c">无需飞书即可完整使用；连接后按需双向同步</text>

  <g transform="translate(44 112)" filter="url(#shadow)">
    <rect width="650" height="334" rx="24" fill="url(#glass)" stroke="#fff"/>
    <text x="24" y="40" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="650" fill="#1d3045">目标与关键结果</text>
    <rect x="500" y="16" width="126" height="42" rx="12" fill="#176bdb"/>
    <text x="563" y="42" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" fill="#fff">创建目标</text>

    <g transform="translate(22 74)">
      <rect width="606" height="108" rx="16" fill="#f8fbff"/>
      <text x="18" y="28" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="650" fill="#294057">提升 FocusPanel 日常使用体验</text>
      <text x="18" y="50" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#758aa0">2026 Q3 · 3 个关键结果 · 本地已修改</text>
      <rect x="18" y="68" width="510" height="8" rx="4" fill="#d6e2ef"/>
      <rect x="18" y="68" width="342" height="8" rx="4" fill="#176bdb"/>
      <text x="574" y="78" text-anchor="end" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="650" fill="#176bdb">67%</text>
      <rect x="18" y="87" width="150" height="6" rx="3" fill="#77aee8"/>
      <rect x="184" y="87" width="110" height="6" rx="3" fill="#9ec3e9"/>
      <rect x="310" y="87" width="88" height="6" rx="3" fill="#bed4ea"/>
    </g>

    <g transform="translate(22 196)">
      <rect width="606" height="112" rx="16" fill="#f8fbff"/>
      <text x="18" y="28" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="650" fill="#294057">关键结果</text>
      <g font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">
        <text x="18" y="56" fill="#435a72">启动稳定率</text>
        <text x="350" y="56" fill="#758aa0">98 / 100%</text>
        <text x="574" y="56" text-anchor="end" fill="#176bdb">98%</text>
        <text x="18" y="84" fill="#435a72">平均响应时间</text>
        <text x="350" y="84" fill="#758aa0">240 / 150ms</text>
        <text x="574" y="84" text-anchor="end" fill="#176bdb">60%</text>
      </g>
    </g>
  </g>

  <g transform="translate(742 126)">
    <rect width="334" height="304" rx="24" fill="#ffffff" fill-opacity=".76" stroke="#fff"/>
    <circle cx="48" cy="50" r="24" fill="#e4f0ff"/>
    <path d="M36 50c5-11 20-11 25 0m-25 0c5 11 20 11 25 0m-12-16v32" fill="none" stroke="#176bdb" stroke-width="3" stroke-linecap="round"/>
    <text x="86" y="45" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="650" fill="#1d3045">飞书双向同步</text>
    <text x="86" y="66" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#758aa0">可选连接，不阻塞本地使用</text>

    <g transform="translate(24 94)" font-family="Segoe UI, Microsoft YaHei, sans-serif">
      <rect width="286" height="52" rx="14" fill="#f4f8fc"/>
      <text x="16" y="22" font-size="11" fill="#758aa0">同步状态</text>
      <text x="16" y="40" font-size="13" font-weight="650" fill="#294057">本地更改等待提交</text>
      <circle cx="260" cy="26" r="8" fill="#f4a340"/>

      <rect y="62" width="286" height="52" rx="14" fill="#f4f8fc"/>
      <text x="16" y="84" font-size="11" fill="#758aa0">自动同步</text>
      <text x="16" y="102" font-size="13" font-weight="650" fill="#294057">每 30 分钟</text>
      <path d="M250 88l6 6 12-14" fill="none" stroke="#2c8a5b" stroke-width="3" stroke-linecap="round"/>

      <rect y="124" width="286" height="54" rx="14" fill="#176bdb"/>
      <text x="143" y="157" text-anchor="middle" font-size="13" font-weight="650" fill="#fff">立即同步</text>
    </g>

    <text x="167" y="286" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11" fill="#758aa0">退出时停止计时器并解除后台事件</text>
  </g>
</svg>
