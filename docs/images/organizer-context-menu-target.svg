<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#26344D"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".17"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity=".3"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#4CA6E8"/>
    </marker>
  </defs>
  <rect width="1120" height="520" rx="28" fill="url(#background)"/>
  <text x="56" y="62" fill="#F5F7FF" font-family="Segoe UI Variable Display, Segoe UI" font-size="28" font-weight="600">桌面右键菜单始终作用于当前文件</text>
  <text x="56" y="94" fill="#AEB5C8" font-family="Segoe UI Variable Text, Segoe UI" font-size="15">独立实例 + PlacementTarget 动态绑定，避免虚拟化复用后的陈旧选择。</text>

  <g transform="translate(58 138)">
    <rect width="328" height="300" rx="20" fill="url(#card)" stroke="#FFFFFF" stroke-opacity=".14"/>
    <text x="22" y="38" fill="#AEB5C8" font-family="Segoe UI Variable Text, Segoe UI" font-size="13">桌面收纳 · 当前可视卡片</text>
    <g font-family="Segoe UI Variable Text, Segoe UI" font-size="15">
      <rect x="18" y="58" width="292" height="62" rx="12" fill="#FFFFFF" fill-opacity=".05"/>
      <rect x="34" y="75" width="28" height="28" rx="7" fill="#7C8AA5"/>
      <text x="76" y="94" fill="#AEB5C8">release-notes.md</text>
      <rect x="18" y="130" width="292" height="62" rx="12" fill="#006FC4" fill-opacity=".34" stroke="#4CA6E8" stroke-opacity=".7"/>
      <rect x="34" y="147" width="28" height="28" rx="7" fill="#F2C94C"/>
      <text x="76" y="166" fill="#F5F7FF" font-weight="600">packages</text>
      <text x="250" y="166" fill="#4CA6E8" font-size="12">右键</text>
      <rect x="18" y="202" width="292" height="62" rx="12" fill="#FFFFFF" fill-opacity=".05"/>
      <rect x="34" y="219" width="28" height="28" rx="7" fill="#5CB85C"/>
      <text x="76" y="238" fill="#AEB5C8">README.md</text>
    </g>
  </g>

  <path d="M400 288 C438 288 452 238 490 238" fill="none" stroke="#4CA6E8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(508 138)" filter="url(#shadow)">
    <rect width="260" height="300" rx="18" fill="#20242C" fill-opacity=".97" stroke="#FFFFFF" stroke-opacity=".14"/>
    <text x="20" y="38" fill="#AEB5C8" font-family="Segoe UI Variable Text, Segoe UI" font-size="13">独立 Fluent ContextMenu</text>
    <g font-family="Segoe UI Variable Text, Segoe UI" font-size="15">
      <rect x="12" y="54" width="236" height="46" rx="10" fill="#FFFFFF" fill-opacity=".06"/>
      <text x="30" y="83" fill="#F5F7FF">打开</text>
      <rect x="12" y="104" width="236" height="46" rx="10" fill="#006FC4" fill-opacity=".28"/>
      <text x="30" y="133" fill="#F5F7FF">移动到</text>
      <text x="222" y="133" fill="#AEB5C8">›</text>
      <rect x="12" y="154" width="236" height="46" rx="10" fill="transparent"/>
      <text x="30" y="183" fill="#F5F7FF">收纳到面板</text>
      <text x="222" y="183" fill="#AEB5C8">›</text>
      <rect x="12" y="204" width="236" height="46" rx="10" fill="transparent"/>
      <text x="30" y="233" fill="#F5F7FF">恢复到桌面</text>
    </g>
    <text x="20" y="278" fill="#4CA6E8" font-family="Segoe UI Variable Text, Segoe UI" font-size="12">目标：packages</text>
  </g>

  <path d="M784 288 C822 288 835 238 872 238" fill="none" stroke="#4CA6E8" stroke-width="2.5" marker-end="url(#arrow)"/>

  <g transform="translate(888 154)" font-family="Segoe UI Variable Text, Segoe UI">
    <circle cx="58" cy="58" r="58" fill="#4CA6E8" fill-opacity=".18" stroke="#4CA6E8" stroke-opacity=".72"/>
    <text x="58" y="53" text-anchor="middle" fill="#F5F7FF" font-size="18" font-weight="600">当前目标</text>
    <text x="58" y="78" text-anchor="middle" fill="#4CA6E8" font-size="14">packages</text>
    <text x="58" y="148" text-anchor="middle" fill="#AEB5C8" font-size="13">同步 SelectedFile</text>
    <text x="58" y="170" text-anchor="middle" fill="#AEB5C8" font-size="13">再执行原有命令</text>
    <rect x="-12" y="200" width="140" height="58" rx="14" fill="#FFFFFF" fill-opacity=".07"/>
    <text x="58" y="224" text-anchor="middle" fill="#F5F7FF" font-size="13">不共享菜单状态</text>
    <text x="58" y="244" text-anchor="middle" fill="#F5F7FF" font-size="13">不误操作旧文件</text>
  </g>
</svg>
