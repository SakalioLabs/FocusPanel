<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67d3ff"/>
      <stop offset="1" stop-color="#8aa5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#020817" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1120" height="390" rx="28" fill="url(#bg)"/>
  <text x="54" y="64" fill="#f4f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="700">工作区固定展开 · 可控的自动收起</text>
  <text x="54" y="98" fill="#a9bdd8" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="16">临时阅读与对照不被鼠标离开打断，手动收回仍保持明确</text>

  <g transform="translate(54 132)" filter="url(#shadow)">
    <rect width="300" height="196" rx="20" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="26" y="40" fill="#8bdcff" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="600">01 · 标准展开</text>
    <rect x="26" y="62" width="248" height="52" rx="14" fill="#ffffff" fill-opacity=".08"/>
    <text x="46" y="94" fill="#eef5ff" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17">任务工作区</text>
    <circle cx="246" cy="88" r="18" fill="#ffffff" fill-opacity=".08"/>
    <path d="M240 80h12l-3 5v8l-3 3-3-3v-8z" fill="none" stroke="#b9c9dc" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="26" y="146" fill="#bdcadd" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">鼠标离开约 300ms</text>
    <text x="26" y="174" fill="#8195b0" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14">→ 自动收起并隐藏主壳</text>
  </g>

  <path d="M374 230h52" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M418 222l10 8-10 8" fill="none" stroke="#80b9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(446 132)" filter="url(#shadow)">
    <rect width="300" height="196" rx="20" fill="#ffffff" fill-opacity=".075" stroke="#78c9ff" stroke-opacity=".32"/>
    <text x="26" y="40" fill="#8bdcff" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="600">02 · 固定展开</text>
    <rect x="26" y="62" width="248" height="52" rx="14" fill="#5cbfff" fill-opacity=".14" stroke="#78c9ff" stroke-opacity=".35"/>
    <text x="46" y="94" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="17">任务工作区</text>
    <circle cx="246" cy="88" r="18" fill="#6dd1ff" fill-opacity=".25"/>
    <path d="M240 80h12l-3 5v8l-3 3-3-3v-8z" fill="none" stroke="#9ce2ff" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="26" y="146" fill="#d9e7f8" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">停止旧自动收起计时器</text>
    <text x="26" y="174" fill="#91a9c5" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14">鼠标离开、窗口失活均保持可见</text>
  </g>

  <path d="M766 230h52" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
  <path d="M810 222l10 8-10 8" fill="none" stroke="#80b9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(838 132)" filter="url(#shadow)">
    <rect width="228" height="196" rx="20" fill="#ffffff" fill-opacity=".075" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="24" y="40" fill="#8bdcff" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="600">03 · 明确解除</text>
    <g fill="#dbe8f8" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="15">
      <text x="26" y="80">再次点击图钉</text>
      <text x="26" y="110">手动收回 / Esc</text>
      <text x="26" y="140">托盘隐藏 / 更新</text>
      <text x="26" y="170">退出 FocusPanel</text>
    </g>
    <circle cx="196" cy="164" r="12" fill="#76d7ae" fill-opacity=".18"/>
    <path d="M190 164l4 4 8-9" fill="none" stroke="#8ce4bc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="560" y="365" text-anchor="middle" fill="#8198b6" font-family="Segoe UI, Microsoft YaHei UI, sans-serif" font-size="14">只保留当前交互状态 · 不修改任务栏 · 不写业务数据库 · 不影响右缘热区</text>
</svg>
