<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#66b3ff"/>
      <stop offset="1" stop-color="#756cf5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
  </defs>
  <rect width="1120" height="560" rx="30" fill="url(#bg)"/>
  <text x="56" y="68" fill="#f3f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="600">不用拖拽，也能精确调整固定顺序</text>
  <text x="56" y="102" fill="#9fb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">右键菜单和键盘快捷键共享同一条持久化路径</text>

  <g transform="translate(72 142)" filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei">
    <rect width="410" height="328" rx="24" fill="#1e2e45" stroke="#3c5373"/>
    <text x="26" y="42" fill="#cfe3ff" font-size="18" font-weight="600">应用右键菜单</text>
    <rect x="26" y="66" width="358" height="58" rx="14" fill="#263a56"/>
    <text x="48" y="102" fill="#eef6ff" font-size="18">启动新实例</text>
    <rect x="26" y="134" width="358" height="58" rx="14" fill="#263a56"/>
    <text x="48" y="170" fill="#eef6ff" font-size="18">取消固定</text>
    <line x1="38" y1="204" x2="372" y2="204" stroke="#405675"/>
    <rect x="26" y="216" width="358" height="42" rx="12" fill="#19456d"/>
    <text x="48" y="243" fill="#d9edff" font-size="17">上移固定应用</text>
    <text x="356" y="243" text-anchor="end" fill="#9ecfff" font-size="15">Alt+↑</text>
    <rect x="26" y="266" width="358" height="42" rx="12" fill="#263a56"/>
    <text x="48" y="293" fill="#eef6ff" font-size="17">下移固定应用</text>
    <text x="356" y="293" text-anchor="end" fill="#a8bad0" font-size="15">Alt+↓</text>
  </g>

  <g transform="translate(548 142)" font-family="Segoe UI, Microsoft YaHei">
    <rect width="500" height="328" rx="24" fill="#1e2e45" stroke="#3c5373" filter="url(#shadow)"/>
    <text x="28" y="42" fill="#cfe3ff" font-size="18" font-weight="600">键盘直接排序</text>
    <rect x="40" y="82" width="82" height="82" rx="22" fill="#344a69"/>
    <text x="81" y="133" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">A</text>
    <rect x="40" y="184" width="82" height="82" rx="22" fill="url(#accent)" stroke="#8cc7ff" stroke-width="3"/>
    <text x="81" y="235" text-anchor="middle" fill="#fff" font-size="26" font-weight="700">B</text>
    <rect x="40" y="286" width="82" height="24" rx="12" fill="#344a69"/>
    <circle cx="81" cy="298" r="4" fill="#7dbbff"/>

    <rect x="166" y="92" width="88" height="62" rx="15" fill="#293d59" stroke="#4b6385"/>
    <text x="210" y="130" text-anchor="middle" fill="#eef6ff" font-size="20" font-weight="600">Alt</text>
    <text x="274" y="130" fill="#8ea3bd" font-size="24">+</text>
    <rect x="304" y="92" width="88" height="62" rx="15" fill="#19456d" stroke="#6db7ff"/>
    <text x="348" y="132" text-anchor="middle" fill="#d9edff" font-size="28">↑</text>
    <path d="M348 168 C348 210 264 225 142 225" fill="none" stroke="#73b9ff" stroke-width="4" stroke-dasharray="9 10"/>
    <path d="M145 225 l14-8-1 16z" fill="#73b9ff"/>
    <text x="166" y="258" fill="#d6e6fa" font-size="17">焦点保持在原图标</text>
    <text x="166" y="286" fill="#91a5bf" font-size="15">首项/末项自动禁用越界方向</text>
  </g>

  <text x="56" y="524" fill="#7f94af" font-family="Segoe UI, Microsoft YaHei" font-size="15">每次移动都在最新持久顺序上执行，连续操作不会覆盖前一笔结果</text>
</svg>
