<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d2c"/>
      <stop offset="1" stop-color="#1a2e42"/>
    </linearGradient>
    <linearGradient id="focusAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cc7ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02070d" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#background)"/>
  <circle cx="1102" cy="64" r="170" fill="#57c5ff" opacity=".07"/>
  <circle cx="82" cy="584" r="210" fill="#897cff" opacity=".07"/>
  <text x="56" y="68" fill="#f5f9fd" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="650">一步开始专注：四次操作压缩为一条命令</text>
  <text x="56" y="102" fill="#92aac1" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="15">复用现有番茄钟状态机、保存队列与浮动计时窗，不创建第二套计时逻辑</text>

  <g transform="translate(56 140)" filter="url(#drop)">
    <rect width="694" height="402" rx="24" fill="#192b3d" stroke="#42617b"/>
    <text x="28" y="42" fill="#eaf3fb" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="600">应用、窗口、命令、专注与计算</text>
    <rect x="28" y="66" width="638" height="58" rx="14" fill="#0e1c29" stroke="#5cc6ff" stroke-width="2"/>
    <text x="52" y="102" fill="#f7fbff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="20">专注 25</text>

    <rect x="28" y="142" width="638" height="82" rx="16" fill="#24445d" stroke="#6bcbff"/>
    <rect x="48" y="160" width="48" height="48" rx="13" fill="#315a76"/>
    <circle cx="72" cy="184" r="13" fill="none" stroke="#7fd3ff" stroke-width="3"/>
    <path d="M72 176v9l6 4M67 166h10" fill="none" stroke="#7fd3ff" stroke-width="3" stroke-linecap="round"/>
    <text x="116" y="178" fill="#f4f9fd" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600">开始 25 分钟专注</text>
    <text x="116" y="202" fill="#b9d0e3" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">专注快捷命令 · 点击或按 Enter 开始</text>

    <g font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">
      <rect x="28" y="244" width="198" height="54" rx="14" fill="#142535" stroke="#334e65"/>
      <text x="48" y="277" fill="#d9e8f4">开始番茄钟 45 分钟</text>
      <rect x="240" y="244" width="198" height="54" rx="14" fill="#142535" stroke="#334e65"/>
      <text x="260" y="277" fill="#d9e8f4">focus 30 min</text>
      <rect x="452" y="244" width="214" height="54" rx="14" fill="#142535" stroke="#334e65"/>
      <text x="472" y="277" fill="#d9e8f4">pomodoro 60</text>
    </g>
    <rect x="28" y="322" width="638" height="1" fill="#334c61"/>
    <text x="28" y="357" fill="#8ca6bd" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">严格拒绝：裸“专注” · 0 / 181 分钟 · 小数 · 文件名 · 尾随操作</text>
    <text x="28" y="381" fill="#6f8aa2" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="12">已有运行或暂停会话时转到番茄钟工作区，绝不覆盖当前进度</text>
  </g>

  <g transform="translate(790 142)" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif">
    <rect width="354" height="408" rx="24" fill="#132536" stroke="#36546d"/>
    <text x="28" y="43" fill="#f0f6fb" font-size="18" font-weight="600">原来需要</text>
    <g fill="#dbe8f3" font-size="14">
      <text x="38" y="82">1　打开 Focus 中心</text>
      <text x="38" y="116">2　进入番茄钟</text>
      <text x="38" y="150">3　选择时长</text>
      <text x="38" y="184">4　点击开始</text>
    </g>
    <path d="M28 210h298" stroke="#314d63"/>
    <text x="28" y="247" fill="#f0f6fb" font-size="18" font-weight="600">现在只需</text>
    <rect x="28" y="270" width="298" height="70" rx="17" fill="#234964" stroke="#66caff"/>
    <text x="50" y="300" fill="#f5fbff" font-size="15" font-weight="600">输入“专注 25”并按 Enter</text>
    <text x="50" y="323" fill="#a9c5da" font-size="12">计时立即开始，Panel 可自动收回</text>
    <rect x="28" y="360" width="298" height="1" fill="#314d63"/>
    <circle cx="45" cy="383" r="8" fill="url(#focusAccent)"/>
    <text x="64" y="388" fill="#81d1ff" font-size="12">浮窗首次显示不抢当前焦点</text>
  </g>
</svg>
