<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="440" viewBox="0 0 1120 440" role="img" aria-labelledby="title desc">
  <title id="title">更新管理器后台准备与首轮检查</title>
  <desc id="desc">主壳立即继续创建界面，工作线程定位 Velopack 安装；自动和手动检查共享初始化任务，并在结果就绪后区分安装版、便携版和开发运行版。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1d2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1120" height="440" rx="28" fill="url(#background)"/>
  <text x="56" y="62" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="650">更新能力准备不再挡住 Panel 首帧</text>
  <text x="56" y="96" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="15">一次后台初始化，自动检查与手动检查共同等待</text>

  <g filter="url(#shadow)">
    <rect x="56" y="135" width="245" height="214" rx="22" fill="#1d2a42" stroke="#334766"/>
    <circle cx="94" cy="176" r="19" fill="#173e55"/>
    <path d="M84 176h20M94 166v20" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <text x="126" y="183" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600">主壳构造</text>
    <text x="80" y="229" fill="#d7e0ec" font-family="Segoe UI, sans-serif" font-size="15">创建轻量更新服务</text>
    <text x="80" y="260" fill="#d7e0ec" font-family="Segoe UI, sans-serif" font-size="15">立即继续 XAML 首帧</text>
    <rect x="80" y="287" width="181" height="36" rx="11" fill="#122036"/>
    <text x="96" y="311" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="14">不扫描安装目录</text>
  </g>

  <path d="M321 237h78" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="327" y="218" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="13">Task.Run</text>

  <g filter="url(#shadow)">
    <rect x="420" y="120" width="292" height="244" rx="22" fill="#1d2a42" stroke="#53658b"/>
    <rect x="446" y="145" width="240" height="46" rx="13" fill="url(#accent)" opacity=".94"/>
    <text x="465" y="174" fill="#fff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">共享初始化任务</text>
    <circle cx="468" cy="225" r="10" fill="#38bdf8"/>
    <text x="490" y="231" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15">定位安装根目录</text>
    <circle cx="468" cy="268" r="10" fill="#818cf8"/>
    <text x="490" y="274" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15">识别安装版 / 便携版</text>
    <circle cx="468" cy="311" r="10" fill="#a78bfa"/>
    <text x="490" y="317" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="15">发布版本与更新能力</text>
  </g>

  <path d="M732 207h77" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M732 296h77" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="829" y="132" width="235" height="104" rx="20" fill="#17364a" stroke="#37729a"/>
    <text x="855" y="172" fill="#e0f2fe" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">开机自动检查</text>
    <text x="855" y="201" fill="#bae6fd" font-family="Segoe UI, sans-serif" font-size="13">等待同一任务 · 不漏检</text>
    <rect x="829" y="262" width="235" height="104" rx="20" fill="#2d2748" stroke="#6556a1"/>
    <text x="855" y="302" fill="#ede9fe" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">设置页手动检查</text>
    <text x="855" y="331" fill="#ddd6fe" font-family="Segoe UI, sans-serif" font-size="13">复用结果 · 不重复定位</text>
  </g>

  <text x="56" y="407" fill="#93a4bd" font-family="Segoe UI, sans-serif" font-size="13">开发运行版在初始化后安全返回；安装版与便携版继续读取 GitHub Latest Release 静态清单。</text>
</svg>
