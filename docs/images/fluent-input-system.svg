<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="selection" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0873bf"/>
      <stop offset="1" stop-color="#2c91d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1180" height="500" rx="32" fill="url(#bg)"/>
  <text x="62" y="72" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">统一 Fluent 输入状态</text>
  <text x="62" y="106" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">文本与密码共用动态主题 · 单层圆角表面 · 光标、选择、焦点与只读状态一致</text>

  <g transform="translate(62 148)" filter="url(#shadow)">
    <rect width="656" height="286" rx="22" fill="#232d39" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="28" y="42" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">正在编辑</text>
    <rect x="28" y="64" width="600" height="56" rx="12" fill="#303a47" stroke="#63b7f2" stroke-width="2"/>
    <rect x="49" y="82" width="204" height="23" rx="4" fill="url(#selection)" opacity=".82"/>
    <text x="52" y="101" fill="#f5f7ff" font-family="Segoe UI Variable Text, Microsoft YaHei" font-size="16">深色主题输入</text>
    <rect x="268" y="80" width="2" height="27" rx="1" fill="#63b7f2"/>

    <text x="28" y="162" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">密码输入</text>
    <rect x="28" y="184" width="600" height="56" rx="12" fill="#303a47" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="50" y="220" fill="#f5f7ff" font-family="Segoe UI Variable Text, Microsoft YaHei" font-size="23" letter-spacing="7">••••••••••</text>
    <rect x="273" y="199" width="2" height="27" rx="1" fill="#63b7f2"/>
    <text x="28" y="270" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">44px 最小高度 · 同一 Chrome 承担全部状态反馈</text>
  </g>

  <g transform="translate(766 148)">
    <rect width="350" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">只读</text>
    <rect x="24" y="52" width="302" height="48" rx="11" fill="#202a35" stroke="#ffffff" stroke-opacity=".1" opacity=".78"/>
    <text x="42" y="82" fill="#aeb5c8" font-family="Segoe UI Variable Text, Microsoft YaHei" font-size="15">内容可复制，不可编辑</text>
  </g>
  <g transform="translate(766 300)">
    <rect width="350" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">禁用</text>
    <rect x="24" y="52" width="302" height="48" rx="11" fill="#303a47" stroke="#ffffff" stroke-opacity=".12" opacity=".38"/>
    <text x="42" y="82" fill="#aeb5c8" font-family="Segoe UI Variable Text, Microsoft YaHei" font-size="15" opacity=".42">当前操作暂不可用</text>
  </g>
</svg>
