<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#e5ebf7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#edf5ff" stop-opacity=".84"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183b5e" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#287fc5"/>
    </marker>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="30" r="190" fill="#3e91e1" opacity=".11"/>
  <circle cx="80" cy="600" r="180" fill="#7a64cf" opacity=".09"/>
  <text x="64" y="70" font-family="Microsoft YaHei, Segoe UI" font-size="25" font-weight="700" fill="#19283e">后台管理不再占任务栏位置</text>
  <text x="64" y="104" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#60738b">默认只看固定应用与真实窗口，需要时再从状态中心进入后台抽屉</text>

  <rect x="72" y="140" width="94" height="424" rx="29" fill="url(#glass)" stroke="#ffffff" filter="url(#shadow)"/>
  <text x="119" y="172" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="11" fill="#60738b">任务栏</text>
  <line x1="88" y1="188" x2="150" y2="188" stroke="#d4dfeb"/>
  <g>
    <rect x="92" y="207" width="54" height="54" rx="13" fill="#dceeff"/>
    <rect x="106" y="221" width="26" height="26" rx="7" fill="#1677d2"/>
    <rect x="89" y="221" width="4" height="26" rx="2" fill="#1677d2"/>
    <rect x="92" y="273" width="54" height="54" rx="13" fill="#f5f8fc"/>
    <circle cx="119" cy="300" r="14" fill="#efb42a"/>
    <rect x="89" y="287" width="4" height="13" rx="2" fill="#1677d2" opacity=".65"/>
    <rect x="92" y="339" width="54" height="54" rx="13" fill="#f5f8fc"/>
    <rect x="106" y="353" width="26" height="26" rx="7" fill="#745ed0"/>
  </g>
  <rect x="92" y="407" width="54" height="54" rx="13" fill="#edf5ff"/>
  <text x="119" y="430" text-anchor="middle" font-family="Segoe Fluent Icons, Segoe UI Symbol" font-size="20" fill="#2a5e8f">&#xE950;</text>
  <text x="119" y="449" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="9" fill="#60738b">状态</text>
  <text x="119" y="517" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="11" fill="#60738b">18:42</text>

  <rect x="228" y="158" width="340" height="334" rx="22" fill="#ffffff" stroke="#d4dfeb" filter="url(#shadow)"/>
  <circle cx="260" cy="194" r="12" fill="#2daf68"/>
  <text x="284" y="200" font-family="Microsoft YaHei, Segoe UI" font-size="18" font-weight="700" fill="#19283e">紧凑任务栏</text>
  <g font-family="Microsoft YaHei, Segoe UI">
    <rect x="256" y="232" width="284" height="62" rx="13" fill="#e8f5ed"/>
    <text x="280" y="260" font-size="15" font-weight="700" fill="#21364e">固定应用</text>
    <text x="280" y="280" font-size="12" fill="#5d7187">保持用户排序</text>
    <rect x="256" y="308" width="284" height="62" rx="13" fill="#e8f5ed"/>
    <text x="280" y="336" font-size="15" font-weight="700" fill="#21364e">真实与最小化窗口</text>
    <text x="280" y="356" font-size="12" fill="#5d7187">直接切换、还原或关闭</text>
    <rect x="256" y="384" width="284" height="62" rx="13" fill="#edf5ff"/>
    <text x="280" y="412" font-size="15" font-weight="700" fill="#21364e">多一个应用槽位</text>
    <text x="280" y="432" font-size="12" fill="#5d7187">后台按钮不再占用 54px</text>
  </g>

  <path d="M586 325 C620 325 631 325 660 325" fill="none" stroke="#287fc5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="680" y="138" width="428" height="426" rx="24" fill="#173f69" filter="url(#shadow)"/>
  <text x="712" y="181" font-family="Microsoft YaHei, Segoe UI" font-size="19" font-weight="700" fill="#ffffff">状态中心</text>
  <rect x="710" y="207" width="368" height="58" rx="13" fill="#28547d"/>
  <text x="734" y="242" font-family="Microsoft YaHei, Segoe UI" font-size="15" fill="#e5f2ff">后台应用与窗口</text>
  <text x="1048" y="242" text-anchor="end" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#b9d5ed">按需展开</text>
  <rect x="710" y="283" width="368" height="50" rx="12" fill="#ffffff" opacity=".95"/>
  <text x="734" y="314" font-family="Microsoft YaHei, Segoe UI" font-size="13" fill="#60738b">搜索应用与窗口</text>
  <rect x="710" y="348" width="112" height="40" rx="11" fill="#3c6d96"/>
  <rect x="832" y="348" width="112" height="40" rx="11" fill="#3c6d96"/>
  <rect x="954" y="348" width="124" height="40" rx="11" fill="#3c6d96"/>
  <text x="766" y="373" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#e5f2ff">全部</text>
  <text x="888" y="373" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#e5f2ff">有窗口</text>
  <text x="1016" y="373" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#e5f2ff">纯后台</text>
  <rect x="710" y="408" width="368" height="55" rx="12" fill="#28547d"/>
  <text x="734" y="441" font-family="Microsoft YaHei, Segoe UI" font-size="13" fill="#dcecff">打开后搜索框自动获得焦点</text>
  <text x="710" y="513" font-family="Microsoft YaHei, Segoe UI" font-size="13" fill="#bcd8f2">完整后台数据只在这里出现</text>
  <text x="590" y="588" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#47617f">任务栏负责切换窗口，状态中心负责管理后台——不再混在一条栏里</text>
</svg>
