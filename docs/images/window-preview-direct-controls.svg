<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">实时缩略卡直接控制窗口状态</title>
  <desc id="desc">FocusPanel 的实时窗口预览卡直接提供最小化、最大化或还原以及关闭按钮。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17263c"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#334761" stop-opacity=".92"/>
      <stop offset="1" stop-color="#1c2a40" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#02060d" flood-opacity=".52"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="160" cy="85" r="190" fill="#1689e8" opacity=".16"/>
  <circle cx="1080" cy="560" r="250" fill="#5bd4c7" opacity=".1"/>

  <g filter="url(#shadow)">
    <rect x="115" y="58" width="680" height="504" rx="28" fill="url(#glass)" stroke="#7895ba" stroke-opacity=".38"/>
    <text x="148" y="108" fill="#f4f7fb" font-family="Segoe UI, sans-serif" font-size="25" font-weight="650">浏览器</text>
    <text x="148" y="136" fill="#a9b8cd" font-family="Segoe UI, sans-serif" font-size="15">2 个运行窗口 · 实时预览</text>

    <g transform="translate(148 164)">
      <rect width="614" height="176" rx="17" fill="#25364d"/>
      <rect x="10" y="10" width="594" height="116" rx="11" fill="#0e1929"/>
      <rect x="28" y="27" width="558" height="82" rx="7" fill="#286597" opacity=".9"/>
      <rect x="46" y="43" width="220" height="12" rx="6" fill="#dbeeff" opacity=".8"/>
      <rect x="46" y="67" width="340" height="8" rx="4" fill="#b5d7f4" opacity=".5"/>
      <rect x="46" y="85" width="290" height="8" rx="4" fill="#b5d7f4" opacity=".35"/>
      <rect y="126" width="614" height="50" rx="0 0 17 17" fill="#2c3d55"/>
      <rect x="14" y="140" width="4" height="22" rx="2" fill="#57aaff"/>
      <text x="32" y="158" fill="#f4f7fb" font-family="Segoe UI, sans-serif" font-size="16">FocusPanel — 项目主页</text>
      <g transform="translate(470 133)" fill="#3b4e68" stroke="#8ea6c5" stroke-opacity=".35">
        <rect width="36" height="36" rx="11"/>
        <rect x="40" width="36" height="36" rx="11"/>
        <rect x="80" width="36" height="36" rx="11"/>
      </g>
      <g fill="none" stroke="#ecf3fb" stroke-width="2" stroke-linecap="round">
        <path d="M481 158h14"/>
        <rect x="521" y="143" width="14" height="12" rx="1"/>
        <path d="M562 144l12 12m0-12l-12 12"/>
      </g>
    </g>

    <g transform="translate(148 356)">
      <rect width="614" height="150" rx="17" fill="#24344a"/>
      <rect x="10" y="10" width="594" height="90" rx="11" fill="#111c2c"/>
      <rect x="28" y="27" width="558" height="56" rx="7" fill="#61438f" opacity=".76"/>
      <rect y="100" width="614" height="50" rx="0 0 17 17" fill="#2b3c53"/>
      <text x="32" y="132" fill="#f4f7fb" font-family="Segoe UI, sans-serif" font-size="16">文档 — 已最大化</text>
      <g transform="translate(470 107)" fill="#3b4e68" stroke="#8ea6c5" stroke-opacity=".35">
        <rect width="36" height="36" rx="11"/>
        <rect x="40" width="36" height="36" rx="11"/>
        <rect x="80" width="36" height="36" rx="11"/>
      </g>
      <g fill="none" stroke="#ecf3fb" stroke-width="2" stroke-linecap="round">
        <path d="M481 132h14"/>
        <rect x="523" y="119" width="12" height="10" rx="1"/>
        <rect x="519" y="123" width="12" height="10" rx="1"/>
        <path d="M562 118l12 12m0-12l-12 12"/>
      </g>
    </g>
  </g>

  <g font-family="Segoe UI, sans-serif">
    <text x="850" y="142" fill="#f4f7fb" font-size="26" font-weight="650">看见后直接处理</text>
    <text x="850" y="194" fill="#b1bfd2" font-size="17">— 最小化当前窗口</text>
    <text x="850" y="232" fill="#b1bfd2" font-size="17">— 最大化或还原窗口</text>
    <text x="850" y="270" fill="#b1bfd2" font-size="17">— 正常关闭，不强杀进程</text>
    <rect x="850" y="316" width="260" height="58" rx="15" fill="#177fd2"/>
    <text x="980" y="352" fill="#fff" text-anchor="middle" font-size="17" font-weight="600">无需再打开右键菜单</text>
    <text x="850" y="424" fill="#72b8ff" font-size="15">按钮随真实窗口状态变化</text>
    <text x="850" y="454" fill="#96a8c0" font-size="14">操作后关闭旧画面，由 WinEvent 刷新</text>
  </g>
</svg>
