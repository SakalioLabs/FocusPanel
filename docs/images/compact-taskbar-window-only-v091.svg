<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#dde9fb"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset="1" stop-color="#edf5ff" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#173a62" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="180" fill="#5c9ff0" opacity=".12"/>
  <circle cx="100" cy="590" r="170" fill="#8065d9" opacity=".1"/>

  <text x="66" y="72" font-family="Microsoft YaHei, Segoe UI" font-size="25" font-weight="700" fill="#17263d">任务栏不是任务管理器</text>
  <text x="66" y="105" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#60718a">只保留用户固定项，以及真正拥有普通或最小化窗口的应用</text>

  <rect x="70" y="142" width="92" height="420" rx="28" fill="url(#glass)" stroke="#fff" filter="url(#shadow)"/>
  <text x="116" y="174" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="11" fill="#5b6d85">Panel</text>
  <line x1="86" y1="190" x2="146" y2="190" stroke="#d4deea"/>
  <g>
    <rect x="88" y="210" width="56" height="56" rx="13" fill="#dcecff"/>
    <rect x="102" y="224" width="28" height="28" rx="7" fill="#1677d2"/>
    <rect x="85" y="226" width="4" height="24" rx="2" fill="#1677d2"/>
    <rect x="88" y="278" width="56" height="56" rx="13" fill="#f5f8fc"/>
    <circle cx="116" cy="306" r="15" fill="#f2b72d"/>
    <rect x="85" y="292" width="4" height="12" rx="2" fill="#1677d2" opacity=".6"/>
    <rect x="88" y="346" width="56" height="56" rx="13" fill="#f5f8fc"/>
    <rect x="102" y="360" width="28" height="28" rx="7" fill="#745ed0"/>
    <rect x="85" y="367" width="4" height="7" rx="2" fill="#1677d2" opacity=".35"/>
  </g>
  <line x1="86" y1="422" x2="146" y2="422" stroke="#d4deea"/>
  <text x="116" y="458" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="11" fill="#5b6d85">状态</text>
  <text x="116" y="495" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="11" fill="#5b6d85">18:42</text>

  <rect x="222" y="150" width="410" height="360" rx="22" fill="#fff" stroke="#d3dfec" filter="url(#shadow)"/>
  <circle cx="252" cy="187" r="12" fill="#2daf68"/>
  <text x="277" y="193" font-family="Microsoft YaHei, Segoe UI" font-size="18" font-weight="700" fill="#17263d">显示在紧凑任务栏</text>
  <g font-family="Microsoft YaHei, Segoe UI">
    <rect x="250" y="222" width="354" height="68" rx="13" fill="#e7f4ec"/>
    <circle cx="280" cy="256" r="15" fill="#1677d2"/>
    <text x="310" y="251" font-size="15" font-weight="700" fill="#21344e">用户固定的应用</text>
    <text x="310" y="273" font-size="12" fill="#5d7187">运行与否都尊重用户选择</text>
    <rect x="250" y="304" width="354" height="68" rx="13" fill="#e7f4ec"/>
    <circle cx="280" cy="338" r="15" fill="#f0b629"/>
    <text x="310" y="333" font-size="15" font-weight="700" fill="#21344e">拥有普通窗口的应用</text>
    <text x="310" y="355" font-size="12" fill="#5d7187">当前、后台或最大化都保留</text>
    <rect x="250" y="386" width="354" height="68" rx="13" fill="#e7f4ec"/>
    <circle cx="280" cy="420" r="15" fill="#745ed0"/>
    <text x="310" y="415" font-size="15" font-weight="700" fill="#21344e">拥有最小化窗口的应用</text>
    <text x="310" y="437" font-size="12" fill="#5d7187">缩小后仍能从任务栏还原</text>
  </g>

  <rect x="666" y="150" width="444" height="360" rx="22" fill="#173f69" filter="url(#shadow)"/>
  <circle cx="698" cy="187" r="12" fill="#ff7373"/>
  <text x="723" y="193" font-family="Microsoft YaHei, Segoe UI" font-size="18" font-weight="700" fill="#fff">不再混进紧凑任务栏</text>
  <g font-family="Microsoft YaHei, Segoe UI">
    <rect x="696" y="222" width="384" height="54" rx="12" fill="#28547d"/>
    <text x="720" y="255" font-size="14" fill="#dcecff">未固定的托盘常驻程序</text>
    <rect x="696" y="288" width="384" height="54" rx="12" fill="#28547d"/>
    <text x="720" y="321" font-size="14" fill="#dcecff">消息窗口与无窗口后台宿主</text>
    <rect x="696" y="354" width="384" height="54" rx="12" fill="#28547d"/>
    <text x="720" y="387" font-size="14" fill="#dcecff">任务管理器式后台进程</text>
    <path d="M696 438h384" stroke="#3f688f"/>
    <text x="696" y="470" font-size="13" fill="#bcd8f3">需要时仍可进入独立“后台与窗口”抽屉</text>
  </g>
  <text x="590" y="560" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#47617f">任务栏滚动数量与全局应用快捷键同步使用同一份干净列表</text>
</svg>
