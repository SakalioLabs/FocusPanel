<svg xmlns="http://www.w3.org/2000/svg" width="980" height="480" viewBox="0 0 980 480">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d88a8"/>
      <stop offset=".48" stop-color="#9c7990"/>
      <stop offset="1" stop-color="#31465f"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#dce9fa" stop-opacity=".24"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="25"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0c1727" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="980" height="480" rx="28" fill="url(#wall)"/>
  <g opacity=".42" filter="url(#blur)">
    <circle cx="210" cy="132" r="130" fill="#d7bdca"/>
    <circle cx="550" cy="398" r="180" fill="#8ccbd2"/>
    <rect x="670" y="30" width="210" height="370" rx="80" fill="#263b56"/>
  </g>

  <text x="54" y="66" fill="#f8fbff" font-family="Segoe UI Variable Display,Segoe UI" font-size="24" font-weight="600">不中断当前工作流的 FocusPanel 通知</text>
  <text x="54" y="94" fill="#e6edf7" font-family="Segoe UI Variable Text,Segoe UI" font-size="14">不依赖 Explorer 托盘气泡 · 无激活显示 · DWM 原生毛玻璃</text>

  <g transform="translate(142 148)" filter="url(#shadow)">
    <rect width="620" height="184" rx="24" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".24"/>
    <rect x="24" y="24" width="48" height="48" rx="12" fill="#1677c8" fill-opacity=".22"/>
    <text x="48" y="56" text-anchor="middle" fill="#d9f0ff" font-family="Segoe Fluent Icons" font-size="21"></text>
    <text x="92" y="45" fill="#ffffff" font-family="Segoe UI Variable Display,Segoe UI" font-size="17" font-weight="600">FocusPanel 更新可用</text>
    <text x="92" y="72" fill="#edf3fb" font-family="Segoe UI Variable Text,Segoe UI" font-size="14">GitHub 已发布 v0.9.82，可在设置中一键安装。</text>
    <text x="582" y="47" text-anchor="middle" fill="#eef4fc" font-family="Segoe Fluent Icons" font-size="14"></text>
    <rect x="92" y="112" width="118" height="44" rx="12" fill="#1686d9"/>
    <text x="151" y="140" text-anchor="middle" fill="#ffffff" font-family="Segoe UI Variable Text,Segoe UI" font-size="14" font-weight="600">打开更新</text>
    <text x="232" y="139" fill="#e8f0fa" font-family="Segoe UI Variable Text,Segoe UI" font-size="12">7 秒自动关闭 · 悬停暂停</text>
  </g>

  <g transform="translate(788 112)">
    <rect width="76" height="292" rx="24" fill="#121a25" fill-opacity=".54" stroke="#ffffff" stroke-opacity=".16"/>
    <circle cx="38" cy="42" r="19" fill="#ffffff" fill-opacity=".10"/>
    <text x="38" y="49" text-anchor="middle" fill="#ffffff" font-family="Segoe Fluent Icons" font-size="17"></text>
    <circle cx="38" cy="101" r="19" fill="#ffffff" fill-opacity=".10"/>
    <text x="38" y="108" text-anchor="middle" fill="#ffffff" font-family="Segoe Fluent Icons" font-size="17"></text>
    <rect x="17" y="136" width="42" height="84" rx="14" fill="#ffffff" fill-opacity=".08"/>
    <circle cx="38" cy="246" r="19" fill="#1686d9" fill-opacity=".72"/>
    <text x="38" y="253" text-anchor="middle" fill="#ffffff" font-family="Segoe Fluent Icons" font-size="17"></text>
  </g>

  <path d="M764 246h18" stroke="#e9f2fc" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="490" y="402" text-anchor="middle" fill="#f1f6fc" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">Toast 位于 Panel 左侧，只有点击操作按钮后才激活工作区</text>
</svg>
