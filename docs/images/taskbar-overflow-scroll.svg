<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 应用任务栏整区滚动</title>
  <desc id="desc">应用图标、空白区域和上下导航按钮都支持滚动，导航按钮拥有四十四像素点击区。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#94b8ef" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#78bbff"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1070" cy="80" r="200" fill="#278bf0" opacity=".12"/>
  <circle cx="90" cy="470" r="190" fill="#8b5cf6" opacity=".09"/>

  <text x="62" y="68" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">应用栏不用再精确瞄准</text>
  <text x="62" y="102" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="17">整条溢出区域共享滚动，保留多窗口快速切换</text>

  <g filter="url(#shadow)">
    <rect x="82" y="132" width="116" height="330" rx="28" fill="url(#glass)" stroke="#6d809b"/>
    <rect x="100" y="150" width="80" height="44" rx="13" fill="#278bf0" opacity=".28" stroke="#78bbff"/>
    <path d="M132 177l8-8 8 8" fill="none" stroke="#eaf5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <rect x="104" y="208" width="72" height="54" rx="14" fill="#fff" opacity=".08"/>
      <circle cx="140" cy="235" r="16" fill="#4f8ee8"/>
      <path d="M134 228h12v14h-12z" fill="#fff" opacity=".9"/>
      <rect x="104" y="270" width="72" height="54" rx="14" fill="#278bf0" opacity=".22" stroke="#78bbff"/>
      <circle cx="140" cy="297" r="16" fill="#f0b642"/>
      <path d="M132 291h16v12h-16z" fill="#fff" opacity=".9"/>
      <rect x="104" y="332" width="72" height="30" rx="12" fill="#fff" opacity=".04" stroke="#8190a5" stroke-dasharray="4 5"/>
      <text x="140" y="353" text-anchor="middle" fill="#9dabc0" font-family="Segoe UI" font-size="18">•••</text>
      <rect x="100" y="400" width="80" height="44" rx="13" fill="#278bf0" opacity=".28" stroke="#78bbff"/>
      <path d="M132 417l8 8 8-8" fill="none" stroke="#eaf5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <path d="M240 390C285 370 285 225 240 205" fill="none" stroke="#78bbff" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="277" y="289" fill="#dce8f8" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">任意位置滚动</text>
  <text x="277" y="319" fill="#9eb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">图标 · 空白 · 上下按钮</text>

  <g filter="url(#shadow)">
    <rect x="480" y="146" width="300" height="292" rx="24" fill="url(#glass)" stroke="#6d809b"/>
    <text x="514" y="190" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="650">44px 点击区</text>
    <text x="514" y="220" fill="#9eb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">视觉仍轻量，命中范围更宽容</text>
    <rect x="566" y="255" width="128" height="128" rx="24" fill="#278bf0" opacity=".16" stroke="#78bbff" stroke-dasharray="7 6"/>
    <rect x="594" y="283" width="72" height="72" rx="18" fill="#278bf0" opacity=".35"/>
    <path d="M615 331l15-15 15 15" fill="none" stroke="#f4f8ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M548 397h164" stroke="#78bbff" stroke-width="2"/>
    <path d="M548 389v16m164-16v16" stroke="#78bbff" stroke-width="2"/>
    <text x="630" y="424" text-anchor="middle" fill="#9ccaff" font-family="Segoe UI, Microsoft YaHei" font-size="14">44px 最小交互高度</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="842" y="168" width="290" height="244" rx="24" fill="#202c3f" stroke="#63748f"/>
    <text x="876" y="214" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="650">滚轮语义不冲突</text>
    <rect x="876" y="242" width="222" height="54" rx="14" fill="#fff" opacity=".06"/>
    <text x="894" y="265" fill="#dce8f8" font-family="Segoe UI, Microsoft YaHei" font-size="15">滚轮</text>
    <text x="894" y="285" fill="#9eb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="13">浏览固定与运行应用</text>
    <rect x="876" y="310" width="222" height="70" rx="14" fill="#278bf0" opacity=".20" stroke="#78bbff"/>
    <text x="894" y="335" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="15" font-weight="600">Ctrl + 滚轮</text>
    <text x="894" y="358" fill="#b8d9ff" font-family="Segoe UI, Microsoft YaHei" font-size="13">多窗口应用内稳定切换</text>
  </g>
</svg>
