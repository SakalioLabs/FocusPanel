<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">两阶段异步安全退出</title>
  <desc id="desc">首次退出立即恢复任务栏并取消窗口关闭，停止新的界面操作后异步排空多个保存队列，完成后第二次关闭真正销毁窗口；重复请求只等待同一事务。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1728"/>
      <stop offset="1" stop-color="#1c2b46"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1120" height="470" rx="28" fill="url(#bg)"/>
  <text x="54" y="61" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="650">退出不冻结界面，也不丢最后一次保存</text>
  <text x="54" y="96" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="15">第一次关闭负责停产与排空，第二次关闭才真正销毁窗口</text>

  <g filter="url(#shadow)">
    <rect x="54" y="139" width="224" height="222" rx="22" fill="#1d2a42" stroke="#344969"/>
    <circle cx="91" cy="179" r="18" fill="#173d54"/>
    <path d="M83 171l16 16m0-16l-16 16" stroke="#7dd3fc" stroke-width="2.4" stroke-linecap="round"/>
    <text x="121" y="186" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">退出请求</text>
    <text x="80" y="234" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">立即恢复任务栏</text>
    <text x="80" y="268" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">第一次 Closing 取消</text>
    <text x="80" y="302" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">停止热区与新操作</text>
    <rect x="80" y="322" width="158" height="25" rx="9" fill="#132137"/>
    <text x="95" y="340" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="12">Dispatcher 保持响应</text>
  </g>

  <path d="M298 250h72" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="307" y="231" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="13">await</text>

  <g filter="url(#shadow)">
    <rect x="390" y="121" width="330" height="258" rx="22" fill="#1d2a42" stroke="#50658a"/>
    <rect x="416" y="147" width="278" height="46" rx="13" fill="url(#accent)" opacity=".94"/>
    <text x="435" y="176" fill="#fff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">并行排空后台生命周期</text>
    <g fill="#142238" stroke="#304762">
      <rect x="416" y="213" width="124" height="38" rx="11"/>
      <rect x="554" y="213" width="140" height="38" rx="11"/>
      <rect x="416" y="263" width="124" height="38" rx="11"/>
      <rect x="554" y="263" width="140" height="38" rx="11"/>
      <rect x="416" y="313" width="124" height="38" rx="11"/>
      <rect x="554" y="313" width="140" height="38" rx="11"/>
    </g>
    <g fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="13">
      <text x="441" y="237">任务保存</text>
      <text x="577" y="237">桌面布局与拖拽</text>
      <text x="441" y="287">番茄钟</text>
      <text x="577" y="287">固定应用排序</text>
      <text x="441" y="337">音频控制</text>
      <text x="577" y="337">启动项 / Shell 设置</text>
    </g>
  </g>

  <path d="M740 250h72" stroke="#86efac" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="746" y="231" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="13">全部完成</text>

  <g filter="url(#shadow)">
    <rect x="832" y="151" width="234" height="198" rx="22" fill="#18352f" stroke="#34705f"/>
    <circle cx="875" cy="198" r="21" fill="#245746"/>
    <path d="M865 198l7 7 14-17" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="910" y="205" fill="#ecfdf5" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">允许关闭</text>
    <text x="860" y="258" fill="#bbf7d0" font-family="Segoe UI, sans-serif" font-size="14">推进完成状态</text>
    <text x="860" y="292" fill="#bbf7d0" font-family="Segoe UI, sans-serif" font-size="14">第二次 Close</text>
    <text x="860" y="326" fill="#bbf7d0" font-family="Segoe UI, sans-serif" font-size="14">触发正常 OnExit 恢复</text>
  </g>

  <text x="54" y="423" fill="#93a4bd" font-family="Segoe UI, sans-serif" font-size="13">普通点关闭仍隐藏到托盘；退出进行中再次点击只等待已有排空事务，不会重复保存或重复销毁。</text>
</svg>
