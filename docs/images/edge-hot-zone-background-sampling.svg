<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">右缘热区后台采样与低频 UI 提交</title>
  <desc id="desc">后台定时器每三十毫秒读取物理鼠标和全屏状态，纯逻辑检测器按用户选择的停留阈值判断与锁定，只在状态改变或需要打开时向 WPF Dispatcher 提交事件；切换灵敏度、停止和显示器变化都会重置检测状态。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1728"/>
      <stop offset="1" stop-color="#1b2943"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#67e8f9"/>
    </marker>
  </defs>
  <rect width="1120" height="450" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="650">30ms 采样留在后台，WPF 只接收真正事件</text>
  <text x="54" y="96" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="15">40 / 100 / 180 / 300ms 四档可选，布局和动画繁忙时仍保持物理右缘判断</text>

  <g filter="url(#shadow)">
    <rect x="54" y="137" width="248" height="224" rx="22" fill="#1c2a42" stroke="#334966"/>
    <rect x="78" y="160" width="200" height="43" rx="12" fill="url(#accent)" opacity=".92"/>
    <text x="96" y="187" fill="#fff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">后台 PeriodicTimer</text>
    <circle cx="96" cy="236" r="9" fill="#22d3ee"/>
    <text x="116" y="242" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">物理鼠标坐标</text>
    <circle cx="96" cy="274" r="9" fill="#60a5fa"/>
    <text x="116" y="280" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">目标屏幕边界</text>
    <circle cx="96" cy="312" r="9" fill="#818cf8"/>
    <text x="116" y="318" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">前台全屏状态</text>
  </g>

  <path d="M322 248h79" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="333" y="230" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="13">每 30ms</text>

  <g filter="url(#shadow)">
    <rect x="421" y="126" width="286" height="246" rx="22" fill="#1c2a42" stroke="#4f6388"/>
    <text x="449" y="171" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600">纯逻辑热区检测</text>
    <rect x="449" y="198" width="230" height="42" rx="12" fill="#142238"/>
    <text x="469" y="225" fill="#bae6fd" font-family="Segoe UI, sans-serif" font-size="14">12px 感应带 · 可调停留阈值</text>
    <rect x="449" y="255" width="230" height="42" rx="12" fill="#142238"/>
    <text x="469" y="282" fill="#c7d2fe" font-family="Segoe UI, sans-serif" font-size="14">32px 复位 · 全屏抑制</text>
    <rect x="449" y="312" width="230" height="36" rx="11" fill="#26304c"/>
    <text x="469" y="336" fill="#ddd6fe" font-family="Segoe UI, sans-serif" font-size="13">显示器修订 + 启停代际</text>
  </g>

  <path d="M727 212h82" stroke="#86efac" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="736" y="194" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="13">状态改变</text>
  <path d="M727 302h82" stroke="#f0abfc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="736" y="284" fill="#f0abfc" font-family="Segoe UI, sans-serif" font-size="13">满足停留</text>

  <g filter="url(#shadow)">
    <rect x="829" y="137" width="237" height="224" rx="22" fill="#1c2a42" stroke="#486789"/>
    <text x="856" y="179" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600">WPF Dispatcher</text>
    <rect x="856" y="207" width="182" height="48" rx="14" fill="#173a3a" stroke="#34706c"/>
    <text x="878" y="237" fill="#ccfbf1" font-family="Segoe UI, sans-serif" font-size="14">更新 3px 指示状态</text>
    <rect x="856" y="277" width="182" height="48" rx="14" fill="#342d52" stroke="#6b5ca3"/>
    <text x="878" y="307" fill="#ede9fe" font-family="Segoe UI, sans-serif" font-size="14">呼出 76px 紧凑栏</text>
  </g>

  <text x="54" y="412" fill="#93a4bd" font-family="Segoe UI, sans-serif" font-size="13">切换灵敏度会清空当前停留；Stop、托盘隐藏或换屏后，旧采样即使完成也不会再打开 Panel。</text>
</svg>
