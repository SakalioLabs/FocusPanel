<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="540" viewBox="0 0 1120 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#162238"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1120" height="540" rx="30" fill="url(#bg)"/>
  <text x="56" y="66" fill="#f3f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="600">应用搜索：先相关，再固定</text>
  <text x="56" y="100" fill="#9fb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">输入缩写、多词或规范化名称，结果按匹配质量稳定排序</text>

  <g filter="url(#shadow)">
    <rect x="56" y="132" width="1008" height="72" rx="18" fill="#202d42" stroke="#3c4d68"/>
    <circle cx="94" cy="168" r="16" fill="none" stroke="#8fbfff" stroke-width="3"/>
    <line x1="106" y1="180" x2="117" y2="191" stroke="#8fbfff" stroke-width="3" stroke-linecap="round"/>
    <text x="138" y="177" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei" font-size="23">vsc</text>
    <rect x="930" y="149" width="104" height="38" rx="12" fill="#263852"/>
    <text x="982" y="174" text-anchor="middle" fill="#aec9ed" font-family="Segoe UI, Microsoft YaHei" font-size="15">缩写匹配</text>
  </g>

  <g font-family="Segoe UI, Microsoft YaHei">
    <rect x="56" y="228" width="1008" height="78" rx="18" fill="#253650" stroke="#68a9ff" stroke-width="2"/>
    <rect x="72" y="244" width="48" height="48" rx="14" fill="url(#accent)"/>
    <text x="96" y="277" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">V</text>
    <text x="142" y="260" fill="#fff" font-size="21" font-weight="600">Visual Studio Code</text>
    <text x="142" y="287" fill="#aebed4" font-size="15">词首缩写 V · S · C</text>
    <rect x="888" y="248" width="146" height="38" rx="12" fill="#17395f"/>
    <text x="961" y="273" text-anchor="middle" fill="#b8d9ff" font-size="15">第 1 个相关结果</text>

    <rect x="56" y="320" width="1008" height="70" rx="18" fill="#1c293c" stroke="#33455f"/>
    <rect x="72" y="331" width="48" height="48" rx="14" fill="#40516b"/>
    <text x="96" y="364" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">V</text>
    <text x="142" y="350" fill="#dce7f7" font-size="20">Visual Studio Installer</text>
    <text x="142" y="375" fill="#91a3bb" font-size="15">部分词首匹配</text>

    <rect x="56" y="404" width="1008" height="70" rx="18" fill="#1c293c" stroke="#33455f"/>
    <rect x="72" y="415" width="48" height="48" rx="14" fill="#40516b"/>
    <text x="96" y="448" text-anchor="middle" fill="#fff" font-size="22" font-weight="700">C</text>
    <text x="142" y="434" fill="#dce7f7" font-size="20">Code Viewer</text>
    <text x="142" y="459" fill="#91a3bb" font-size="15">固定应用 · 仅在同等级内优先</text>
    <path d="M 974 423 l 6 12 14 2-10 10 3 14-13-7-13 7 3-14-10-10 14-2z" fill="#ffc857"/>
  </g>

  <text x="56" y="512" fill="#8194ae" font-family="Segoe UI, Microsoft YaHei" font-size="15">完整名称 → 程序名 → 前缀 → 缩写 → 多词前缀 → 包含</text>
</svg>
