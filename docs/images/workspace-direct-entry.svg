<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 工作区直接入口</title>
  <desc id="desc">点击紧凑栏工作按钮直接打开最近工作区，顶部六个模块入口持续可见，不再经过 Focus 中心。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081220"/>
      <stop offset="1" stop-color="#172947"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#578bff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1080" height="420" rx="28" fill="url(#bg)"/>
  <text x="48" y="58" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">一次点击进入工作，不再经过重复中心</text>
  <text x="48" y="90" fill="#9fb1d1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">普通点击回到最近工作区；完整模块导航在展开后持续可见</text>

  <g transform="translate(48 126)" filter="url(#shadow)">
    <rect width="104" height="238" rx="24" fill="#182642" stroke="#385078"/>
    <text x="52" y="30" text-anchor="middle" fill="#879bbd" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">紧凑栏</text>
    <rect x="20" y="54" width="64" height="64" rx="18" fill="url(#accent)"/>
    <path d="M40 76h24v20H40zM45 70h14v6H45z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="52" y="142" text-anchor="middle" fill="#f4f7ff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="650">工作</text>
    <text x="52" y="174" text-anchor="middle" fill="#8298bc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">普通点击</text>
    <text x="52" y="194" text-anchor="middle" fill="#8298bc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">直接进入</text>
  </g>

  <path d="M178 245h80" stroke="#6f88b2" stroke-width="3" stroke-linecap="round"/>
  <path d="M246 236l12 9-12 9" fill="none" stroke="#6f88b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(286 126)" filter="url(#shadow)">
    <rect width="746" height="238" rx="24" fill="#182642" stroke="#385078"/>
    <text x="26" y="36" fill="#f3f6fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="19" font-weight="650">桌面收纳</text>
    <text x="720" y="35" text-anchor="end" fill="#8298bc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">最近工作区</text>
    <g transform="translate(24 58)">
      <rect width="108" height="42" rx="12" fill="#263b61"/>
      <text x="54" y="27" text-anchor="middle" fill="#cbd9ef" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">概览</text>
      <rect x="116" width="108" height="42" rx="12" fill="url(#accent)"/>
      <text x="170" y="27" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">桌面收纳</text>
      <rect x="232" width="108" height="42" rx="12" fill="#263b61"/>
      <text x="286" y="27" text-anchor="middle" fill="#cbd9ef" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">任务</text>
      <rect x="348" width="108" height="42" rx="12" fill="#263b61"/>
      <text x="402" y="27" text-anchor="middle" fill="#cbd9ef" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">番茄钟</text>
      <rect x="464" width="108" height="42" rx="12" fill="#263b61"/>
      <text x="518" y="27" text-anchor="middle" fill="#cbd9ef" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">AI</text>
      <rect x="580" width="108" height="42" rx="12" fill="#263b61"/>
      <text x="634" y="27" text-anchor="middle" fill="#cbd9ef" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">设置</text>
    </g>
    <rect x="24" y="120" width="698" height="92" rx="16" fill="#111d33"/>
    <rect x="42" y="139" width="184" height="12" rx="6" fill="#34496d"/>
    <rect x="42" y="161" width="312" height="9" rx="4.5" fill="#263a5b"/>
    <rect x="42" y="180" width="254" height="9" rx="4.5" fill="#263a5b"/>
    <rect x="632" y="143" width="70" height="48" rx="14" fill="#223655"/>
    <path d="M653 167h28" stroke="#75a3ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M675 160l8 7-8 7" fill="none" stroke="#75a3ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
