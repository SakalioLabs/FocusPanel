<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Panel 原生后台应用、ICO 固化与密排收纳图标</title>
  <desc id="desc">左侧展示 Panel 自有后台应用抽屉，中间展示自定义 ICO 固化流程，右侧展示固定间距的密排收纳图标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#26364d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#26374d" stop-opacity=".96"/><stop offset="1" stop-color="#172337" stop-opacity=".96"/></linearGradient>
  </defs>
  <rect width="1200" height="560" rx="34" fill="url(#bg)"/>
  <text x="52" y="62" fill="#f5f9ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">真正留在 Panel 里，也真正排整齐</text>
  <text x="52" y="91" fill="#a9bdd5" font-family="Segoe UI, Microsoft YaHei" font-size="15">0.11.61 · 不弹原生隐藏图标区 · ICO 自有存储 · 12px 固定节奏</text>

  <rect x="42" y="122" width="330" height="390" rx="24" fill="url(#card)" stroke="#4c6480"/>
  <text x="68" y="163" fill="#dcecff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">后台应用与窗口</text>
  <text x="68" y="188" fill="#8fabc8" font-family="Segoe UI, Microsoft YaHei" font-size="13">Panel 自有抽屉</text>
  <g font-family="Segoe UI, Microsoft YaHei" font-size="14">
    <rect x="64" y="216" width="286" height="62" rx="14" fill="#314967"/><circle cx="95" cy="247" r="17" fill="#60a5fa"/><text x="125" y="243" fill="#f2f7ff">浏览器</text><text x="125" y="263" fill="#a9c5e4">3 个窗口 · 原位展开</text>
    <rect x="64" y="290" width="286" height="62" rx="14" fill="#253a52"/><circle cx="95" cy="321" r="17" fill="#34d399"/><text x="125" y="317" fill="#f2f7ff">同步工具</text><text x="125" y="337" fill="#a9c5e4">后台运行 · 点击打开</text>
    <rect x="64" y="364" width="286" height="62" rx="14" fill="#253a52"/><circle cx="95" cy="395" r="17" fill="#fbbf24"/><text x="125" y="391" fill="#f2f7ff">聊天应用</text><text x="125" y="411" fill="#a9c5e4">需要注意 · 可固定</text>
  </g>
  <rect x="64" y="446" width="286" height="38" rx="12" fill="#163c4b"/><text x="207" y="470" text-anchor="middle" fill="#76e3c3" font-family="Segoe UI, Microsoft YaHei" font-size="14">不经过 Shell_TrayWnd</text>

  <rect x="394" y="122" width="260" height="390" rx="24" fill="url(#card)" stroke="#4c6480"/>
  <text x="420" y="163" fill="#dcecff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">自定义 ICO 固化</text>
  <g font-family="Segoe UI, Microsoft YaHei" text-anchor="middle">
    <rect x="432" y="214" width="184" height="58" rx="14" fill="#2c425e"/><text x="524" y="249" fill="#f2f7ff" font-size="15">快捷方式 custom.ico</text>
    <path d="M524 279v42" stroke="#6fd5b7" stroke-width="3"/><path d="m517 314 7 9 7-9" fill="none" stroke="#6fd5b7" stroke-width="3"/>
    <rect x="432" y="330" width="184" height="66" rx="14" fill="#174b45"/><text x="524" y="357" fill="#a7f3d0" font-size="14">按内容哈希复制</text><text x="524" y="378" fill="#71d9ba" font-size="12">FocusPanel\Icons</text>
    <path d="M524 403v31" stroke="#6fd5b7" stroke-width="3"/><path d="m517 427 7 9 7-9" fill="none" stroke="#6fd5b7" stroke-width="3"/>
    <text x="524" y="467" fill="#dffaf1" font-size="14">收纳、刷新、重启后仍保留</text>
  </g>

  <rect x="676" y="122" width="482" height="390" rx="24" fill="url(#card)" stroke="#4c6480"/>
  <text x="704" y="163" fill="#dcecff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">图标视图 · 密排换行</text>
  <text x="704" y="188" fill="#8fabc8" font-family="Segoe UI, Microsoft YaHei" font-size="13">固定卡片尺寸，每边 6px；最后一行从左连续排列</text>
  <g font-family="Segoe UI, Microsoft YaHei" font-size="12" text-anchor="middle" fill="#dcecff">
    <g transform="translate(704 220)"><rect width="96" height="104" rx="14" fill="#2b405a"/><circle cx="48" cy="40" r="22" fill="#60a5fa"/><text x="48" y="84">设计</text></g>
    <g transform="translate(812 220)"><rect width="96" height="104" rx="14" fill="#2b405a"/><circle cx="48" cy="40" r="22" fill="#34d399"/><text x="48" y="84">文档</text></g>
    <g transform="translate(920 220)"><rect width="96" height="104" rx="14" fill="#2b405a"/><circle cx="48" cy="40" r="22" fill="#f59e0b"/><text x="48" y="84">工具</text></g>
    <g transform="translate(1028 220)"><rect width="96" height="104" rx="14" fill="#2b405a"/><circle cx="48" cy="40" r="22" fill="#a78bfa"/><text x="48" y="84">项目</text></g>
    <g transform="translate(704 336)"><rect width="96" height="104" rx="14" fill="#2b405a"/><circle cx="48" cy="40" r="22" fill="#fb7185"/><text x="48" y="84">图片</text></g>
    <g transform="translate(812 336)"><rect width="96" height="104" rx="14" fill="#2b405a"/><circle cx="48" cy="40" r="22" fill="#22d3ee"/><text x="48" y="84">临时</text></g>
  </g>
  <path d="M704 466h420" stroke="#46617f" stroke-dasharray="5 7"/><text x="914" y="490" text-anchor="middle" fill="#7fe0c3" font-family="Segoe UI, Microsoft YaHei" font-size="14">不会把剩余宽度拉成随机空洞</text>
</svg>
