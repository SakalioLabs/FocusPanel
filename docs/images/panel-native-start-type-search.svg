<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#020617" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1000" height="420" rx="30" fill="url(#bg)"/>
  <text x="54" y="58" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">开始与输入都留在 Panel 内</text>
  <text x="54" y="88" fill="#94a3b8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14">不唤起 Windows 开始菜单 · 不监听其他应用键盘 · 不丢首字符</text>

  <g filter="url(#shadow)">
    <rect x="54" y="122" width="102" height="236" rx="25" fill="#111c33" stroke="#334155"/>
  </g>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" text-anchor="middle">
    <rect x="68" y="140" width="74" height="52" rx="14" fill="#183b58" stroke="#38bdf8"/>
    <text x="105" y="164" fill="#7dd3fc" font-size="20">⊞</text>
    <text x="105" y="181" fill="#dbeafe" font-size="11">开始</text>
    <rect x="68" y="201" width="74" height="42" rx="12" fill="#1e293b"/>
    <text x="105" y="227" fill="#cbd5e1" font-size="12">窗口</text>
    <rect x="68" y="251" width="74" height="42" rx="12" fill="#1e293b"/>
    <text x="105" y="277" fill="#cbd5e1" font-size="12">应用</text>
    <rect x="68" y="301" width="74" height="42" rx="12" fill="#1e293b"/>
    <text x="105" y="327" fill="#cbd5e1" font-size="12">状态</text>
  </g>

  <path d="M181 205 C226 205 231 205 272 205" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M262 197 L274 205 L262 213" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="187" y="151" width="78" height="38" rx="12" fill="#0c4a6e"/>
  <text x="226" y="175" text-anchor="middle" fill="#e0f2fe" font-family="Cascadia Mono,Microsoft YaHei,sans-serif" font-size="15">输入“画图”</text>

  <g filter="url(#shadow)">
    <rect x="292" y="122" width="654" height="236" rx="25" fill="#111c33" stroke="#334155"/>
  </g>
  <text x="322" y="157" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" font-weight="600">Panel 统一搜索</text>
  <rect x="320" y="176" width="598" height="48" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".65"/>
  <text x="344" y="207" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16">画图</text>
  <line x1="380" y1="190" x2="380" y2="211" stroke="#7dd3fc" stroke-width="2"/>

  <g transform="translate(320,242)">
    <rect width="286" height="78" rx="16" fill="#183b58" stroke="#38bdf8" stroke-opacity=".55"/>
    <rect x="16" y="17" width="44" height="44" rx="12" fill="#22c55e"/>
    <text x="76" y="35" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16">Paint.NET</text>
    <text x="76" y="56" fill="#7dd3fc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12">应用 · 最近启动</text>
  </g>
  <g transform="translate(620,242)">
    <rect width="298" height="78" rx="16" fill="#1e293b"/>
    <rect x="16" y="17" width="44" height="44" rx="12" fill="#6366f1"/>
    <text x="76" y="35" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="16">画图工具设置</text>
    <text x="76" y="56" fill="#a5b4fc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12">Panel 系统与应用结果</text>
  </g>

  <text x="54" y="395" fill="#a5b4fc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13">Shift+开始 → 统一搜索　·　再次 Shift+开始 → 只关闭搜索层　·　右键 → Panel 系统管理菜单</text>
</svg>
