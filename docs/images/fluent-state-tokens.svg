<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="desktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#9ec9e8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1180" height="500" rx="32" fill="url(#bg)"/>
  <text x="62" y="72" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">动态状态色令牌</text>
  <text x="62" y="106" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">页面不直接写颜色 · 深色、浅色、高对比度和 Windows 强调色由 ThemeService 统一生成</text>

  <g transform="translate(62 148)" filter="url(#shadow)">
    <rect width="514" height="286" rx="22" fill="#232d39" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="26" y="40" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">右缘运行指示</text>
    <rect x="26" y="62" width="218" height="174" rx="16" fill="#111821"/>
    <rect x="238" y="62" width="6" height="174" rx="3" fill="#ffffff" opacity=".78"/>
    <text x="50" y="260" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="13">深色 · 半透明白</text>
    <rect x="270" y="62" width="218" height="174" rx="16" fill="url(#desktop)"/>
    <rect x="482" y="62" width="6" height="174" rx="3" fill="#168bd5"/>
    <text x="294" y="260" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="13">浅色 · 系统强调色</text>
  </g>

  <g transform="translate(620 148)">
    <rect width="496" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">系统限制警告</text>
    <rect x="24" y="52" width="448" height="50" rx="11" fill="#ffb020" fill-opacity=".2" stroke="#ffc857"/>
    <path d="M45 84l10-18 10 18z" fill="none" stroke="#ffc857" stroke-width="2"/>
    <text x="80" y="83" fill="#f5f7ff" font-family="Segoe UI Variable Text, Microsoft YaHei" font-size="14">背景、描边与文字分别适配主题</text>
  </g>

  <g transform="translate(620 300)">
    <rect width="496" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">模态遮罩</text>
    <rect x="24" y="52" width="448" height="50" rx="11" fill="#dce7f1"/>
    <rect x="24" y="52" width="448" height="50" rx="11" fill="#0b1220" opacity=".22"/>
    <rect x="164" y="60" width="168" height="34" rx="9" fill="#ffffff" opacity=".9"/>
    <text x="248" y="82" text-anchor="middle" fill="#273444" font-family="Segoe UI, Microsoft YaHei" font-size="13">对话内容保持聚焦</text>
  </g>
</svg>
