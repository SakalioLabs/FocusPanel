<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1d2741"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#9bc8ff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65b8ff"/>
      <stop offset="1" stop-color="#3478f6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="34" fill="url(#bg)"/>
  <circle cx="90" cy="70" r="150" fill="#367bf5" opacity=".13"/>
  <circle cx="1000" cy="470" r="210" fill="#62d5c5" opacity=".08"/>

  <text x="64" y="70" fill="#f6f8ff" font-family="Segoe UI,Microsoft YaHei" font-size="28" font-weight="700">管理员启动，不离开统一应用栏</text>
  <text x="64" y="105" fill="#aebbd4" font-family="Segoe UI,Microsoft YaHei" font-size="16">保留原生任务栏肌肉记忆 · 明确交给 Windows UAC</text>

  <g filter="url(#shadow)">
    <rect x="64" y="145" width="360" height="310" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/>
    <rect x="86" y="169" width="58" height="262" rx="24" fill="#10192a" stroke="#fff" stroke-opacity=".13"/>
    <rect x="94" y="181" width="42" height="42" rx="13" fill="#3478f6"/>
    <path d="M105 190h9v9h-9zm11 0h9v9h-9zm-11 11h9v9h-9zm11 0h9v9h-9z" fill="#fff"/>
    <circle cx="115" cy="258" r="20" fill="#2e3950"/>
    <path d="M108 251h14v14h-14z" fill="#75b6ff"/>
    <circle cx="115" cy="311" r="20" fill="#2e3950"/>
    <path d="M108 318l7-16 7 16z" fill="#8ee1c4"/>
    <circle cx="115" cy="364" r="20" fill="#2e3950"/>
    <path d="M108 357h14v14h-14z" fill="#ffbf69"/>

    <rect x="160" y="178" width="238" height="78" rx="18" fill="#0f1728" stroke="#6baaff" stroke-opacity=".55"/>
    <rect x="178" y="195" width="44" height="44" rx="13" fill="#6c5ce7"/>
    <path d="M190 207h20v20h-20z" fill="#fff" opacity=".9"/>
    <text x="238" y="210" fill="#f7f9ff" font-family="Segoe UI,Microsoft YaHei" font-size="17" font-weight="600">代码编辑器</text>
    <text x="238" y="235" fill="#8fa1bf" font-family="Segoe UI,Microsoft YaHei" font-size="13">正在运行 · 2 个窗口</text>

    <rect x="160" y="274" width="238" height="128" rx="18" fill="#111b2e" stroke="#fff" stroke-opacity=".12"/>
    <text x="182" y="305" fill="#dce6f8" font-family="Segoe UI,Microsoft YaHei" font-size="15">启动新实例</text>
    <line x1="176" y1="323" x2="382" y2="323" stroke="#fff" stroke-opacity=".1"/>
    <rect x="174" y="335" width="210" height="48" rx="12" fill="#3478f6" opacity=".2"/>
    <text x="182" y="365" fill="#f7f9ff" font-family="Segoe UI,Microsoft YaHei" font-size="15" font-weight="600">以管理员身份运行</text>
  </g>

  <path d="M462 300h80" stroke="#79b8ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M532 290l12 10-12 10" fill="none" stroke="#79b8ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="570" y="145" width="486" height="310" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/>
    <text x="604" y="188" fill="#aebbd4" font-family="Segoe UI,Microsoft YaHei" font-size="15">快捷手势</text>
    <g font-family="Segoe UI,Microsoft YaHei" font-size="17" font-weight="600" fill="#f8faff">
      <rect x="604" y="207" width="76" height="46" rx="12" fill="#17243b" stroke="#fff" stroke-opacity=".18"/>
      <text x="622" y="237">Ctrl</text>
      <text x="689" y="237" fill="#7f91ad">+</text>
      <rect x="711" y="207" width="82" height="46" rx="12" fill="#17243b" stroke="#fff" stroke-opacity=".18"/>
      <text x="727" y="237">Shift</text>
      <text x="802" y="237" fill="#7f91ad">+</text>
      <rect x="825" y="207" width="148" height="46" rx="12" fill="#17243b" stroke="#fff" stroke-opacity=".18"/>
      <text x="847" y="237">左键应用图标</text>
    </g>
    <g transform="translate(616 286)">
      <path d="M48 0c14 10 29 14 45 16v43c0 31-19 50-45 63C22 109 3 90 3 59V16C19 14 34 10 48 0z" fill="url(#shield)"/>
      <path d="M48 18v84c18-11 28-24 28-43V30c-10-2-19-6-28-12z" fill="#0c5bc4" opacity=".7"/>
      <path d="M33 58l10 10 21-24" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="742" y="315" fill="#f6f8ff" font-family="Segoe UI,Microsoft YaHei" font-size="20" font-weight="700">Windows UAC 接管确认</text>
    <text x="742" y="347" fill="#b5c1d6" font-family="Segoe UI,Microsoft YaHei" font-size="15">Panel 不保存凭据，也不绕过系统同意界面</text>
    <text x="742" y="377" fill="#8ee1c4" font-family="Segoe UI,Microsoft YaHei" font-size="14">✓ 用户取消被识别为取消</text>
    <text x="742" y="403" fill="#8ee1c4" font-family="Segoe UI,Microsoft YaHei" font-size="14">✓ 商店应用不伪装支持提权</text>
  </g>
