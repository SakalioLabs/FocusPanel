<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1d2b44"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#223750"/>
      <stop offset="1" stop-color="#17263b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 Z" fill="#6bb7ff"/>
    </marker>
  </defs>
  <rect width="1120" height="620" rx="32" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei">
    <text x="56" y="66" fill="#f5f8ff" font-size="29" font-weight="600">把窗口带到你正在使用的 Panel 屏幕</text>
    <text x="56" y="103" fill="#9fb1ca" font-size="17">不激活窗口，不改变最大化或最小化状态，位置自动适配目标工作区</text>

    <g filter="url(#shadow)">
      <rect x="56" y="156" width="430" height="286" rx="22" fill="url(#screen)" stroke="#415671"/>
      <text x="82" y="193" fill="#aebed3" font-size="16">显示器 1 · 其他屏幕</text>
      <rect x="102" y="225" width="330" height="180" rx="16" fill="#294361" stroke="#6a87a8"/>
      <rect x="102" y="225" width="330" height="34" rx="16" fill="#375673"/>
      <circle cx="124" cy="242" r="5" fill="#ff938f"/>
      <text x="144" y="248" fill="#eaf2fb" font-size="14">季度方案.docx</text>
      <text x="267" y="324" text-anchor="middle" fill="#a9bdd4" font-size="16">目标窗口</text>
    </g>

    <path d="M500 300 C548 300 563 300 610 300" fill="none" stroke="#6bb7ff" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g filter="url(#shadow)">
      <rect x="634" y="134" width="430" height="330" rx="22" fill="url(#screen)" stroke="#5e8ab2" stroke-width="2"/>
      <text x="660" y="173" fill="#d9efff" font-size="16">显示器 2 · Panel 所在屏幕</text>
      <rect x="690" y="208" width="302" height="206" rx="16" fill="#294361" stroke="#6bb7ff" stroke-width="2"/>
      <rect x="690" y="208" width="302" height="34" rx="16" fill="#3a6385"/>
      <circle cx="712" cy="225" r="5" fill="#ff938f"/>
      <text x="732" y="231" fill="#fff" font-size="14">季度方案.docx</text>
      <text x="841" y="319" text-anchor="middle" fill="#c6def2" font-size="16">保持大小与相对位置</text>
      <rect x="1028" y="162" width="18" height="274" rx="9" fill="#2589d8"/>
      <text x="1037" y="299" text-anchor="middle" fill="#fff" font-size="12" transform="rotate(90 1037 299)">FocusPanel</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="278" y="466" width="564" height="104" rx="18" fill="#202936" stroke="#516077"/>
      <text x="306" y="503" fill="#aebed3" font-size="14">窗口右键菜单</text>
      <rect x="300" y="516" width="520" height="40" rx="11" fill="#326fa7"/>
      <text x="324" y="542" fill="#fff" font-size="17" font-weight="600">移到 Panel 所在屏幕</text>
      <text x="796" y="542" text-anchor="end" fill="#d6e8f8" font-size="14">仅跨屏时显示</text>
    </g>
  </g>
</svg>
