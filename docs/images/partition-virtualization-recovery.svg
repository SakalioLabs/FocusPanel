<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">跨分区移动时的虚拟化容器同步</title>
  <desc id="desc">图标从分区 A 移到分区 B 时，数据集合、容器生成器和视觉子项按顺序同步。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#182943"/></linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="10" stdDeviation="12" flood-color="#020713" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1120" height="400" rx="28" fill="url(#bg)"/>
  <text x="56" y="62" fill="#f5f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">跨分区移动：数据与容器按同一节拍更新</text>
  <text x="56" y="96" fill="#aab8cd" font-family="Segoe UI, Microsoft YaHei" font-size="16">不触碰文件路径或隐藏属性，只修复 WPF 虚拟化生命周期</text>
  <g filter="url(#s)">
    <rect x="56" y="135" width="260" height="205" rx="20" fill="#20334f" stroke="#3c5879"/>
    <text x="82" y="177" fill="#f3f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="650">分区 A</text>
    <rect x="82" y="200" width="208" height="48" rx="12" fill="#31517d"/>
    <text x="102" y="231" fill="#eef6ff" font-family="Segoe UI, Microsoft YaHei" font-size="17">项目卡片</text>
    <text x="82" y="291" fill="#74dcb1" font-family="Segoe UI, Microsoft YaHei" font-size="16">Remove / Move 通知</text>
  </g>
  <path d="M340 238h92" stroke="#76aef2" stroke-width="4" stroke-linecap="round"/><path d="M418 226l16 12-16 12" fill="none" stroke="#76aef2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#s)">
    <rect x="458" y="135" width="290" height="205" rx="20" fill="#20334f" stroke="#3c5879"/>
    <text x="484" y="177" fill="#f3f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="650">容器同步</text>
    <text x="484" y="218" fill="#b8c6d9" font-family="Segoe UI, Microsoft YaHei" font-size="16">1. 清理失效 InternalChildren</text>
    <text x="484" y="252" fill="#b8c6d9" font-family="Segoe UI, Microsoft YaHei" font-size="16">2. 验证 GeneratorPosition</text>
    <text x="484" y="286" fill="#73b9ff" font-family="Segoe UI, Microsoft YaHei" font-size="16" font-weight="600">3. 禁止二次 Remove / Recycle</text>
  </g>
  <path d="M772 238h66" stroke="#76aef2" stroke-width="4" stroke-linecap="round"/><path d="M824 226l16 12-16 12" fill="none" stroke="#76aef2" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#s)">
    <rect x="864" y="135" width="200" height="205" rx="20" fill="#213750" stroke="#406486"/>
    <text x="890" y="177" fill="#f3f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="650">分区 B</text>
    <rect x="890" y="200" width="148" height="48" rx="12" fill="#2b725d"/>
    <text x="910" y="231" fill="#effff9" font-family="Segoe UI, Microsoft YaHei" font-size="17">项目卡片</text>
    <text x="890" y="291" fill="#74dcb1" font-family="Segoe UI, Microsoft YaHei" font-size="16">安全重新实现</text>
  </g>
</svg>
