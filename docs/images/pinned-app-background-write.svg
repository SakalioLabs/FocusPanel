<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1827"/>
      <stop offset="1" stop-color="#1a2a43"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#44c9ff"/>
      <stop offset="1" stop-color="#8e7dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8fd" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">统一应用栏 · 固定项后台提交</text>
  <text x="54" y="96" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">固定、取消固定和拖动排序不再同步读取或写入 SQLite</text>

  <g filter="url(#shadow)">
    <rect x="54" y="138" width="238" height="250" rx="22" fill="#223149" stroke="#40536f"/>
    <text x="78" y="180" fill="#e5eef9" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">用户操作</text>
    <text x="78" y="222" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">搜索结果固定</text>
    <text x="78" y="257" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">运行应用取消固定</text>
    <text x="78" y="292" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">图标拖动排序</text>
    <rect x="78" y="326" width="190" height="36" rx="18" fill="#2b405d"/>
    <text x="173" y="349" text-anchor="middle" fill="#7ed3ff" font-family="Segoe UI, Microsoft YaHei" font-size="13">拖放期间保持 Panel 展开</text>
  </g>

  <path d="M308 262 H358" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M346 250 L364 262 L346 274" fill="none" stroke="#61a8ff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="378" y="122" width="300" height="282" rx="24" fill="#283b56" stroke="#597493"/>
    <text x="528" y="166" text-anchor="middle" fill="#eef5fd" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">后台固定项写入闸门</text>
    <circle cx="418" cy="216" r="8" fill="#55d69d"/>
    <text x="442" y="222" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="14">单消费者严格串行</text>
    <circle cx="418" cy="260" r="8" fill="#65c9ff"/>
    <text x="442" y="266" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="14">读取顺序并提交数据库</text>
    <circle cx="418" cy="304" r="8" fill="#a794ff"/>
    <text x="442" y="310" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="14">退出前等待在途写入</text>
    <rect x="406" y="342" width="244" height="38" rx="19" fill="#304a68"/>
    <text x="528" y="366" text-anchor="middle" fill="#c5d7e9" font-family="Segoe UI, Microsoft YaHei" font-size="13">UI 线程不执行 SaveChanges</text>
  </g>

  <path d="M696 262 H746" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M734 250 L752 262 L734 274" fill="none" stroke="#887eff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="766" y="138" width="300" height="250" rx="22" fill="#223149" stroke="#40536f"/>
    <text x="790" y="180" fill="#e5eef9" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">提交后再更新界面</text>
    <rect x="790" y="208" width="252" height="42" rx="13" fill="#30443f"/>
    <text x="916" y="234" text-anchor="middle" fill="#bff1d8" font-family="Segoe UI, Microsoft YaHei" font-size="14">成功 → 原子替换固定快照</text>
    <rect x="790" y="264" width="252" height="42" rx="13" fill="#44313e"/>
    <text x="916" y="290" text-anchor="middle" fill="#f3c4d1" font-family="Segoe UI, Microsoft YaHei" font-size="14">失败 → 保留原顺序并说明原因</text>
    <text x="790" y="346" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">不把未落盘状态伪装成成功</text>
  </g>

  <rect x="54" y="438" width="1012" height="46" rx="17" fill="#20314a" stroke="#405675"/>
  <text x="560" y="467" text-anchor="middle" fill="#c9d8e9" font-family="Segoe UI, Microsoft YaHei" font-size="15">点击和拖放保持响应 · 顺序稳定持久化 · SQLite 短暂繁忙不会冻结整条任务栏</text>
</svg>
