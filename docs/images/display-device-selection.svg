<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233b"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#253653" stop-opacity=".92"/>
      <stop offset="1" stop-color="#17243b" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="32" fill="url(#bg)"/>
  <text x="56" y="66" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">设备级多屏定位</text>
  <text x="56" y="98" fill="#9fb0c9" font-family="Segoe UI, Microsoft YaHei" font-size="16">同一个设备标识驱动 Panel、物理热区与无激活指示条</text>

  <g filter="url(#shadow)">
    <rect x="56" y="132" width="480" height="328" rx="24" fill="url(#panel)" stroke="#4d6385"/>
    <text x="84" y="174" fill="#dbeafe" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">设置 · Panel 所在屏幕</text>
    <rect x="84" y="194" width="424" height="54" rx="14" fill="#101b2e" stroke="#60a5fa" stroke-width="2"/>
    <text x="106" y="227" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei" font-size="16">显示器 2 · 2560×1440 · (-2560,-300)</text>
    <path d="M478 216l8 8 8-8" fill="none" stroke="#93c5fd" stroke-width="2"/>
    <rect x="84" y="258" width="424" height="168" rx="14" fill="#0d1728" stroke="#334967"/>
    <g font-family="Segoe UI, Microsoft YaHei" font-size="15">
      <text x="106" y="290" fill="#aebed5">自动：最右侧屏幕</text>
      <text x="106" y="326" fill="#aebed5">自动：Windows 主屏</text>
      <rect x="96" y="340" width="400" height="38" rx="10" fill="#2563eb" fill-opacity=".35"/>
      <text x="106" y="365" fill="#eff6ff">显示器 2 · 2560×1440 · (-2560,-300)</text>
      <text x="106" y="402" fill="#aebed5">显示器 3 · 1600×900 · (1920,200)</text>
    </g>
  </g>

  <g transform="translate(590 140)">
    <rect x="0" y="76" width="178" height="112" rx="14" fill="#22314b" stroke="#6680a5" stroke-width="2"/>
    <rect x="202" y="0" width="220" height="138" rx="14" fill="#243957" stroke="#60a5fa" stroke-width="3"/>
    <rect x="446" y="104" width="126" height="80" rx="12" fill="#22314b" stroke="#6680a5" stroke-width="2"/>
    <rect x="291" y="138" width="42" height="10" rx="5" fill="#64748b"/>
    <rect x="66" y="188" width="46" height="9" rx="5" fill="#64748b"/>
    <rect x="486" y="184" width="40" height="8" rx="4" fill="#64748b"/>
    <rect x="414" y="14" width="5" height="110" rx="2.5" fill="#38bdf8"/>
