    <path d="M378 232c35 0 52 17 52 48" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 7"/>
    <circle cx="430" cy="285" r="22" fill="#3a2a12" stroke="#f59e0b"/>
