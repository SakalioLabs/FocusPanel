<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101925"/>
      <stop offset="1" stop-color="#203542"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7bc6ea" stop-opacity=".055"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="13" stdDeviation="19" flood-color="#000" flood-opacity=".27"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="145" cy="70" r="190" fill="#168bd1" opacity=".14"/>
  <circle cx="1060" cy="450" r="235" fill="#65c8e8" opacity=".08"/>
  <text x="70" y="70" fill="#f5f9ff" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="31" font-weight="650">统一应用栏的三种清晰状态</text>
  <text x="70" y="108" fill="#afc1d0" font-family="Microsoft YaHei UI, Segoe UI, sans-serif" font-size="17">固定未运行不加噪点 · 后台运行使用短条 · 当前活动使用长条与单一柔和表面</text>

  <g transform="translate(72 148)" filter="url(#shadow)">
    <rect width="118" height="294" rx="29" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/>
    <circle cx="59" cy="36" r="19" fill="#fff" fill-opacity=".08"/>
    <path d="M50 27h18v18H50z" fill="#fff" fill-opacity=".9"/>

    <g transform="translate(17 75)">
      <rect width="84" height="58" rx="15" fill="#fff" fill-opacity=".025"/>
      <rect x="23" y="10" width="38" height="38" rx="10" fill="#fff" fill-opacity=".10"/>
      <text x="42" y="36" text-anchor="middle" fill="#70c9f3" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650">F</text>
    </g>

    <g transform="translate(17 139)">
      <rect width="84" height="58" rx="15" fill="#fff" fill-opacity=".025"/>
      <rect x="23" y="10" width="38" height="38" rx="10" fill="#fff" fill-opacity=".10"/>
      <text x="42" y="36" text-anchor="middle" fill="#70c9f3" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650">B</text>
      <rect x="1" y="23" width="4" height="12" rx="2" fill="#67c8f4" opacity=".58"/>
    </g>

    <g transform="translate(17 203)">
      <rect width="84" height="58" rx="15" fill="#fff" fill-opacity=".09"/>
      <rect x="23" y="10" width="38" height="38" rx="10" fill="#268fcb"/>
      <text x="42" y="36" text-anchor="middle" fill="#fff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="650">A</text>
      <rect x="1" y="17" width="4" height="24" rx="2" fill="#67c8f4"/>
    </g>
  </g>

  <g transform="translate(250 150)">
    <text x="0" y="42" fill="#f5f9ff" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="600">固定 · 未运行</text>
    <text x="0" y="72" fill="#afc1d0" font-family="Microsoft YaHei UI, sans-serif" font-size="15">仅显示应用图标，不制造错误的运行暗示</text>
    <line x1="0" y1="100" x2="820" y2="100" stroke="#fff" stroke-opacity=".11"/>

    <text x="0" y="148" fill="#f5f9ff" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="600">后台运行</text>
    <text x="0" y="178" fill="#afc1d0" font-family="Microsoft YaHei UI, sans-serif" font-size="15">4px × 12px 圆角短条，保持可见但降低强调</text>
    <line x1="0" y1="206" x2="820" y2="206" stroke="#fff" stroke-opacity=".11"/>

    <text x="0" y="254" fill="#f5f9ff" font-family="Microsoft YaHei UI, sans-serif" font-size="20" font-weight="600">当前活动</text>
    <text x="0" y="284" fill="#afc1d0" font-family="Microsoft YaHei UI, sans-serif" font-size="15">4px × 24px 长条 + 单一柔和背景，不叠加第二层边框</text>
  </g>

  <g transform="translate(845 158)" filter="url(#shadow)">
    <rect width="285" height="268" rx="23" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/>
    <text x="24" y="42" fill="#f5f9ff" font-family="Microsoft YaHei UI, sans-serif" font-size="19" font-weight="600">提示与读屏同步</text>
    <text x="24" y="82" fill="#dce8f2" font-family="Microsoft YaHei UI, sans-serif" font-size="16">编辑器</text>
    <text x="24" y="109" fill="#74cff6" font-family="Microsoft YaHei UI, sans-serif" font-size="15">正在使用 · 2 个窗口</text>
    <line x1="22" y1="133" x2="263" y2="133" stroke="#fff" stroke-opacity=".11"/>
    <text x="24" y="166" fill="#dce8f2" font-family="Microsoft YaHei UI, sans-serif" font-size="15">读屏名称</text>
    <text x="24" y="193" fill="#afc1d0" font-family="Microsoft YaHei UI, sans-serif" font-size="14">“编辑器，正在使用，2 个窗口”</text>
    <text x="24" y="225" fill="#dce8f2" font-family="Microsoft YaHei UI, sans-serif" font-size="15">操作提示</text>
    <text x="24" y="250" fill="#afc1d0" font-family="Microsoft YaHei UI, sans-serif" font-size="14">左键窗口列表 · 右键应用管理</text>
  </g>
</svg>
