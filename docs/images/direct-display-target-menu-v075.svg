<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="680" viewBox="0 0 1180 680" role="img" aria-labelledby="title desc">
  <title id="title">从 FocusPanel 位置把手直接选择所在屏幕</title>
  <desc id="desc">双屏示意图中，右侧 Panel 的位置把手打开菜单，移动到屏幕子菜单列出自动最右、Windows 主屏和两块具体显示器。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161f34"/>
      <stop offset="0.55" stop-color="#293a58"/>
      <stop offset="1" stop-color="#11313e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f8ff" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#add5f5" stop-opacity="0.11"/>
    </linearGradient>
    <linearGradient id="screen1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#396a9d"/>
      <stop offset="1" stop-color="#1b3655"/>
    </linearGradient>
    <linearGradient id="screen2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#327f87"/>
      <stop offset="1" stop-color="#173a4a"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#02060c" flood-opacity="0.46"/>
    </filter>
  </defs>

  <rect width="1180" height="680" fill="url(#bg)"/>
  <circle cx="206" cy="112" r="190" fill="#4e75c9" opacity="0.12"/>
  <circle cx="842" cy="590" r="270" fill="#24a58f" opacity="0.08"/>

  <text x="70" y="78" fill="#f4f9ff" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="31" font-weight="650">右键位置把手，Panel 直接换屏</text>
  <text x="70" y="116" fill="#b5c8dd" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="18">实时枚举 · 当前项勾选 · 复用物理坐标与 Per-Monitor DPI</text>

  <g transform="translate(64 184)">
    <rect x="0" y="28" width="410" height="246" rx="17" fill="#0d1726" stroke="#cfe9ff" stroke-opacity="0.24" stroke-width="3" filter="url(#shadow)"/>
    <rect x="14" y="42" width="382" height="218" rx="10" fill="url(#screen1)"/>
    <rect x="38" y="67" width="334" height="154" rx="8" fill="#a8cee8" opacity="0.16"/>
    <text x="205" y="146" text-anchor="middle" fill="#eef8ff" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="25" font-weight="650">显示器 1 · 主屏</text>
    <text x="205" y="178" text-anchor="middle" fill="#bcd2e5" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15">1920×1080 · (-1920,0)</text>
    <rect x="154" y="278" width="102" height="14" rx="7" fill="#8ba5bd"/>
    <rect x="118" y="292" width="174" height="13" rx="6.5" fill="#657d94"/>

    <rect x="432" y="0" width="520" height="310" rx="17" fill="#0d1726" stroke="#86d3ff" stroke-opacity="0.44" stroke-width="3" filter="url(#shadow)"/>
    <rect x="446" y="14" width="492" height="282" rx="10" fill="url(#screen2)"/>
    <rect x="472" y="40" width="440" height="201" rx="8" fill="#a8e6e2" opacity="0.13"/>
    <text x="692" y="136" text-anchor="middle" fill="#eefcff" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="27" font-weight="650">显示器 2</text>
    <text x="692" y="170" text-anchor="middle" fill="#bce0df" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15">2560×1440 · (0,0)</text>
    <rect x="637" y="314" width="110" height="14" rx="7" fill="#8ba5bd"/>
    <rect x="594" y="328" width="196" height="13" rx="6.5" fill="#657d94"/>

    <g filter="url(#shadow)">
      <rect x="868" y="28" width="66" height="252" rx="21" fill="url(#glass)" stroke="#ddf2ff" stroke-opacity="0.26"/>
      <rect x="890" y="44" width="22" height="4" rx="2" fill="#d7e8f7"/>
      <g fill="#e5f2fc" font-family="Segoe UI Symbol, sans-serif" font-size="18" text-anchor="middle">
        <text x="901" y="91">⊞</text><text x="901" y="132">⌕</text><text x="901" y="173">●</text><text x="901" y="222">◉</text>
      </g>
      <text x="901" y="258" text-anchor="middle" fill="#edf8ff" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="11">18:42</text>
    </g>

    <path d="M901 43c0-23-28-32-52-32" fill="none" stroke="#80d0ff" stroke-width="2" stroke-dasharray="5 6"/>
    <text x="744" y="18" fill="#9fdcff" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">右键位置把手</text>
  </g>

  <g transform="translate(524 216)" filter="url(#shadow)">
    <rect width="270" height="188" rx="16" fill="#182537" stroke="#e1f1ff" stroke-opacity="0.20"/>
    <text x="22" y="36" fill="#dcecf9" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15">固定到右上</text>
    <text x="22" y="72" fill="#dcecf9" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15">固定到右中</text>
    <text x="22" y="108" fill="#dcecf9" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15">固定到右下</text>
    <rect x="14" y="124" width="242" height="1" fill="#cfe8f9" opacity="0.13"/>
    <rect x="10" y="134" width="250" height="42" rx="11" fill="#73c9ff" fill-opacity="0.17"/>
    <text x="22" y="160" fill="#f0f9ff" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15" font-weight="600">移动到屏幕</text>
    <text x="242" y="160" text-anchor="end" fill="#9fdcff" font-family="Segoe UI Symbol, sans-serif" font-size="18">›</text>
  </g>

  <g transform="translate(803 326)" filter="url(#shadow)">
    <rect width="315" height="214" rx="16" fill="#182537" stroke="#e1f1ff" stroke-opacity="0.20"/>
    <text x="22" y="38" fill="#dcecf9" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15">自动：最右侧屏幕</text>
    <text x="22" y="76" fill="#dcecf9" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="15">自动：Windows 主屏</text>
    <text x="22" y="118" fill="#dcecf9" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14">显示器 1 · 主屏 · 1920×1080 · (-1920,0)</text>
    <rect x="10" y="132" width="295" height="48" rx="11" fill="#73c9ff" fill-opacity="0.18"/>
    <circle cx="28" cy="156" r="9" fill="none" stroke="#83d2ff" stroke-width="2"/>
    <path d="M24 156l3 3 6-7" fill="none" stroke="#a8e3ff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="48" y="161" fill="#f0f9ff" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="14" font-weight="600">显示器 2 · 2560×1440 · (0,0)</text>
    <text x="22" y="201" fill="#91a8be" font-family="Segoe UI Variable, Segoe UI, sans-serif" font-size="13">当前选择已勾选</text>
  </g>
</svg>
