<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dff3ff" stop-opacity=".27"/>
      <stop offset="1" stop-color="#6aa9e8" stop-opacity=".13"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1180" height="620" rx="30" fill="url(#bg)"/>
  <text x="54" y="65" fill="#f4f8ff" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">运行应用回到任务栏 · Panel 可固定在右上 / 右中 / 右下</text>
  <text x="54" y="102" fill="#aebed4" font-family="Segoe UI, sans-serif" font-size="16">可见窗口优先，后台宿主留在自有抽屉；位置按目标屏幕 DPI 独立计算并记忆</text>

  <rect x="54" y="142" width="710" height="420" rx="22" fill="#202d43" stroke="#405574"/>
  <text x="82" y="178" fill="#d7e7fb" font-family="Segoe UI, sans-serif" font-size="15">所选显示器</text>
  <rect x="84" y="204" width="636" height="322" rx="14" fill="#101a2a" stroke="#31435d"/>
  <rect x="670" y="220" width="34" height="290" rx="17" fill="url(#glass)" stroke="#8ed6ff" filter="url(#shadow)"/>
  <circle cx="687" cy="252" r="10" fill="#4ec3ff"/>
  <circle cx="687" cy="286" r="10" fill="#69e1a9"/>
  <circle cx="687" cy="320" r="10" fill="#ffca6a"/>
  <rect x="678" y="353" width="18" height="3" rx="1.5" fill="#86a6c9"/>
  <circle cx="687" cy="382" r="11" fill="#906cff"/>
  <circle cx="687" cy="420" r="11" fill="#ff6f91"/>
  <circle cx="687" cy="458" r="11" fill="#48b9e6"/>
  <text x="112" y="251" fill="#f2f7ff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="600">正在运行的应用始终在前</text>
  <text x="112" y="283" fill="#9fb3cd" font-family="Segoe UI, sans-serif" font-size="15">固定应用 → 可见窗口 → 纯后台宿主</text>
  <text x="112" y="324" fill="#9fb3cd" font-family="Segoe UI, sans-serif" font-size="15">Panel 收起时继续接收窗口创建、关闭和前台变化</text>
  <text x="112" y="365" fill="#9fb3cd" font-family="Segoe UI, sans-serif" font-size="15">应用区保留最低高度，滚轮和上下按钮继续可用</text>

  <rect x="806" y="142" width="320" height="420" rx="22" fill="#202d43" stroke="#405574"/>
  <text x="838" y="185" fill="#f2f7ff" font-family="Segoe UI, sans-serif" font-size="20" font-weight="650">Panel 固定位置</text>
  <g font-family="Segoe UI, sans-serif" font-size="17">
    <rect x="838" y="220" width="256" height="70" rx="14" fill="#1687d9"/>
    <text x="874" y="263" fill="#fff">右上</text>
    <rect x="1037" y="233" width="28" height="44" rx="12" fill="#bdeaff" fill-opacity=".58"/>
    <rect x="838" y="308" width="256" height="70" rx="14" fill="#2a3b54" stroke="#4a6385"/>
    <text x="874" y="351" fill="#d9e8fb">右中</text>
    <rect x="1037" y="321" width="28" height="44" rx="12" fill="#bdeaff" fill-opacity=".38"/>
    <rect x="838" y="396" width="256" height="70" rx="14" fill="#2a3b54" stroke="#4a6385"/>
    <text x="874" y="439" fill="#d9e8fb">右下</text>
    <rect x="1037" y="409" width="28" height="44" rx="12" fill="#bdeaff" fill-opacity=".38"/>
  </g>
  <text x="838" y="505" fill="#9fb3cd" font-family="Segoe UI, sans-serif" font-size="14">设置 → 外观与交互</text>
  <text x="838" y="530" fill="#9fb3cd" font-family="Segoe UI, sans-serif" font-size="14">切换后立即生效并保存</text>
</svg>
