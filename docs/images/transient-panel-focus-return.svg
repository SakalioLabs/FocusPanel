<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <rect width="1120" height="560" rx="28" fill="#0b1220"/>
  <text x="52" y="62" fill="#f5f8ff" font-family="Segoe UI,Microsoft YaHei" font-size="27" font-weight="700">弹层焦点有去有回，时间入口补齐系统设置</text>
  <text x="52" y="96" fill="#9fb0c8" font-family="Segoe UI,Microsoft YaHei" font-size="15">打开进入内容 · Esc 返回入口 · 迟到请求按窗口生命周期失效</text>

  <rect x="52" y="132" width="130" height="366" rx="24" fill="#111c2d" stroke="#26364d"/>
  <g font-family="Segoe UI,Microsoft YaHei" text-anchor="middle">
    <circle cx="117" cy="183" r="24" fill="#1e3a5f"/><text x="117" y="189" fill="#93c5fd" font-size="15">搜</text>
    <circle cx="117" cy="245" r="24" fill="#183329"/><text x="117" y="251" fill="#86efac" font-size="15">F</text>
    <circle cx="117" cy="307" r="24" fill="#2c2548"/><text x="117" y="313" fill="#c4b5fd" font-size="15">状</text>
    <circle cx="117" cy="369" r="24" fill="#3b2b18"/><text x="117" y="375" fill="#fdba74" font-size="15">时</text>
    <text x="117" y="436" fill="#f3f7ff" font-size="12" font-weight="650">六入口</text>
    <text x="117" y="457" fill="#8393aa" font-size="11">紧凑栏</text>
  </g>

  <path d="M190 245 C245 245 242 187 302 187" fill="none" stroke="#4f8fd7" stroke-width="3"/>
  <path d="M291 179 L304 187 L291 195" fill="none" stroke="#4f8fd7" stroke-width="3"/>
  <path d="M302 421 C242 421 245 369 190 369" fill="none" stroke="#86efac" stroke-width="3"/>
  <path d="M201 361 L188 369 L201 377" fill="none" stroke="#86efac" stroke-width="3"/>
  <text x="235" y="204" fill="#93c5fd" font-family="Segoe UI,Microsoft YaHei" font-size="12">打开</text>
  <text x="235" y="407" fill="#86efac" font-family="Segoe UI,Microsoft YaHei" font-size="12">Esc 返回</text>

  <rect x="304" y="132" width="430" height="366" rx="24" fill="#111c2d" stroke="#26364d"/>
  <text x="336" y="176" fill="#eef4ff" font-family="Segoe UI,Microsoft YaHei" font-size="19" font-weight="700">首个有效内容</text>
  <g font-family="Segoe UI,Microsoft YaHei" font-size="14">
    <rect x="336" y="207" width="176" height="48" rx="13" fill="#1c2b42"/><text x="356" y="237" fill="#cbd7e9">搜索 · 输入框</text>
    <rect x="526" y="207" width="176" height="48" rx="13" fill="#1c2b42"/><text x="546" y="237" fill="#cbd7e9">Focus · 最近模块</text>
    <rect x="336" y="271" width="176" height="48" rx="13" fill="#1c2b42"/><text x="356" y="301" fill="#cbd7e9">状态 · 快捷设置</text>
    <rect x="526" y="271" width="176" height="48" rx="13" fill="#1c2b42"/><text x="546" y="301" fill="#cbd7e9">月历 · 选中日期</text>
    <rect x="336" y="335" width="176" height="48" rx="13" fill="#1c2b42"/><text x="356" y="365" fill="#cbd7e9">设置 · 替代模式</text>
    <rect x="526" y="335" width="176" height="48" rx="13" fill="#1c2b42"/><text x="546" y="365" fill="#cbd7e9">电源 · 锁定</text>
  </g>
  <rect x="336" y="416" width="366" height="50" rx="14" fill="#143125"/>
  <text x="519" y="446" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI,Microsoft YaHei" font-size="13">可见 · 可用 · 仍打开 · 窗口未退出</text>

  <rect x="766" y="132" width="302" height="366" rx="24" fill="#101a2a"/>
  <text x="798" y="176" fill="#eef4ff" font-family="Segoe UI,Microsoft YaHei" font-size="19" font-weight="700">时间右键</text>
  <rect x="798" y="207" width="238" height="64" rx="14" fill="#19344a"/>
  <text x="818" y="234" fill="#dff7ff" font-family="Segoe UI,Microsoft YaHei" font-size="14">调整日期和时间</text>
  <text x="818" y="255" fill="#7dd3fc" font-family="Consolas,Microsoft YaHei" font-size="11">ms-settings:dateandtime</text>
  <rect x="798" y="287" width="238" height="64" rx="14" fill="#25233e"/>
  <text x="818" y="314" fill="#ede9fe" font-family="Segoe UI,Microsoft YaHei" font-size="14">通知设置</text>
  <text x="818" y="335" fill="#c4b5fd" font-family="Consolas,Microsoft YaHei" font-size="11">ms-settings:notifications</text>
  <text x="798" y="391" fill="#9fb0c8" font-family="Segoe UI,Microsoft YaHei" font-size="13">鼠标右键或 Shift+F10</text>
  <text x="798" y="421" fill="#86efac" font-family="Segoe UI,Microsoft YaHei" font-size="12">公开 Windows URI</text>
  <text x="798" y="444" fill="#8393aa" font-family="Segoe UI,Microsoft YaHei" font-size="12">不读取 Explorer 私有数据</text>
</svg>
