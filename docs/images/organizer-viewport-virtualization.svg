<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1722"/>
      <stop offset="1" stop-color="#1b2d3b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#7bc6ef" stop-opacity=".055"/>
    </linearGradient>
    <clipPath id="viewport"><rect x="0" y="0" width="426" height="252" rx="18"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="30" fill="url(#bg)"/>
  <circle cx="86" cy="38" r="190" fill="#087fca" opacity=".14"/>
  <circle cx="1110" cy="470" r="230" fill="#58cb98" opacity=".08"/>
  <text x="64" y="64" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="30" font-weight="650">1000 个项目，不等于 1000 张卡片</text>
  <text x="64" y="100" fill="#aebdca" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="17">完整滚动范围保留，WPF 只生成视口附近的容器</text>

  <g transform="translate(64 142)" filter="url(#shadow)">
    <rect width="466" height="292" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".11"/>
    <text x="20" y="34" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="16" font-weight="650">统一滚动视口</text>
    <g transform="translate(20 52)" clip-path="url(#viewport)">
      <rect width="426" height="252" rx="18" fill="#08131d" fill-opacity=".42"/>
      <g opacity=".34" transform="translate(0 -54)">
        <rect x="10" y="8" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="150" y="8" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="290" y="8" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
      </g>
      <g transform="translate(0 34)">
        <rect x="10" y="8" width="124" height="70" rx="12" fill="#147fc2" fill-opacity=".5"/>
        <rect x="150" y="8" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="290" y="8" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="10" y="92" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="150" y="92" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="290" y="92" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="10" y="176" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="150" y="176" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="290" y="176" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
      </g>
      <g opacity=".34" transform="translate(0 268)">
        <rect x="10" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="150" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
        <rect x="290" width="124" height="70" rx="12" fill="#fff" fill-opacity=".09"/>
      </g>
      <rect x="416" y="12" width="5" height="228" rx="3" fill="#fff" fill-opacity=".08"/>
      <rect x="416" y="84" width="5" height="52" rx="3" fill="#65bdf3"/>
    </g>
  </g>

  <g transform="translate(560 200)">
    <path d="M0 0h72" stroke="#65bdf3" stroke-width="2"/>
    <path d="m64-7 8 7-8 7" fill="none" stroke="#65bdf3" stroke-width="2"/>
    <text x="36" y="-18" text-anchor="middle" fill="#8fd3ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">滚动时回收</text>
    <text x="36" y="24" text-anchor="middle" fill="#8fd3ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">并复用</text>
  </g>

  <g transform="translate(662 142)" filter="url(#shadow)">
    <rect width="474" height="292" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".11"/>
    <text x="24" y="40" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="650">真实 WPF 容器数量</text>
    <g transform="translate(24 70)">
      <rect width="426" height="58" rx="14" fill="#fff" fill-opacity=".06"/>
      <text x="18" y="35" fill="#dce8f2" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">首屏</text>
      <rect x="92" y="17" width="210" height="24" rx="12" fill="#147fc2" fill-opacity=".28"/>
      <rect x="92" y="17" width="70" height="24" rx="12" fill="#58c995"/>
      <text x="394" y="35" text-anchor="end" fill="#9fe4c5" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="650">9</text>
      <rect y="70" width="426" height="58" rx="14" fill="#fff" fill-opacity=".06"/>
      <text x="18" y="105" fill="#dce8f2" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">滚到中段</text>
      <rect x="92" y="87" width="210" height="24" rx="12" fill="#147fc2" fill-opacity=".28"/>
      <rect x="92" y="87" width="92" height="24" rx="12" fill="#58c995"/>
      <text x="394" y="105" text-anchor="end" fill="#9fe4c5" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="650">12</text>
      <rect y="140" width="426" height="58" rx="14" fill="#fff" fill-opacity=".06"/>
      <text x="18" y="175" fill="#dce8f2" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">返回顶部</text>
      <rect x="92" y="157" width="210" height="24" rx="12" fill="#147fc2" fill-opacity=".28"/>
      <rect x="92" y="157" width="70" height="24" rx="12" fill="#58c995"/>
      <text x="394" y="175" text-anchor="end" fill="#9fe4c5" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="15" font-weight="650">9</text>
    </g>
    <text x="24" y="276" fill="#8fa5b5" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">其余 988–991 项只保留数据，不创建视觉卡片</text>
  </g>

  <g transform="translate(260 462)">
    <circle cx="7" cy="7" r="7" fill="#57c995"/>
    <path d="m3 7 3 3 5-6" stroke="#0f2820" stroke-width="2" fill="none"/>
    <text x="26" y="13" fill="#b2ead0" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">双列布局保留</text>
    <circle cx="166" cy="7" r="7" fill="#57c995"/>
    <path d="m162 7 3 3 5-6" stroke="#0f2820" stroke-width="2" fill="none"/>
    <text x="185" y="13" fill="#b2ead0" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">拖拽与选择保留</text>
    <circle cx="352" cy="7" r="7" fill="#57c995"/>
    <path d="m348 7 3 3 5-6" stroke="#0f2820" stroke-width="2" fill="none"/>
    <text x="371" y="13" fill="#b2ead0" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">滚动范围完整</text>
    <circle cx="526" cy="7" r="7" fill="#57c995"/>
    <path d="m522 7 3 3 5-6" stroke="#0f2820" stroke-width="2" fill="none"/>
    <text x="545" y="13" fill="#b2ead0" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">容器循环复用</text>
  </g>
</svg>
