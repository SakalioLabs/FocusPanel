<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1727"/>
      <stop offset="1" stop-color="#182a42"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#63baff"/>
      <stop offset="1" stop-color="#9783ff"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="520" rx="30" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">Explorer 拖入 · 后台路径预检</text>
  <text x="54" y="97" fill="#abc9ed" font-family="Segoe UI, Microsoft YaHei" font-size="16">拖放事件不再同步逐项访问磁盘；预检快照完成后才进入桌面属性事务</text>

  <rect x="54" y="136" width="234" height="252" rx="24" fill="#22344d" stroke="#405d7f"/>
  <text x="79" y="178" fill="#f1f6ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="700">Explorer 输入</text>
  <rect x="78" y="205" width="186" height="44" rx="16" fill="#2c4b6f"/>
  <text x="171" y="233" text-anchor="middle" fill="#8fd2ff" font-family="Segoe UI, Microsoft YaHei" font-size="15">文件 / 文件夹路径数组</text>
  <rect x="78" y="261" width="186" height="44" rx="16" fill="#2c4b6f"/>
  <text x="171" y="289" text-anchor="middle" fill="#8fd2ff" font-family="Segoe UI, Microsoft YaHei" font-size="15">可能含重复或失效项</text>
  <text x="171" y="339" text-anchor="middle" fill="#b8cce6" font-family="Segoe UI, Microsoft YaHei" font-size="14">放下后立即释放 WPF 回调</text>
  <text x="171" y="364" text-anchor="middle" fill="#b8cce6" font-family="Segoe UI, Microsoft YaHei" font-size="14">Panel 继续保持展开</text>

  <path d="M308 262 H348" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M338 251 L351 262 L338 273" fill="none" stroke="#72b9ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="372" y="121" width="356" height="284" rx="26" fill="#2a415f" stroke="#5a7da6"/>
  <text x="550" y="165" text-anchor="middle" fill="#f1f6ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="700">单次后台预检快照</text>
  <circle cx="412" cy="210" r="9" fill="#69c3ff"/>
  <text x="436" y="216" fill="#dbe8fa" font-family="Segoe UI, Microsoft YaHei" font-size="15">规范化路径并去掉目录尾部分隔符</text>
  <circle cx="412" cy="252" r="9" fill="#73dfb1"/>
  <text x="436" y="258" fill="#dbe8fa" font-family="Segoe UI, Microsoft YaHei" font-size="15">大小写不敏感去重，保留首次出现顺序</text>
  <circle cx="412" cy="294" r="9" fill="#a590ff"/>
  <text x="436" y="300" fill="#dbe8fa" font-family="Segoe UI, Microsoft YaHei" font-size="15">检查存在性并分类用户 / 公共桌面</text>
  <rect x="404" y="335" width="292" height="45" rx="18" fill="#20334d"/>
  <text x="550" y="363" text-anchor="middle" fill="#b9d8fa" font-family="Segoe UI, Microsoft YaHei" font-size="14">单项异常隔离，不中止剩余项目</text>

  <path d="M748 262 H788" stroke="url(#flow)" stroke-width="6" stroke-linecap="round"/>
  <path d="M778 251 L791 262 L778 273" fill="none" stroke="#9188ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="812" y="136" width="254" height="252" rx="24" fill="#22344d" stroke="#405d7f"/>
  <text x="837" y="178" fill="#f1f6ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="700">精确分流与反馈</text>
  <rect x="836" y="202" width="206" height="44" rx="15" fill="#294b43"/>
  <text x="939" y="229" text-anchor="middle" fill="#9aebc2" font-family="Segoe UI, Microsoft YaHei" font-size="14">有效桌面根项目 → 收纳事务</text>
  <rect x="836" y="258" width="206" height="44" rx="15" fill="#45405e"/>
  <text x="939" y="285" text-anchor="middle" fill="#cec4ff" font-family="Segoe UI, Microsoft YaHei" font-size="14">公共桌面 → 一次授权确认</text>
  <rect x="836" y="314" width="206" height="48" rx="15" fill="#553b49"/>
  <text x="939" y="334" text-anchor="middle" fill="#ffc4d3" font-family="Segoe UI, Microsoft YaHei" font-size="13">缺失 / 越界 / 重复 / 取消</text>
  <text x="939" y="353" text-anchor="middle" fill="#eab3c1" font-family="Segoe UI, Microsoft YaHei" font-size="13">分别计数并明确说明</text>

  <rect x="54" y="438" width="1012" height="47" rx="18" fill="#1e3049" stroke="#3d5879"/>
  <text x="560" y="468" text-anchor="middle" fill="#d9e8fb" font-family="Segoe UI, Microsoft YaHei" font-size="15">不读取网页或任意目录内容 · 不移动外部文件 · 只允许 Windows 合并桌面的直接根项目进入收纳</text>
</svg>
