<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#f5f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#101828" flood-opacity=".18"/>
    </filter>
    <style>
      .title { font: 700 34px "Segoe UI","Microsoft YaHei",sans-serif; fill: #172554; }
      .subtitle { font: 400 18px "Segoe UI","Microsoft YaHei",sans-serif; fill: #52627a; }
      .month { font: 650 21px "Segoe UI","Microsoft YaHei",sans-serif; fill: #f7f9ff; }
      .week { font: 500 13px "Segoe UI","Microsoft YaHei",sans-serif; fill: #aeb7c8; }
      .day { font: 550 14px "Segoe UI","Microsoft YaHei",sans-serif; fill: #eef2fa; text-anchor: middle; }
      .muted-day { font: 550 14px "Segoe UI","Microsoft YaHei",sans-serif; fill: #6f7787; text-anchor: middle; }
      .summary-title { font: 650 17px "Segoe UI","Microsoft YaHei",sans-serif; fill: #f7f9ff; }
      .summary { font: 400 14px "Segoe UI","Microsoft YaHei",sans-serif; fill: #aeb7c8; }
      .feature-title { font: 650 22px "Segoe UI","Microsoft YaHei",sans-serif; fill: #172554; }
      .feature { font: 400 17px "Segoe UI","Microsoft YaHei",sans-serif; fill: #52627a; }
      .badge { font: 650 15px "Segoe UI","Microsoft YaHei",sans-serif; fill: white; }
    </style>
  </defs>

  <rect width="1200" height="700" rx="38" fill="url(#page)"/>
  <text x="66" y="72" class="title">日期入口不再只是一个时钟</text>
  <text x="66" y="108" class="subtitle">6 周稳定月历，把每天的专注记录放回时间轴</text>

  <g filter="url(#shadow)">
    <rect x="66" y="148" width="460" height="500" rx="25" fill="#1d222d"/>
  </g>

  <path d="M105 194 l-9 9 9 9" fill="none" stroke="#f3f6fb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="132" y="211" class="month">2026年 7月</text>
  <path d="M404 194 l9 9 -9 9" fill="none" stroke="#f3f6fb" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="432" y="177" width="68" height="48" rx="12" fill="#222836"/>
  <text x="466" y="207" class="week" text-anchor="middle" fill="#f7f9ff">今天</text>

  <g>
    <text x="112" y="259" class="week" text-anchor="middle">一</text>
    <text x="174" y="259" class="week" text-anchor="middle">二</text>
    <text x="236" y="259" class="week" text-anchor="middle">三</text>
    <text x="298" y="259" class="week" text-anchor="middle">四</text>
    <text x="360" y="259" class="week" text-anchor="middle">五</text>
    <text x="422" y="259" class="week" text-anchor="middle">六</text>
    <text x="484" y="259" class="week" text-anchor="middle">日</text>
  </g>

  <g>
    <text x="112" y="298" class="muted-day">29</text><text x="174" y="298" class="muted-day">30</text>
    <text x="236" y="298" class="day">1</text><text x="298" y="298" class="day">2</text><text x="360" y="298" class="day">3</text><text x="422" y="298" class="day">4</text><text x="484" y="298" class="day">5</text>
    <text x="112" y="344" class="day">6</text><text x="174" y="344" class="day">7</text><text x="236" y="344" class="day">8</text><text x="298" y="344" class="day">9</text><text x="360" y="344" class="day">10</text><text x="422" y="344" class="day">11</text><text x="484" y="344" class="day">12</text>
    <circle cx="236" cy="355" r="3" fill="#48b8ff"/>
    <text x="112" y="390" class="day">13</text><text x="174" y="390" class="day">14</text><text x="236" y="390" class="day">15</text><text x="298" y="390" class="day">16</text><text x="360" y="390" class="day">17</text><text x="422" y="390" class="day">18</text><text x="484" y="390" class="day">19</text>
    <circle cx="298" cy="401" r="3" fill="#48b8ff"/>
    <text x="112" y="436" class="day">20</text><text x="174" y="436" class="day">21</text><text x="236" y="436" class="day">22</text><text x="298" y="436" class="day">23</text><text x="360" y="436" class="day">24</text><text x="422" y="436" class="day">25</text><text x="484" y="436" class="day">26</text>
    <text x="112" y="482" class="day">27</text>
    <rect x="148" y="451" width="52" height="48" rx="11" fill="#0f7ac7" stroke="#46b9ff"/>
    <text x="174" y="481" class="day">28</text>
    <circle cx="174" cy="491" r="3" fill="#69d0ff"/>
    <text x="236" y="482" class="day">29</text><text x="298" y="482" class="day">30</text><text x="360" y="482" class="day">31</text><text x="422" y="482" class="muted-day">1</text><text x="484" y="482" class="muted-day">2</text>
  </g>

  <line x1="88" y1="520" x2="504" y2="520" stroke="#3b4352"/>
  <text x="88" y="554" class="summary-title">7月28日 星期二</text>
  <text x="88" y="581" class="summary">完成 3 次专注 · 75 分钟</text>
  <text x="88" y="605" class="summary">当前还有 7 项任务待完成</text>

  <g>
    <rect x="600" y="176" width="108" height="32" rx="16" fill="#2563eb"/>
    <text x="624" y="198" class="badge">稳定布局</text>
    <text x="600" y="248" class="feature-title">每个月都是同一高度</text>
    <text x="600" y="282" class="feature">固定 42 个日期，切换月份不会上下跳动。</text>

    <rect x="600" y="330" width="108" height="32" rx="16" fill="#7c3aed"/>
    <text x="624" y="352" class="badge">专注历史</text>
    <text x="600" y="402" class="feature-title">圆点代表真实完成记录</text>
    <text x="600" y="436" class="feature">按日期汇总次数与分钟，不修改历史会话。</text>

    <rect x="600" y="484" width="108" height="32" rx="16" fill="#0f766e"/>
    <text x="624" y="506" class="badge">直接行动</text>
    <text x="600" y="556" class="feature-title">从日期回到任务与专注</text>
    <text x="600" y="590" class="feature">保留两个高频动作，移除重复系统入口。</text>
  </g>
</svg>
