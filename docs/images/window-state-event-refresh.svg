<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 窗口状态事件刷新</title>
  <desc id="desc">Windows 最小化和位置变化事件经过顶层窗口过滤、防抖及合并后台快照后更新应用栏。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#94b8ef" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#78bbff"/>
    </marker>
  </defs>
  <rect width="1200" height="500" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="55" r="190" fill="#278bf0" opacity=".12"/>
  <circle cx="80" cy="470" r="180" fill="#8b5cf6" opacity=".09"/>
  <text x="62" y="66" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">窗口自己变化，应用栏也能及时知道</text>
  <text x="62" y="100" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="17">事件驱动、顶层过滤、稳定后只取最新快照</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei">
    <rect x="62" y="142" width="274" height="280" rx="24" fill="url(#glass)" stroke="#6d809b"/>
    <text x="92" y="184" fill="#f4f8ff" font-size="20" font-weight="650">Windows 公开事件</text>
    <rect x="92" y="210" width="214" height="58" rx="14" fill="#278bf0" opacity=".20" stroke="#78bbff"/>
    <text x="110" y="235" fill="#f4f8ff" font-size="14" font-weight="600">MINIMIZESTART</text>
    <text x="110" y="255" fill="#b8d9ff" font-size="12">窗口开始最小化</text>
    <rect x="92" y="280" width="214" height="58" rx="14" fill="#278bf0" opacity=".14"/>
    <text x="110" y="305" fill="#e4edf8" font-size="14" font-weight="600">MINIMIZEEND</text>
    <text x="110" y="325" fill="#aebbd0" font-size="12">窗口正在还原</text>
    <rect x="92" y="350" width="214" height="46" rx="14" fill="#fff" opacity=".06"/>
    <text x="110" y="378" fill="#dce7f5" font-size="13" font-weight="600">OBJECT_LOCATIONCHANGE</text>
  </g>

  <path d="M348 282h86" stroke="#78bbff" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei">
    <rect x="448" y="142" width="296" height="280" rx="24" fill="#202c3f" stroke="#63748f"/>
    <text x="480" y="184" fill="#f4f8ff" font-size="20" font-weight="650">稳定刷新管线</text>
    <g transform="translate(480 210)">
      <circle cx="20" cy="20" r="20" fill="#278bf0" opacity=".28"/>
      <text x="20" y="25" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">1</text>
      <text x="54" y="17" fill="#e2ebf7" font-size="14" font-weight="600">仅 OBJID_WINDOW</text>
      <text x="54" y="37" fill="#9eb0c8" font-size="12">忽略子控件噪声</text>
      <circle cx="20" cy="78" r="20" fill="#278bf0" opacity=".28"/>
      <text x="20" y="83" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">2</text>
      <text x="54" y="75" fill="#e2ebf7" font-size="14" font-weight="600">140ms 防抖</text>
      <text x="54" y="95" fill="#9eb0c8" font-size="12">等待移动或缩放稳定</text>
      <circle cx="20" cy="136" r="20" fill="#278bf0" opacity=".28"/>
      <text x="20" y="141" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">3</text>
      <text x="54" y="133" fill="#e2ebf7" font-size="14" font-weight="600">合并后台快照</text>
      <text x="54" y="153" fill="#9eb0c8" font-size="12">只提交最新修订</text>
    </g>
  </g>

  <path d="M756 282h86" stroke="#78bbff" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei">
    <rect x="856" y="142" width="282" height="280" rx="24" fill="url(#glass)" stroke="#6d809b"/>
    <text x="888" y="184" fill="#f4f8ff" font-size="20" font-weight="650">应用栏原位更新</text>
    <rect x="888" y="218" width="218" height="70" rx="16" fill="#278bf0" opacity=".20" stroke="#78bbff"/>
    <circle cx="922" cy="253" r="20" fill="#4f8ee8"/>
    <rect x="916" y="245" width="12" height="16" rx="2" fill="#fff"/>
    <text x="956" y="249" fill="#f4f8ff" font-size="15" font-weight="600">正在使用</text>
    <text x="956" y="270" fill="#b8d9ff" font-size="12">左键最小化</text>
    <path d="M997 303v24" stroke="#78bbff" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="888" y="340" width="218" height="56" rx="16" fill="#fff" opacity=".05"/>
    <circle cx="922" cy="368" r="18" fill="#8794a9"/>
    <path d="M913 370h18" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <text x="956" y="365" fill="#dde7f4" font-size="15" font-weight="600">已最小化</text>
    <text x="956" y="384" fill="#9eb0c8" font-size="12">左键还原并切换</text>
  </g>
</svg>
