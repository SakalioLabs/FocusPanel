<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172033"/>
      <stop offset="1" stop-color="#0c1220"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#58a8ff"/>
      <stop offset="1" stop-color="#8c7dff"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="360" rx="28" fill="url(#bg)"/>
  <text x="56" y="64" fill="#f4f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="600">统一应用栏 · 原生任务栏鼠标语义</text>
  <text x="56" y="98" fill="#9eabc0" font-family="Segoe UI, Microsoft YaHei" font-size="16">同一个应用图标，根据按键执行明确且稳定的动作</text>

  <g transform="translate(56 132)">
    <rect width="300" height="164" rx="18" fill="#202b40" stroke="#35435d"/>
    <circle cx="52" cy="52" r="26" fill="url(#accent)"/>
    <text x="52" y="59" text-anchor="middle" fill="white" font-family="Segoe UI" font-size="20" font-weight="700">A</text>
    <text x="92" y="46" fill="#f4f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">普通左键</text>
    <text x="92" y="74" fill="#aeb9ca" font-family="Segoe UI, Microsoft YaHei" font-size="15">启动 / 切换 / 最小化</text>
    <text x="24" y="124" fill="#cbd4e3" font-family="Segoe UI, Microsoft YaHei" font-size="15">多个窗口时，展开一层文字窗口列表</text>
  </g>

  <g transform="translate(410 132)">
    <rect width="300" height="164" rx="18" fill="#202b40" stroke="#516783"/>
    <rect x="24" y="26" width="58" height="52" rx="12" fill="#2b3c58"/>
    <text x="53" y="59" text-anchor="middle" fill="#75baff" font-family="Segoe UI" font-size="17" font-weight="700">Shift</text>
    <text x="98" y="46" fill="#f4f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">Shift + 左键</text>
    <text x="98" y="74" fill="#aeb9ca" font-family="Segoe UI, Microsoft YaHei" font-size="15">直接启动新实例</text>
    <text x="24" y="124" fill="#cbd4e3" font-family="Segoe UI, Microsoft YaHei" font-size="15">不改变当前窗口，也不展开窗口列表</text>
  </g>

  <g transform="translate(764 132)">
    <rect width="300" height="164" rx="18" fill="#202b40" stroke="#665f91"/>
    <rect x="31" y="24" width="42" height="58" rx="20" fill="#2b3c58" stroke="#8c7dff"/>
    <rect x="49" y="29" width="7" height="20" rx="3.5" fill="#9c91ff"/>
    <text x="94" y="46" fill="#f4f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">鼠标中键</text>
    <text x="94" y="74" fill="#aeb9ca" font-family="Segoe UI, Microsoft YaHei" font-size="15">直接启动新实例</text>
    <text x="24" y="124" fill="#cbd4e3" font-family="Segoe UI, Microsoft YaHei" font-size="15">无可靠启动目标时安全忽略，不做猜测</text>
  </g>
</svg>
