    <text x="328" y="33" fill="#53667d" font-family="Segoe UI" font-size="14">·</text>
    <text x="348" y="33" fill="#8fa1b6" font-family="Segoe UI, Microsoft YaHei" font-size="14" text-decoration="line-through">Explorer 内存或隐藏图标按钮</text>
