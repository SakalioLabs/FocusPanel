<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400">
  <rect width="1200" height="400" rx="28" fill="#111827"/>
  <text x="60" y="68" fill="#f8fafc" font-size="30" font-family="Segoe UI, Microsoft YaHei" font-weight="700">设置页一键更新</text>
  <g font-family="Segoe UI, Microsoft YaHei" text-anchor="middle">
    <g transform="translate(60 130)"><circle cx="80" cy="80" r="72" fill="#1e3a8a"/><text x="80" y="72" fill="#dbeafe" font-size="18">检查 Release</text><text x="80" y="101" fill="#93c5fd" font-size="13">读取版本清单</text></g>
    <text x="245" y="220" fill="#64748b" font-size="30">→</text>
    <g transform="translate(300 130)"><circle cx="80" cy="80" r="72" fill="#312e81"/><text x="80" y="72" fill="#e0e7ff" font-size="18">下载更新</text><text x="80" y="101" fill="#a5b4fc" font-size="13">优先差分包</text></g>
    <text x="485" y="220" fill="#64748b" font-size="30">→</text>
    <g transform="translate(540 130)"><circle cx="80" cy="80" r="72" fill="#134e4a"/><text x="80" y="72" fill="#ccfbf1" font-size="18">备份数据库</text><text x="80" y="101" fill="#5eead4" font-size="13">恢复原任务栏</text></g>
    <text x="725" y="220" fill="#64748b" font-size="30">→</text>
    <g transform="translate(780 130)"><circle cx="80" cy="80" r="72" fill="#713f12"/><text x="80" y="72" fill="#fef3c7" font-size="18">安装并重启</text><text x="80" y="101" fill="#fbbf24" font-size="13">Velopack</text></g>
    <text x="965" y="220" fill="#64748b" font-size="30">→</text>
    <g transform="translate(1020 130)"><circle cx="60" cy="80" r="60" fill="#14532d"/><text x="60" y="74" fill="#dcfce7" font-size="17">完成</text><text x="60" y="101" fill="#86efac" font-size="12">保留用户数据</text></g>
  </g>
  <text x="60" y="350" fill="#64748b" font-size="14" font-family="Segoe UI, Microsoft YaHei">安装版支持；源码直接运行的开发版不会原地覆盖自身。</text>
</svg>
