<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111927"/>
      <stop offset="1" stop-color="#252d49"/>
    </linearGradient>
    <linearGradient id="ready" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e6f78"/>
      <stop offset="1" stop-color="#514c8b"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="520" rx="30" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">桌面收纳准备不再卡住主壳</text>
  <text x="54" y="98" fill="#b8c8df" font-family="Segoe UI, Microsoft YaHei" font-size="16">轻量首帧立即绑定；设置、监控器与布局在工作线程准备，只有当前导航代际可以提交</text>

  <rect x="54" y="150" width="250" height="230" rx="22" fill="#1e3046" stroke="#476683" stroke-width="2"/>
  <text x="179" y="190" text-anchor="middle" fill="#eef6ff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="700">UI 线程</text>
  <rect x="82" y="220" width="194" height="52" rx="14" fill="#294461"/>
  <text x="179" y="252" text-anchor="middle" fill="#bde6ff" font-family="Segoe UI, Microsoft YaHei" font-size="15">轻量加载页立即显示</text>
  <rect x="82" y="292" width="194" height="52" rx="14" fill="#26394f"/>
  <text x="179" y="324" text-anchor="middle" fill="#c7d6e9" font-family="Segoe UI, Microsoft YaHei" font-size="15">Panel 可定位与响应</text>

  <path d="M320 264 H410" stroke="#76cfff" stroke-width="5" stroke-linecap="round"/>
  <path d="M394 252 L410 264 L394 276" fill="none" stroke="#76cfff" stroke-width="5" stroke-linejoin="round"/>

  <rect x="426" y="126" width="312" height="278" rx="22" fill="#252f49" stroke="#6c70a0" stroke-width="2"/>
  <text x="582" y="168" text-anchor="middle" fill="#f0efff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="700">工作线程准备</text>
  <rect x="458" y="196" width="248" height="46" rx="13" fill="#323c5a"/>
  <text x="582" y="225" text-anchor="middle" fill="#d8d6f5" font-family="Segoe UI, Microsoft YaHei" font-size="14">读取 settings.json</text>
  <rect x="458" y="258" width="248" height="46" rx="13" fill="#323c5a"/>
  <text x="582" y="287" text-anchor="middle" fill="#d8d6f5" font-family="Segoe UI, Microsoft YaHei" font-size="14">创建桌面与公共桌面监控器</text>
  <rect x="458" y="320" width="248" height="46" rx="13" fill="#323c5a"/>
  <text x="582" y="349" text-anchor="middle" fill="#d8d6f5" font-family="Segoe UI, Microsoft YaHei" font-size="14">启动布局快照与文件刷新</text>

  <path d="M754 264 H838" stroke="#a495ff" stroke-width="5" stroke-linecap="round"/>
  <path d="M822 252 L838 264 L822 276" fill="none" stroke="#a495ff" stroke-width="5" stroke-linejoin="round"/>

  <rect x="854" y="150" width="212" height="230" rx="22" fill="url(#ready)" stroke="#98cddd" stroke-width="2"/>
  <text x="960" y="192" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="700">代际校验</text>
  <text x="960" y="237" text-anchor="middle" fill="#e2f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="14">仍在桌面收纳</text>
  <text x="960" y="263" text-anchor="middle" fill="#aef0d0" font-family="Segoe UI, Microsoft YaHei" font-size="14">原位提交完整页面</text>
  <line x1="886" y1="286" x2="1034" y2="286" stroke="#d7e9ef" stroke-opacity=".35"/>
  <text x="960" y="321" text-anchor="middle" fill="#f3e0b4" font-family="Segoe UI, Microsoft YaHei" font-size="14">已切换其他模块</text>
  <text x="960" y="347" text-anchor="middle" fill="#ffd29a" font-family="Segoe UI, Microsoft YaHei" font-size="14">只缓存，不覆盖当前页</text>

  <rect x="190" y="446" width="740" height="40" rx="15" fill="#21463e" stroke="#3f806c"/>
  <text x="560" y="472" text-anchor="middle" fill="#a9edce" font-family="Segoe UI, Microsoft YaHei" font-size="15">退出竞态：准备完成后发现主壳已释放 → 立即 Dispose → 不留下 FileSystemWatcher</text>
</svg>
