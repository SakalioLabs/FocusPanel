<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf6ff"/>
      <stop offset="1" stop-color="#e4ebf8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".94"/>
      <stop offset="1" stop-color="#eef5ff" stop-opacity=".82"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183958" flood-opacity=".17"/>
    </filter>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="40" r="190" fill="#438fdf" opacity=".11"/>
  <circle cx="70" cy="610" r="180" fill="#7865ce" opacity=".09"/>
  <text x="64" y="72" font-family="Microsoft YaHei, Segoe UI" font-size="25" font-weight="700" fill="#18273d">默认任务栏保持干净</text>
  <text x="64" y="106" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#60738b">窗口入口留在任务栏，后台详情只在主动打开抽屉后出现</text>

  <rect x="76" y="146" width="90" height="414" rx="28" fill="url(#glass)" stroke="#ffffff" filter="url(#shadow)"/>
  <text x="121" y="177" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="11" fill="#60738b">Panel</text>
  <line x1="92" y1="191" x2="150" y2="191" stroke="#d3deeb"/>
  <g>
    <rect x="94" y="211" width="54" height="54" rx="13" fill="#dbeeff"/>
    <rect x="108" y="225" width="26" height="26" rx="7" fill="#1677d2"/>
    <rect x="91" y="226" width="4" height="24" rx="2" fill="#1677d2"/>
    <rect x="94" y="276" width="54" height="54" rx="13" fill="#f5f8fc"/>
    <circle cx="121" cy="303" r="14" fill="#efb52a"/>
    <rect x="91" y="290" width="4" height="13" rx="2" fill="#1677d2" opacity=".65"/>
    <rect x="94" y="341" width="54" height="54" rx="13" fill="#f5f8fc"/>
    <rect x="108" y="355" width="26" height="26" rx="7" fill="#745ed0"/>
  </g>
  <line x1="92" y1="414" x2="150" y2="414" stroke="#d3deeb"/>
  <rect x="94" y="430" width="54" height="46" rx="12" fill="#f5f8fc"/>
  <text x="121" y="450" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="15" fill="#415a76">•••</text>
  <text x="121" y="467" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="9" fill="#60738b">后台</text>
  <text x="121" y="515" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="11" fill="#60738b">18:42</text>

  <rect x="224" y="148" width="408" height="362" rx="22" fill="#ffffff" stroke="#d5e0ec" filter="url(#shadow)"/>
  <circle cx="256" cy="185" r="12" fill="#2daf68"/>
  <text x="280" y="191" font-family="Microsoft YaHei, Segoe UI" font-size="18" font-weight="700" fill="#18273d">紧凑栏默认可见</text>
  <g font-family="Microsoft YaHei, Segoe UI">
    <rect x="252" y="222" width="352" height="68" rx="13" fill="#e8f5ed"/>
    <text x="278" y="250" font-size="15" font-weight="700" fill="#21364e">固定应用</text>
    <text x="278" y="272" font-size="12" fill="#5d7187">保留用户排序与启动入口</text>
    <rect x="252" y="304" width="352" height="68" rx="13" fill="#e8f5ed"/>
    <text x="278" y="332" font-size="15" font-weight="700" fill="#21364e">普通、最大化与最小化窗口</text>
    <text x="278" y="354" font-size="12" fill="#5d7187">都能直接切换或还原</text>
    <rect x="252" y="386" width="352" height="68" rx="13" fill="#edf5ff"/>
    <text x="278" y="414" font-size="15" font-weight="700" fill="#21364e">窗口口径的状态提示</text>
    <text x="278" y="436" font-size="12" fill="#5d7187">“任务栏有 3 个可切换应用”</text>
  </g>

  <rect x="670" y="148" width="438" height="362" rx="22" fill="#173f69" filter="url(#shadow)"/>
  <circle cx="702" cy="185" r="12" fill="#f0b629"/>
  <text x="726" y="191" font-family="Microsoft YaHei, Segoe UI" font-size="18" font-weight="700" fill="#ffffff">不在默认任务栏暴露</text>
  <g font-family="Microsoft YaHei, Segoe UI">
    <rect x="700" y="222" width="378" height="58" rx="12" fill="#28547d"/>
    <text x="724" y="257" font-size="14" fill="#dcecff">无窗口进程与后台宿主</text>
    <rect x="700" y="294" width="378" height="58" rx="12" fill="#28547d"/>
    <text x="724" y="329" font-size="14" fill="#dcecff">消息窗口和托盘常驻项</text>
    <rect x="700" y="366" width="378" height="58" rx="12" fill="#28547d"/>
    <text x="724" y="401" font-size="14" fill="#dcecff">全量后台数量角标</text>
    <path d="M700 451h378" stroke="#426b91"/>
    <text x="700" y="480" font-size="13" fill="#bdd9f2">需要时主动打开“后台与窗口”抽屉</text>
  </g>
  <text x="590" y="566" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#47617f">紧凑任务栏只回答一件事：我现在能切换到哪些应用窗口</text>
</svg>
