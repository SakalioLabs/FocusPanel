<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf5ff"/>
      <stop offset="1" stop-color="#dcecff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17385d" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1180" height="620" fill="url(#bg)"/>
  <text x="64" y="78" font-family="Microsoft YaHei, Segoe UI" font-size="34" font-weight="700" fill="#17304f">应用栏只保留任务栏该有的内容</text>
  <text x="64" y="114" font-family="Microsoft YaHei, Segoe UI" font-size="16" fill="#55708d">固定应用 + 普通 / 最大化 / 最小化窗口，后台宿主不再混入</text>

  <g filter="url(#shadow)">
    <rect x="64" y="154" width="438" height="378" rx="24" fill="#ffffff" fill-opacity=".88"/>
    <text x="96" y="202" font-family="Microsoft YaHei, Segoe UI" font-size="21" font-weight="700" fill="#203c5c">Windows 窗口快照</text>
    <g font-family="Microsoft YaHei, Segoe UI" font-size="16">
      <rect x="96" y="232" width="374" height="58" rx="14" fill="#e8f4ff"/><circle cx="126" cy="261" r="13" fill="#2385d7"/><text x="154" y="267" fill="#24445f">普通窗口</text><text x="438" y="267" text-anchor="end" fill="#16836b">保留</text>
      <rect x="96" y="302" width="374" height="58" rx="14" fill="#e8f4ff"/><circle cx="126" cy="331" r="13" fill="#4b9ee4"/><text x="154" y="337" fill="#24445f">最小化窗口</text><text x="438" y="337" text-anchor="end" fill="#16836b">保留</text>
      <rect x="96" y="372" width="374" height="58" rx="14" fill="#f4f7fa"/><circle cx="126" cy="401" r="13" fill="#a8b7c6"/><text x="154" y="407" fill="#60758a">消息窗口 / 后台宿主</text><text x="438" y="407" text-anchor="end" fill="#b85252">排除</text>
      <rect x="96" y="442" width="374" height="58" rx="14" fill="#f4f7fa"/><circle cx="126" cy="471" r="13" fill="#a8b7c6"/><text x="154" y="477" fill="#60758a">无窗口后台进程</text><text x="438" y="477" text-anchor="end" fill="#b85252">排除</text>
    </g>
  </g>

  <path d="M526 343h92" stroke="#307fca" stroke-width="5" stroke-linecap="round"/><path d="M606 329l18 14-18 14" fill="none" stroke="#307fca" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="648" y="154" width="468" height="378" rx="24" fill="#14283f"/>
    <text x="680" y="202" font-family="Microsoft YaHei, Segoe UI" font-size="21" font-weight="700" fill="#eef7ff">任务栏应用与窗口</text>
    <text x="680" y="233" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#9db5ce">与 76px 紧凑栏使用同一安全投影</text>
    <g font-family="Microsoft YaHei, Segoe UI">
      <rect x="680" y="266" width="404" height="70" rx="16" fill="#203e5d"/><circle cx="716" cy="301" r="18" fill="#f0b744"/><text x="752" y="298" font-size="17" fill="#f3f8fd">文件资源管理器</text><text x="752" y="319" font-size="12" fill="#a9bfd4">已固定 · 2 个可切换窗口</text>
      <rect x="680" y="350" width="404" height="70" rx="16" fill="#203e5d"/><circle cx="716" cy="385" r="18" fill="#45a0e5"/><text x="752" y="382" font-size="17" fill="#f3f8fd">浏览器</text><text x="752" y="403" font-size="12" fill="#a9bfd4">最小化 · 单击恢复</text>
      <rect x="680" y="434" width="404" height="70" rx="16" fill="#203e5d"/><circle cx="716" cy="469" r="18" fill="#8e7be8"/><text x="752" y="466" font-size="17" fill="#f3f8fd">编辑器</text><text x="752" y="487" font-size="12" fill="#a9bfd4">已固定 · 尚未运行</text>
    </g>
  </g>
  <text x="590" y="582" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="15" fill="#526f8b">不轮询全部进程 · 不读取 Explorer 私有托盘结构 · 不丢失最小化窗口</text>
</svg>
