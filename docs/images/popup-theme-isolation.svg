<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 独立 Popup 与 DWM 壳层主题隔离</title>
  <desc id="desc">主窗口继续使用 DWM 毛玻璃，独立菜单窗口改用不透明主题表面，确保文字对比度稳定。</desc>
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#42536f" stop-opacity=".72"/>
      <stop offset="1" stop-color="#161b25" stop-opacity=".88"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#07101d" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1120" height="360" rx="28" fill="#eef3fa"/>
  <text x="56" y="58" font-family="Segoe UI, Microsoft YaHei" font-size="25" font-weight="700" fill="#172033">弹层主题与毛玻璃宿主分离</text>
  <text x="56" y="88" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#617087">Popup 是独立 HWND，不能依赖主窗口的 DWM 背景取样</text>

  <g transform="translate(56 118)">
    <rect width="310" height="184" rx="22" fill="url(#shell)" stroke="#ffffff" stroke-opacity=".25"/>
    <circle cx="42" cy="42" r="14" fill="#54a8e8"/>
    <rect x="70" y="29" width="150" height="12" rx="6" fill="#f4f7ff" fill-opacity=".94"/>
    <rect x="70" y="51" width="102" height="9" rx="4.5" fill="#b6c0d4"/>
    <rect x="26" y="86" width="258" height="72" rx="14" fill="#ffffff" fill-opacity=".10"/>
    <text x="155" y="177" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#d8e1f0">主壳：DWM 毛玻璃 / 可透明</text>
  </g>

  <path d="M407 210h96" stroke="#2d78b7" stroke-width="4" stroke-linecap="round"/>
  <path d="m492 198 16 12-16 12" fill="none" stroke="#2d78b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="455" y="188" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#52637a">独立令牌</text>

  <g transform="translate(544 118)" filter="url(#shadow)">
    <rect width="240" height="184" rx="18" fill="#20242c" stroke="#49515e"/>
    <rect x="12" y="14" width="216" height="42" rx="10" fill="#2c78b8"/>
    <text x="28" y="40" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#ffffff">packages - 文件资源管理器</text>
    <text x="28" y="86" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#f5f7ff">release - 文件资源管理器</text>
    <text x="28" y="126" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#f5f7ff">切换到此窗口</text>
    <text x="120" y="167" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#aeb5c8">深色 Popup：不透明深底</text>
  </g>

  <g transform="translate(824 118)" filter="url(#shadow)">
    <rect width="240" height="184" rx="18" fill="#ffffff" stroke="#d5dbe5"/>
    <rect x="12" y="14" width="216" height="42" rx="10" fill="#d9ecfb"/>
    <text x="28" y="40" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#172033">packages - 文件资源管理器</text>
    <text x="28" y="86" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#172033">release - 文件资源管理器</text>
    <text x="28" y="126" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#172033">切换到此窗口</text>
    <text x="120" y="167" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#667085">浅色 Popup：不透明白底</text>
  </g>
</svg>
