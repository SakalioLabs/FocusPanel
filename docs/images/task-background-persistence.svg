<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1a2a43"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45c9ff"/>
      <stop offset="1" stop-color="#8e7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".24"/>
    </filter>
  </defs>
  <rect width="1120" height="520" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8fd" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">任务工作区 · 后台短上下文持久化</text>
  <text x="54" y="96" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">查询、增删改和全局字段不再共享 ViewModel 的长期 EF 上下文</text>

  <g filter="url(#shadow)">
    <rect x="54" y="138" width="238" height="250" rx="22" fill="#223149" stroke="#40536f"/>
    <text x="78" y="180" fill="#e5eef9" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">WPF 交互</text>
    <text x="78" y="222" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">打开 / 切换任务范围</text>
    <text x="78" y="257" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">新增 / 删除 / 编辑</text>
    <text x="78" y="292" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">字段定义 / 图片目录</text>
    <rect x="78" y="326" width="190" height="36" rx="18" fill="#2b405d"/>
    <text x="173" y="349" text-anchor="middle" fill="#7ed3ff" font-family="Segoe UI, Microsoft YaHei" font-size="13">立即返回可响应状态</text>
  </g>

  <path d="M308 262 H358" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M346 250 L364 262 L346 274" fill="none" stroke="#61a8ff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="378" y="122" width="300" height="282" rx="24" fill="#283b56" stroke="#597493"/>
    <text x="528" y="166" text-anchor="middle" fill="#eef5fd" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">单一后台数据库闸门</text>
    <circle cx="418" cy="216" r="8" fill="#55d69d"/>
    <text x="442" y="222" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="14">180ms 合并编辑保存</text>
    <circle cx="418" cy="260" r="8" fill="#65c9ff"/>
    <text x="442" y="266" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="14">显式命令严格排队</text>
    <circle cx="418" cy="304" r="8" fill="#a794ff"/>
    <text x="442" y="310" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="14">失败释放闸门，后续可恢复</text>
    <rect x="406" y="342" width="244" height="38" rx="19" fill="#304a68"/>
    <text x="528" y="366" text-anchor="middle" fill="#c5d7e9" font-family="Segoe UI, Microsoft YaHei" font-size="13">不并发使用任何 DbContext</text>
  </g>

  <path d="M696 262 H746" stroke="url(#flow)" stroke-width="5" stroke-linecap="round"/>
  <path d="M734 250 L752 262 L734 274" fill="none" stroke="#887eff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="766" y="138" width="300" height="250" rx="22" fill="#223149" stroke="#40536f"/>
    <text x="790" y="180" fill="#e5eef9" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">每次操作独立上下文</text>
    <rect x="790" y="208" width="252" height="42" rx="13" fill="#2b405d"/>
    <text x="916" y="234" text-anchor="middle" fill="#f1f5fb" font-family="Segoe UI, Microsoft YaHei" font-size="14">创建 → 查询 / 写入 → 释放</text>
    <rect x="790" y="264" width="252" height="42" rx="13" fill="#30443f"/>
    <text x="916" y="290" text-anchor="middle" fill="#bff1d8" font-family="Segoe UI, Microsoft YaHei" font-size="14">读取使用 AsNoTracking</text>
    <text x="790" y="346" fill="#bdcadc" font-family="Segoe UI, Microsoft YaHei" font-size="14">退出前排空已进入队列的修改</text>
  </g>

  <rect x="54" y="438" width="1012" height="46" rx="17" fill="#20314a" stroke="#405675"/>
  <text x="560" y="467" text-anchor="middle" fill="#c9d8e9" font-family="Segoe UI, Microsoft YaHei" font-size="15">模块切换不等待 SQLite · EF 跟踪状态不跨操作泄漏 · 用户任务数据语义保持不变</text>
</svg>
