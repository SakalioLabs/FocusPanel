<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#182840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51c7ff"/>
      <stop offset="1" stop-color="#8a79ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1120" height="500" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8fc" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">任务栏守护 · 连续异常确认</text>
  <text x="54" y="96" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">只读采样消除 Shell 瞬态误判，持续失效仍安全恢复一次</text>

  <g filter="url(#shadow)">
    <rect x="54" y="134" width="242" height="236" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="78" y="176" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">每 2 秒只读采样</text>
    <text x="78" y="220" fill="#b9c8dc" font-family="Segoe UI, Microsoft YaHei" font-size="15">窗口句柄</text>
    <text x="78" y="256" fill="#b9c8dc" font-family="Segoe UI, Microsoft YaHei" font-size="15">可见状态</text>
    <text x="78" y="292" fill="#b9c8dc" font-family="Segoe UI, Microsoft YaHei" font-size="15">AppBar AutoHide</text>
    <rect x="78" y="320" width="190" height="30" rx="15" fill="#293b56"/>
    <text x="173" y="341" text-anchor="middle" fill="#7fd0ff" font-family="Segoe UI, Microsoft YaHei" font-size="13">0 次系统写入</text>
  </g>

  <path d="M316 252 H388" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M374 240 L392 252 L374 264" fill="none" stroke="#718cff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="410" y="122" width="300" height="260" rx="24" fill="#273a54" stroke="#587293"/>
    <text x="560" y="164" text-anchor="middle" fill="#e8f1fb" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">确认器</text>
    <circle cx="454" cy="210" r="10" fill="#ffc66d"/>
    <text x="480" y="216" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">第 1 次异常：等待确认</text>
    <circle cx="454" cy="258" r="10" fill="#55d69d"/>
    <text x="480" y="264" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">下一次正常：立即清零</text>
    <circle cx="454" cy="306" r="10" fill="#ff7d8d"/>
    <text x="480" y="312" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">同类异常 × 2：确认失效</text>
    <rect x="438" y="338" width="244" height="30" rx="15" fill="#304765"/>
    <text x="560" y="359" text-anchor="middle" fill="#bcd0e7" font-family="Segoe UI, Microsoft YaHei" font-size="13">不同原因重新开始计数</text>
  </g>

  <path d="M730 252 H802" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M788 240 L806 252 L788 264" fill="none" stroke="#8878ff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="824" y="134" width="242" height="236" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="848" y="176" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">确定动作</text>
    <circle cx="862" cy="222" r="7" fill="#55d69d"/>
    <text x="882" y="228" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">瞬态恢复正常</text>
    <circle cx="862" cy="268" r="7" fill="#ff7d8d"/>
    <text x="882" y="274" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">持续失效：恢复一次</text>
    <circle cx="862" cy="314" r="7" fill="#7fd0ff"/>
    <text x="882" y="320" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">紧急标记：立即恢复</text>
  </g>

  <rect x="54" y="414" width="1012" height="50" rx="17" fill="#202f47" stroke="#3c506d"/>
  <text x="560" y="445" text-anchor="middle" fill="#c6d4e7" font-family="Segoe UI, Microsoft YaHei" font-size="15">新任务栏句柄 → ExplorerHostChanged · 持续可见 → WindowsTaskbarReappeared</text>
