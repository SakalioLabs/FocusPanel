<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#192740"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3ff"/>
      <stop offset="1" stop-color="#8878ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1120" height="500" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8fc" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">桌面拖拽 · 交互锁与异常边界</text>
  <text x="54" y="96" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">异步文件属性写入完成前保持 Panel 展开，所有结束路径都幂等释放</text>

  <g filter="url(#shadow)">
    <rect x="54" y="136" width="230" height="224" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="78" y="176" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">拖拽来源</text>
    <rect x="78" y="202" width="182" height="54" rx="15" fill="#2d405c"/>
    <text x="169" y="235" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei" font-size="15">Panel 内部拖出</text>
    <rect x="78" y="274" width="182" height="54" rx="15" fill="#2d405c"/>
    <text x="169" y="307" text-anchor="middle" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei" font-size="15">Explorer 外部拖入</text>
  </g>

  <path d="M304 248 H386" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M372 236 L390 248 L372 260" fill="none" stroke="#718cff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="408" y="124" width="304" height="248" rx="24" fill="#263852" stroke="#577091"/>
    <rect x="434" y="148" width="252" height="46" rx="23" fill="#314967"/>
    <text x="560" y="177" text-anchor="middle" fill="#7fd0ff" font-family="Segoe UI, Microsoft YaHei" font-size="15" font-weight="600">DesktopDragSession</text>
    <text x="442" y="231" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="16">① 记录内部 / 外部归属</text>
    <text x="442" y="271" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="16">② 持有临时交互锁</text>
    <text x="442" y="311" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="16">③ 观察全部异步异常</text>
    <text x="442" y="351" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="16">④ finally 幂等释放</text>
  </g>

  <path d="M732 248 H814" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M800 236 L818 248 L800 260" fill="none" stroke="#8878ff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="836" y="136" width="230" height="224" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="860" y="176" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">确定结果</text>
    <circle cx="874" cy="220" r="7" fill="#4fd49a"/>
    <text x="894" y="226" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">收纳完成</text>
    <circle cx="874" cy="264" r="7" fill="#ffc66d"/>
    <text x="894" y="270" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">取消或离开</text>
    <circle cx="874" cy="308" r="7" fill="#ff7d8d"/>
    <text x="894" y="314" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">失败并提示</text>
  </g>

  <rect x="54" y="405" width="1012" height="58" rx="18" fill="#202f47" stroke="#3c506d"/>
  <text x="560" y="440" text-anchor="middle" fill="#c6d4e7" font-family="Segoe UI, Microsoft YaHei" font-size="15">无论成功、失败、取消或提示异常：停止自动滚动 · 释放拖拽状态 · 恢复自动收起</text>
</svg>
