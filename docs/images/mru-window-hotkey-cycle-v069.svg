<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16253c"/>
      <stop offset="1" stop-color="#06101e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff" stop-opacity=".23"/>
      <stop offset="1" stop-color="#90b5dc" stop-opacity=".10"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="180" cy="112" r="190" fill="#2589ee" opacity=".16"/>
  <circle cx="1090" cy="620" r="245" fill="#50d0b8" opacity=".10"/>
  <text x="70" y="86" fill="#f6faff" font-family="Segoe UI, Microsoft YaHei" font-size="40" font-weight="700">按最近使用顺序连续切换</text>
  <text x="72" y="130" fill="#afc0d4" font-family="Segoe UI, Microsoft YaHei" font-size="21">真实窗口句柄 MRU · 当前会话内存 · 无标题猜测</text>
  <g transform="translate(70 220)" font-family="Segoe UI, Microsoft YaHei">
    <rect width="420" height="82" rx="20" fill="#10223a" stroke="#76b6f0" stroke-opacity=".48"/>
    <text x="24" y="35" fill="#f6faff" font-size="20" font-weight="600">第一次 Ctrl + Alt + W</text>
    <text x="24" y="62" fill="#9fb4ca" font-size="17">直接选中“上一个窗口”</text>
    <path d="M430 41h86" stroke="#53cdb8" stroke-width="4" stroke-linecap="round"/>
    <path d="M504 29l14 12-14 12" fill="none" stroke="#53cdb8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="134" width="420" height="82" rx="20" fill="#10223a" stroke="#76b6f0" stroke-opacity=".35"/>
    <text x="24" y="169" fill="#f6faff" font-size="20" font-weight="600">再次按同一快捷键</text>
    <text x="24" y="196" fill="#9fb4ca" font-size="17">继续向后循环，末尾回到开头</text>
    <path d="M430 175h86" stroke="#53cdb8" stroke-width="4" stroke-linecap="round"/>
    <path d="M504 163l14 12-14 12" fill="none" stroke="#53cdb8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="0" y="268" width="420" height="82" rx="20" fill="#10223a" stroke="#76b6f0" stroke-opacity=".28"/>
    <text x="24" y="303" fill="#f6faff" font-size="20" font-weight="600">Enter 确认切换</text>
    <text x="24" y="330" fill="#9fb4ca" font-size="17">Delete 关闭 · Esc 取消</text>
  </g>
  <g transform="translate(610 55)" filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei">
    <rect width="590" height="610" rx="32" fill="url(#glass)" stroke="#dcecff" stroke-opacity=".27"/>
    <text x="32" y="52" fill="#f6faff" font-size="25" font-weight="600">全部窗口</text>
    <text x="458" y="52" fill="#a4b8ce" font-size="17">MRU 顺序</text>
    <g transform="translate(30 84)">
      <rect width="530" height="96" rx="18" fill="#0a1728" fill-opacity=".72"/>
      <circle cx="48" cy="48" r="25" fill="#e8a740"/>
      <text x="88" y="43" fill="#f6faff" font-size="20" font-weight="600">当前：项目方案</text>
      <text x="88" y="69" fill="#9fb4ca" font-size="16">Word · 当前前台</text>
      <text x="478" y="55" fill="#7e94aa" font-size="14">#0</text>
      <rect y="112" width="530" height="96" rx="18" fill="#1b4167" stroke="#55adf2" stroke-width="2"/>
      <circle cx="48" cy="160" r="25" fill="#4f94e8"/>
      <text x="88" y="155" fill="#f6faff" font-size="20" font-weight="600">上一个：GitHub</text>
      <text x="88" y="181" fill="#b8cee3" font-size="16">浏览器 · 首次预选</text>
      <text x="450" y="166" fill="#70caff" font-size="14">Enter</text>
      <rect y="224" width="530" height="96" rx="18" fill="#0a1728" fill-opacity=".72"/>
      <circle cx="48" cy="272" r="25" fill="#46b99e"/>
      <text x="88" y="267" fill="#f6faff" font-size="20" font-weight="600">更早：下载</text>
      <text x="88" y="293" fill="#9fb4ca" font-size="16">资源管理器 · 再按一次选中</text>
      <text x="478" y="279" fill="#7e94aa" font-size="14">#2</text>
      <rect y="336" width="530" height="96" rx="18" fill="#0a1728" fill-opacity=".72"/>
      <circle cx="48" cy="384" r="25" fill="#896be8"/>
      <text x="88" y="379" fill="#f6faff" font-size="20" font-weight="600">终端</text>
      <text x="88" y="405" fill="#9fb4ca" font-size="16">PowerShell · 未知项稳定排后</text>
      <text x="478" y="391" fill="#7e94aa" font-size="14">#3</text>
    </g>
    <text x="34" y="554" fill="#91c6f7" font-size="17">重复快捷键：#1 → #2 → #3 → #0 → #1</text>
    <text x="34" y="584" fill="#9fb4ca" font-size="15">关闭或失效窗口自动跳过，不保存到数据库</text>
  </g>
</svg>
