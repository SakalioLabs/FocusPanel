<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="420" viewBox="0 0 1080 420" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 先体验再接管任务栏</title>
  <desc id="desc">首次启动默认保留 Windows 任务栏，Panel 紧凑栏保持可见，用户可在体验后从设置主动接管。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081221"/>
      <stop offset="1" stop-color="#172644"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a8cff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1080" height="420" rx="28" fill="url(#bg)"/>
  <text x="52" y="58" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">先建立信任，再替代系统任务栏</text>
  <text x="52" y="90" fill="#9fb1d1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">默认路径不改变 Windows 壳层；接管是用户体验后的主动选择</text>

  <g transform="translate(52 128)" filter="url(#shadow)">
    <rect width="286" height="224" rx="22" fill="#182642" stroke="#30466b"/>
    <circle cx="32" cy="34" r="16" fill="#263b61"/>
    <text x="32" y="40" text-anchor="middle" fill="#8db4ff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">1</text>
    <text x="60" y="40" fill="#f3f6fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="650">首次启动</text>
    <text x="26" y="83" fill="#afbed8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">76px 紧凑栏立即可见</text>
    <rect x="26" y="105" width="234" height="52" rx="14" fill="url(#accent)"/>
    <text x="143" y="137" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="650">开始使用（保留任务栏）</text>
    <text x="26" y="190" fill="#8298bc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">默认安全，不先动系统界面</text>
  </g>

  <path d="M356 240h56" stroke="#6f88b2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M403 232l10 8-10 8" fill="none" stroke="#6f88b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(430 128)" filter="url(#shadow)">
    <rect width="286" height="224" rx="22" fill="#182642" stroke="#30466b"/>
    <circle cx="32" cy="34" r="16" fill="#263b61"/>
    <text x="32" y="40" text-anchor="middle" fill="#8db4ff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">2</text>
    <text x="60" y="40" fill="#f3f6fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="650">完整体验</text>
    <text x="26" y="83" fill="#afbed8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">收纳 · 任务 · 番茄钟 · AI</text>
    <g transform="translate(26 105)">
      <rect width="48" height="48" rx="14" fill="#263b61"/>
      <rect x="59" width="48" height="48" rx="14" fill="#263b61"/>
      <rect x="118" width="48" height="48" rx="14" fill="#263b61"/>
      <rect x="177" width="48" height="48" rx="14" fill="#263b61"/>
      <circle cx="24" cy="24" r="7" fill="#70a0ff"/>
      <path d="M76 17h14v14H76z" fill="none" stroke="#8db4ff" stroke-width="2"/>
      <circle cx="142" cy="24" r="8" fill="none" stroke="#a78bfa" stroke-width="2"/>
      <path d="M199 17l6 7-6 7-6-7z" fill="#c4b5fd"/>
    </g>
    <text x="26" y="190" fill="#8298bc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">引导完成后不再反复弹出</text>
  </g>

  <path d="M734 240h56" stroke="#6f88b2" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M781 232l10 8-10 8" fill="none" stroke="#6f88b2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(808 128)" filter="url(#shadow)">
    <rect width="220" height="224" rx="22" fill="#182642" stroke="#30466b"/>
    <circle cx="32" cy="34" r="16" fill="#263b61"/>
    <text x="32" y="40" text-anchor="middle" fill="#8db4ff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">3</text>
    <text x="60" y="40" fill="#f3f6fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="650">自主决定</text>
    <text x="24" y="83" fill="#afbed8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">设置 → 任务栏替代</text>
    <rect x="24" y="105" width="172" height="52" rx="14" fill="#253653" stroke="#5977aa"/>
    <text x="110" y="137" text-anchor="middle" fill="#dbe7fb" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">主动接管</text>
    <text x="24" y="190" fill="#8298bc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">随时可恢复</text>
  </g>
</svg>
