<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#68b8f2"/>
      <stop offset="1" stop-color="#2387d0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1180" height="500" rx="32" fill="url(#bg)"/>
  <text x="62" y="72" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">统一 Fluent 滚动系统</text>
  <text x="62" y="106" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">一套模板覆盖主壳、工作区与所有弹层 · 深浅色动态资源 · 不改变原生滚动语义</text>

  <g transform="translate(62 145)" filter="url(#shadow)">
    <rect width="650" height="292" rx="22" fill="#232d39" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="26" y="42" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">真实内容区域</text>
    <rect x="26" y="64" width="560" height="50" rx="12" fill="#ffffff" fill-opacity=".055"/>
    <rect x="26" y="128" width="560" height="50" rx="12" fill="#ffffff" fill-opacity=".055"/>
    <rect x="26" y="192" width="560" height="50" rx="12" fill="#ffffff" fill-opacity=".055"/>
    <rect x="26" y="256" width="420" height="12" rx="6" fill="#ffffff" fill-opacity=".08"/>
    <rect x="590" y="18" width="10" height="250" rx="5" fill="#000" fill-opacity=".12"/>
    <rect x="592" y="56" width="6" height="82" rx="3" fill="#aeb5c8" fill-opacity=".58"/>
    <rect x="26" y="272" width="560" height="10" rx="5" fill="#000" fill-opacity=".12"/>
    <rect x="110" y="274" width="132" height="6" rx="3" fill="#aeb5c8" fill-opacity=".58"/>
    <text x="476" y="264" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="13">10px 轨道</text>
  </g>

  <g transform="translate(760 150)">
    <rect width="356" height="126" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="22" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="17" font-weight="600">普通状态</text>
    <rect x="22" y="55" width="312" height="10" rx="5" fill="#000" fill-opacity=".14"/>
    <rect x="78" y="57" width="104" height="6" rx="3" fill="#aeb5c8" fill-opacity=".58"/>
    <text x="22" y="98" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">柔和滑块，不抢夺内容层级</text>
  </g>
  <g transform="translate(760 300)">
    <rect width="356" height="126" rx="18" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="22" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="17" font-weight="600">悬停 / 拖动</text>
    <rect x="22" y="55" width="312" height="10" rx="5" fill="#000" fill-opacity=".14"/>
    <rect x="128" y="57" width="104" height="6" rx="3" fill="url(#accent)"/>
    <text x="22" y="98" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">强调色反馈，轨道空白仍可分页</text>
  </g>
</svg>
