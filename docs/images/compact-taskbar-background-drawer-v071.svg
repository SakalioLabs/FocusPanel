<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="650" viewBox="0 0 1180 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091321"/>
      <stop offset="1" stop-color="#192943"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#6fb9ff" stop-opacity=".10"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1180" height="650" rx="30" fill="url(#bg)"/>
  <text x="54" y="66" fill="#f4f8ff" font-family="Segoe UI, sans-serif" font-size="30" font-weight="700">任务栏负责切换 · 后台抽屉负责完整管理</text>
  <text x="54" y="104" fill="#a8bdd5" font-family="Segoe UI, sans-serif" font-size="16">同一个实时应用集合，两种清晰视图，不再让纯后台宿主挤占任务栏</text>

  <rect x="54" y="145" width="440" height="440" rx="24" fill="#202f48" stroke="#405979"/>
  <text x="84" y="188" fill="#f1f7ff" font-family="Segoe UI, sans-serif" font-size="21" font-weight="650">76px 紧凑任务栏</text>
  <text x="84" y="216" fill="#91aac6" font-family="Segoe UI, sans-serif" font-size="14">固定应用 + 有可见窗口的运行应用</text>
  <rect x="386" y="180" width="58" height="346" rx="27" fill="url(#glass)" stroke="#8bd8ff" filter="url(#shadow)"/>
  <g>
    <circle cx="415" cy="222" r="15" fill="#53c7ff"/><path d="M409 222h12M415 216v12" stroke="#071421" stroke-width="2"/>
    <circle cx="415" cy="270" r="15" fill="#ffcb68"/><rect x="407" y="263" width="16" height="14" rx="3" fill="#2b3440"/>
    <rect x="399" y="305" width="32" height="2" rx="1" fill="#7892ad"/>
    <circle cx="415" cy="340" r="16" fill="#6ce2a7"/><path d="M408 340l5 5 9-11" fill="none" stroke="#123226" stroke-width="3"/>
    <circle cx="415" cy="392" r="16" fill="#9275ff"/><rect x="407" y="384" width="16" height="16" rx="4" fill="#291f55"/>
    <circle cx="415" cy="444" r="16" fill="#ff7296"/><path d="M408 437h14v14h-14z" fill="#4e1d2b"/>
    <rect x="409" y="464" width="4" height="22" rx="2" fill="#51c7ff"/>
  </g>
  <text x="84" y="280" fill="#dcecff" font-family="Segoe UI, sans-serif" font-size="17">✓ 切换、最小化、多窗口列表</text>
  <text x="84" y="320" fill="#dcecff" font-family="Segoe UI, sans-serif" font-size="17">✓ 滚轮、键盘和九槽位快捷键</text>
  <text x="84" y="360" fill="#dcecff" font-family="Segoe UI, sans-serif" font-size="17">✓ 拖动排序与运行应用固定</text>
  <text x="84" y="418" fill="#91aac6" font-family="Segoe UI, sans-serif" font-size="15">未固定且没有可见窗口的后台宿主</text>
  <text x="84" y="445" fill="#91aac6" font-family="Segoe UI, sans-serif" font-size="15">不会出现在这里，也不会占用滚动长度</text>
  <rect x="84" y="492" width="250" height="48" rx="13" fill="#157ec2"/>
  <text x="107" y="523" fill="#fff" font-family="Segoe UI, sans-serif" font-size="15">右键空白处：右上 / 右中 / 右下</text>

  <path d="M525 365h70" stroke="#5bc8ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M584 355l12 10-12 10" fill="none" stroke="#5bc8ff" stroke-width="3"/>

  <rect x="626" y="145" width="500" height="440" rx="24" fill="#202f48" stroke="#405979"/>
  <text x="658" y="188" fill="#f1f7ff" font-family="Segoe UI, sans-serif" font-size="21" font-weight="650">Panel 自有后台抽屉</text>
  <text x="658" y="216" fill="#91aac6" font-family="Segoe UI, sans-serif" font-size="14">固定、窗口与纯后台应用的完整集合</text>
  <rect x="658" y="244" width="436" height="50" rx="13" fill="#132136" stroke="#4b6382"/>
  <text x="680" y="276" fill="#7892ad" font-family="Segoe UI, sans-serif" font-size="15">搜索应用或 EXE 名称…</text>
  <g font-family="Segoe UI, sans-serif" font-size="14">
    <rect x="658" y="312" width="86" height="36" rx="12" fill="#1885d0"/><text x="685" y="335" fill="#fff">全部</text>
    <rect x="754" y="312" width="92" height="36" rx="12" fill="#2b3d57"/><text x="773" y="335" fill="#c9dbef">有窗口</text>
    <rect x="856" y="312" width="92" height="36" rx="12" fill="#2b3d57"/><text x="875" y="335" fill="#c9dbef">纯后台</text>
  </g>
  <g font-family="Segoe UI, sans-serif">
    <rect x="658" y="366" width="436" height="58" rx="14" fill="#172740"/>
    <circle cx="686" cy="395" r="15" fill="#6ce2a7"/><text x="714" y="393" fill="#edf6ff" font-size="16">编辑器</text><text x="714" y="412" fill="#8fa7c2" font-size="12">2 个可见窗口</text>
    <rect x="658" y="436" width="436" height="58" rx="14" fill="#172740"/>
    <circle cx="686" cy="465" r="15" fill="#f6bd60"/><text x="714" y="463" fill="#edf6ff" font-size="16">同步助手</text><text x="714" y="482" fill="#8fa7c2" font-size="12">纯后台 · 可固定或启动界面</text>
    <rect x="658" y="506" width="436" height="58" rx="14" fill="#172740"/>
    <circle cx="686" cy="535" r="15" fill="#9275ff"/><text x="714" y="533" fill="#edf6ff" font-size="16">输入法服务</text><text x="714" y="552" fill="#8fa7c2" font-size="12">纯后台 · 不占紧凑任务栏</text>
  </g>
</svg>
