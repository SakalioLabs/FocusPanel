      <text x="18" y="35" fill="#74cff6" font-family="Microsoft YaHei UI, sans-serif" font-size="15" font-weight="650">固定 / 排序</text>
      <text x="126" y="35" fill="#dce8f2" font-family="Microsoft YaHei UI, sans-serif" font-size="15">确认 SQLite 提交成功</text>
