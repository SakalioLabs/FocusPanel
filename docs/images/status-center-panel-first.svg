<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101826"/>
      <stop offset="1" stop-color="#283954"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1120" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="180" cy="90" r="210" fill="#268cff" opacity=".13"/>
  <circle cx="980" cy="540" r="250" fill="#7c5cff" opacity=".14"/>

  <g filter="url(#shadow)">
    <rect x="82" y="48" width="956" height="524" rx="28" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/>
    <text x="118" y="94" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="25" font-weight="600">状态中心</text>
    <text x="1000" y="92" fill="#9eb2cc" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="end">Panel 自有能力优先</text>

    <rect x="116" y="122" width="888" height="64" rx="16" fill="#268cff" opacity=".9"/>
    <text x="146" y="161" fill="white" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">后台与窗口 · Panel 管理</text>
    <text x="972" y="160" fill="#e3f1ff" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="end">切换 · 关闭 · 置顶 · 跨屏</text>

    <text x="120" y="220" fill="#aebfd6" font-family="Segoe UI, sans-serif" font-size="14">Panel 状态详情</text>
    <g font-family="Segoe UI, sans-serif" font-size="16" text-anchor="middle">
      <rect x="116" y="238" width="280" height="58" rx="14" fill="#268cff" fill-opacity=".22" stroke="#65b4ff" stroke-opacity=".55"/>
      <text x="256" y="273" fill="#ddecff" font-weight="600">网络</text>
      <rect x="420" y="238" width="280" height="58" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
      <text x="560" y="273" fill="#dce7f7">应用音量</text>
      <rect x="724" y="238" width="280" height="58" rx="14" fill="#fff" fill-opacity=".07" stroke="#fff" stroke-opacity=".12"/>
      <text x="864" y="273" fill="#dce7f7">媒体与电池</text>
    </g>

    <rect x="116" y="320" width="888" height="142" rx="18" fill="#09111f" fill-opacity=".5" stroke="#fff" stroke-opacity=".12"/>
    <text x="144" y="356" fill="#eef4ff" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">网络与无线</text>
    <text x="972" y="356" fill="#81c3ff" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="end">Wi‑Fi · 已连接</text>
    <g font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">
      <rect x="144" y="380" width="250" height="52" rx="13" fill="#fff" fill-opacity=".08"/>
      <text x="269" y="412" fill="#dce7f7">关闭 Wi‑Fi</text>
      <rect x="432" y="380" width="250" height="52" rx="13" fill="#fff" fill-opacity=".08"/>
      <text x="557" y="412" fill="#dce7f7">打开蓝牙</text>
      <rect x="720" y="380" width="250" height="52" rx="13" fill="#fff" fill-opacity=".08"/>
      <text x="845" y="412" fill="#dce7f7">查看附近网络</text>
    </g>

    <text x="120" y="498" fill="#91a5bf" font-family="Segoe UI, sans-serif" font-size="13">Windows 辅助入口</text>
    <g fill="#fff" fill-opacity=".055" stroke="#fff" stroke-opacity=".09">
      <rect x="116" y="514" width="280" height="38" rx="12"/>
      <rect x="420" y="514" width="280" height="38" rx="12"/>
      <rect x="724" y="514" width="280" height="38" rx="12"/>
    </g>
    <g fill="#aebfd6" font-family="Segoe UI, sans-serif" font-size="13" text-anchor="middle">
      <text x="256" y="539">快捷设置</text>
      <text x="560" y="539">通知中心</text>
      <text x="864" y="539">输入法</text>
    </g>
  </g>
</svg>
