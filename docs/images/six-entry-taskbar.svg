<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <rect width="1200" height="420" rx="28" fill="#0f172a"/>
  <text x="60" y="70" fill="#f8fafc" font-size="32" font-family="Segoe UI, Microsoft YaHei" font-weight="700">六入口紧凑任务栏</text>
  <text x="60" y="106" fill="#94a3b8" font-size="17" font-family="Segoe UI, Microsoft YaHei">固定入口负责导航，中部应用区独立滚动，溢出时显示轻量上下导航。</text>
  <g font-family="Segoe UI, Microsoft YaHei" text-anchor="middle">
    <g transform="translate(55 145)"><rect width="150" height="150" rx="24" fill="#1e293b"/><text x="75" y="64" fill="#93c5fd" font-size="34">⊞</text><text x="75" y="108" fill="#f8fafc" font-size="18">开始</text><text x="75" y="132" fill="#64748b" font-size="12">右键 Win+X</text></g>
    <g transform="translate(225 145)"><rect width="150" height="150" rx="24" fill="#1e293b"/><text x="75" y="64" fill="#93c5fd" font-size="34">⌕</text><text x="75" y="108" fill="#f8fafc" font-size="18">搜索</text><text x="75" y="132" fill="#64748b" font-size="12">应用目录</text></g>
    <g transform="translate(395 130)"><rect width="190" height="180" rx="26" fill="#312e81" stroke="#818cf8"/><text x="95" y="35" fill="#a5b4fc" font-size="20">⌃</text><text x="95" y="70" fill="#c7d2fe" font-size="30">● ● ●</text><text x="95" y="106" fill="#f8fafc" font-size="18">统一应用列表</text><text x="95" y="134" fill="#a5b4fc" font-size="13">固定 + 运行 + 多窗口</text><text x="95" y="156" fill="#a5b4fc" font-size="13">稳定顺序 · 可拖动</text><text x="95" y="176" fill="#a5b4fc" font-size="20">⌄</text></g>
    <g transform="translate(605 145)"><rect width="150" height="150" rx="24" fill="#1e293b"/><text x="75" y="64" fill="#93c5fd" font-size="34">▣</text><text x="75" y="108" fill="#f8fafc" font-size="18">任务视图</text><text x="75" y="132" fill="#64748b" font-size="12">Win + Tab</text></g>
    <g transform="translate(775 145)"><rect width="150" height="150" rx="24" fill="#1e293b"/><text x="75" y="64" fill="#5eead4" font-size="34">◎</text><text x="75" y="108" fill="#f8fafc" font-size="18">Focus 中心</text><text x="75" y="132" fill="#64748b" font-size="12">五个业务模块</text></g>
    <g transform="translate(945 145)"><rect width="150" height="150" rx="24" fill="#1e293b"/><text x="75" y="58" fill="#fbbf24" font-size="28">◉ 00:53</text><text x="75" y="102" fill="#f8fafc" font-size="18">状态与时间</text><text x="75" y="132" fill="#64748b" font-size="12">系统控制 · 日历</text></g>
  </g>
  <text x="600" y="356" text-anchor="middle" fill="#94a3b8" font-size="14" font-family="Segoe UI, Microsoft YaHei">Ctrl + Alt + Space 主动聚焦 · Tab / 方向键循环导航 · Enter 执行 · Shift + F10 打开菜单</text>
  <text x="600" y="384" text-anchor="middle" fill="#64748b" font-size="13" font-family="Segoe UI, Microsoft YaHei">界面结构示意</text>
</svg>
