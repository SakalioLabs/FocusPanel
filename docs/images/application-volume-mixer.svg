<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1927"/>
      <stop offset="1" stop-color="#203448"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5dc8ff"/>
      <stop offset="1" stop-color="#8f82ff"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#02070d" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="32" fill="url(#bg)"/>
  <circle cx="1090" cy="66" r="190" fill="#5dc8ff" opacity=".08"/>
  <circle cx="90" cy="600" r="210" fill="#8f82ff" opacity=".07"/>
  <text x="58" y="70" fill="#f4f8fc" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="650">应用音量不用再进 Windows 声音混合器</text>
  <text x="58" y="105" fill="#9cb2c6" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="15">默认输出设备会话 → 原地独立音量 / 静音 → 合并最终值 → 失败回滚并刷新</text>

  <g transform="translate(58 140)" filter="url(#shadow)">
    <rect width="650" height="414" rx="24" fill="#182a3b" stroke="#446179"/>
    <text x="28" y="42" fill="#eef5fb" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="19" font-weight="600">状态中心 · 应用音量</text>
    <text x="622" y="42" text-anchor="end" fill="#91a9bd" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">3 个应用音频会话</text>

    <g transform="translate(26 68)" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif">
      <g>
        <text x="10" y="24" fill="#ecf5fb" font-size="16" font-weight="600">音乐</text>
        <text x="598" y="24" text-anchor="end" fill="#66cdfd" font-size="13">正在播放</text>
        <g transform="translate(6 48)" fill="none" stroke="#91a9bd" stroke-width="3" stroke-linecap="round">
          <path d="M0 8h8l10-8v28l-10-8H0z" fill="#91a9bd" stroke="none"/>
          <path d="M24 7c6 5 6 11 0 16"/>
        </g>
        <rect x="56" y="58" width="466" height="7" rx="4" fill="#3d5569"/>
        <rect x="56" y="58" width="354" height="7" rx="4" fill="url(#accent)"/>
        <circle cx="410" cy="61.5" r="11" fill="#e6f7ff" stroke="#64caff" stroke-width="3"/>
        <text x="598" y="67" text-anchor="end" fill="#f2f7fb" font-size="16">76%</text>
        <path d="M0 88h598" stroke="#385064"/>
      </g>

      <g transform="translate(0 108)">
        <text x="10" y="24" fill="#ecf5fb" font-size="16" font-weight="600">浏览器</text>
        <g transform="translate(6 48)" fill="none" stroke="#91a9bd" stroke-width="3" stroke-linecap="round">
          <path d="M0 8h8l10-8v28l-10-8H0z" fill="#91a9bd" stroke="none"/>
          <path d="M24 7c6 5 6 11 0 16"/>
        </g>
        <rect x="56" y="58" width="466" height="7" rx="4" fill="#3d5569"/>
        <rect x="56" y="58" width="205" height="7" rx="4" fill="url(#accent)"/>
        <circle cx="261" cy="61.5" r="11" fill="#e6f7ff" stroke="#64caff" stroke-width="3"/>
        <text x="598" y="67" text-anchor="end" fill="#f2f7fb" font-size="16">44%</text>
        <path d="M0 88h598" stroke="#385064"/>
      </g>

      <g transform="translate(0 216)">
        <text x="10" y="24" fill="#ecf5fb" font-size="16" font-weight="600">系统声音</text>
        <g transform="translate(6 48)">
          <path d="M0 8h8l10-8v28l-10-8H0z" fill="#e18a80"/>
          <path d="M24 5l15 18M39 5L24 23" fill="none" stroke="#e18a80" stroke-width="3" stroke-linecap="round"/>
        </g>
        <rect x="56" y="58" width="466" height="7" rx="4" fill="#3d5569"/>
        <rect x="56" y="58" width="112" height="7" rx="4" fill="#778b9d"/>
        <circle cx="168" cy="61.5" r="11" fill="#dce6ed" stroke="#8699aa" stroke-width="3"/>
        <text x="598" y="67" text-anchor="end" fill="#f2f7fb" font-size="16">24%</text>
      </g>
    </g>
  </g>

  <g transform="translate(754 140)">
    <rect width="388" height="414" rx="24" fill="#172839" stroke="#446179"/>
    <text x="28" y="44" fill="#eef5fb" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="19" font-weight="600">比原任务栏少走几步</text>
    <g font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif">
      <rect x="28" y="76" width="332" height="70" rx="16" fill="#223b50"/>
      <text x="50" y="105" fill="#70d0ff" font-size="15" font-weight="600">01　打开状态中心</text>
      <text x="50" y="128" fill="#a8bbcb" font-size="13">不再跳转声音设置页</text>
      <path d="M194 146v26" stroke="#59768e" stroke-width="3"/>
      <rect x="28" y="172" width="332" height="70" rx="16" fill="#223b50"/>
      <text x="50" y="201" fill="#70d0ff" font-size="15" font-weight="600">02　找到正在播放应用</text>
      <text x="50" y="224" fill="#a8bbcb" font-size="13">活动会话自动排在前面</text>
      <path d="M194 242v26" stroke="#59768e" stroke-width="3"/>
      <rect x="28" y="268" width="332" height="70" rx="16" fill="#223b50"/>
      <text x="50" y="297" fill="#70d0ff" font-size="15" font-weight="600">03　直接拖动或静音</text>
      <text x="50" y="320" fill="#a8bbcb" font-size="13">连续输入只提交最后值</text>
      <rect x="28" y="360" width="332" height="34" rx="11" fill="#1f493f" stroke="#42b88a"/>
      <text x="194" y="382" text-anchor="middle" fill="#9ce6c9" font-size="13">公开 Core Audio · 无私有注入</text>
    </g>
  </g>
</svg>
