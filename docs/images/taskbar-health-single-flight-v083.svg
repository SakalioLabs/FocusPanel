<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#112a42"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8ecff" stop-opacity=".19"/><stop offset="1" stop-color="#65b8ef" stop-opacity=".07"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="180" fill="#329fff" opacity=".10"/><circle cx="1050" cy="530" r="240" fill="#4fd7c3" opacity=".07"/>
  <text x="58" y="70" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">状态中心自动刷新 · 同一时刻只检查一次</text>
  <text x="60" y="106" fill="#9fb4cb" font-family="Segoe UI, Microsoft YaHei" font-size="16">连续点击会合并；任务栏状态变化后，旧结果不会再写回界面</text>

  <g transform="translate(58 145)" filter="url(#shadow)">
    <rect width="530" height="410" rx="24" fill="url(#glass)" stroke="#b9ddff" stroke-opacity=".22"/>
    <text x="30" y="48" fill="#edf6ff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="600">状态中心</text>
    <text x="30" y="78" fill="#8fa7bf" font-family="Segoe UI, Microsoft YaHei" font-size="13">打开即刷新最近接管结果</text>
    <rect x="30" y="104" width="470" height="86" rx="16" fill="#142a40"/>
    <circle cx="64" cy="147" r="16" fill="#279cde"/><path d="M58 147l4 4 8-10" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="94" y="137" fill="#f0f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="15" font-weight="600">接管检查正常</text>
    <text x="94" y="162" fill="#8fa7bf" font-family="Segoe UI, Microsoft YaHei" font-size="12">边缘呼出、工作区、抑制层均正常</text>
    <rect x="30" y="208" width="470" height="52" rx="14" fill="#19334b" stroke="#4eb6f3" stroke-opacity=".55"/>
    <text x="265" y="240" text-anchor="middle" fill="#b8ddf7" font-family="Segoe UI, Microsoft YaHei" font-size="15">◌  正在检查…</text>
    <text x="30" y="300" fill="#8fa7bf" font-family="Segoe UI, Microsoft YaHei" font-size="13">设置页与状态中心同步</text>
    <rect x="30" y="316" width="225" height="54" rx="14" fill="#102238"/><text x="142" y="348" text-anchor="middle" fill="#93a9bf" font-family="Segoe UI, Microsoft YaHei" font-size="13">按钮暂时禁用</text>
    <rect x="275" y="316" width="225" height="54" rx="14" fill="#102238"/><text x="387" y="348" text-anchor="middle" fill="#93a9bf" font-family="Segoe UI, Microsoft YaHei" font-size="13">辅助功能同一文案</text>
  </g>

  <g transform="translate(630 145)" filter="url(#shadow)">
    <rect width="492" height="410" rx="24" fill="url(#glass)" stroke="#b9ddff" stroke-opacity=".22"/>
    <text x="28" y="48" fill="#edf6ff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="600">单实例与过期结果门禁</text>
    <g transform="translate(28 82)">
      <rect width="436" height="56" rx="14" fill="#173049"/><text x="22" y="34" fill="#e9f4ff" font-family="Segoe UI, Microsoft YaHei" font-size="14">① 打开状态中心 / 点击检查</text><circle cx="407" cy="28" r="10" fill="#2b9de2"/>
      <path d="M218 60v22" stroke="#3baaf0" stroke-width="3" stroke-linecap="round"/>
      <rect y="84" width="436" height="56" rx="14" fill="#173049"/><text x="22" y="118" fill="#e9f4ff" font-family="Segoe UI, Microsoft YaHei" font-size="14">② 繁忙请求合并为最多下一次</text><text x="398" y="118" fill="#58bcf6" font-family="Segoe UI, Microsoft YaHei" font-size="18">1×</text>
      <path d="M218 144v22" stroke="#3baaf0" stroke-width="3" stroke-linecap="round"/>
      <rect y="168" width="436" height="78" rx="14" fill="#102338"/>
      <text x="22" y="198" fill="#d9ebfa" font-family="Segoe UI, Microsoft YaHei" font-size="14">③ 结果写回前核对</text>
      <text x="22" y="224" fill="#88a1b8" font-family="Segoe UI, Microsoft YaHei" font-size="12">版本 · 开始状态 · 当前状态 · 返回状态</text>
      <g transform="translate(0 266)"><rect width="206" height="52" rx="14" fill="#123b35" stroke="#45d19d" stroke-opacity=".35"/><text x="103" y="31" text-anchor="middle" fill="#7ee0ba" font-family="Segoe UI, Microsoft YaHei" font-size="14">一致 → 显示结果</text><rect x="230" width="206" height="52" rx="14" fill="#40232b" stroke="#f06c7d" stroke-opacity=".4"/><text x="333" y="31" text-anchor="middle" fill="#ff9aa8" font-family="Segoe UI, Microsoft YaHei" font-size="14">变化 → 丢弃旧结果</text></g>
    </g>
  </g>
</svg>
