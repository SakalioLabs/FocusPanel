<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 设置与更新操作路径</title>
  <desc id="desc">设置入口打开设置后保持正确返回焦点，更新通知则直接定位到软件更新卡片。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9f3ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#9ebcf1" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".32"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#75b7ff"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1050" cy="70" r="180" fill="#3b82f6" opacity=".12"/>
  <circle cx="120" cy="470" r="210" fill="#8b5cf6" opacity=".10"/>

  <text x="60" y="68" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">设置不再让用户迷路</text>
  <text x="60" y="102" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="17">入口、目标与返回位置形成一条可预期的路径</text>

  <g filter="url(#shadow)">
    <rect x="60" y="142" width="250" height="300" rx="24" fill="url(#glass)" stroke="#6f809a" stroke-opacity=".55"/>
    <text x="88" y="184" fill="#b7c4d8" font-family="Segoe UI, Microsoft YaHei" font-size="15">展开工作区</text>
    <g font-family="Segoe UI, Microsoft YaHei" font-size="17" fill="#ccd7e7">
      <rect x="84" y="208" width="202" height="48" rx="12" fill="#ffffff" opacity=".05"/><text x="108" y="239">概览</text>
      <rect x="84" y="268" width="202" height="48" rx="12" fill="#ffffff" opacity=".05"/><text x="108" y="299">任务</text>
      <rect x="84" y="328" width="202" height="64" rx="14" fill="#278bf0" opacity=".28" stroke="#75b7ff"/><text x="108" y="367" fill="#f6fbff" font-weight="600">设置</text>
      <circle cx="264" cy="360" r="5" fill="#75b7ff"/>
    </g>
  </g>

  <path d="M324 358C370 358 374 304 426 304" fill="none" stroke="#75b7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="335" y="340" fill="#9cc9ff" font-family="Segoe UI, Microsoft YaHei" font-size="14">打开 / 关闭后回到这里</text>

  <g filter="url(#shadow)">
    <rect x="438" y="142" width="396" height="300" rx="24" fill="url(#glass)" stroke="#6f809a" stroke-opacity=".55"/>
    <text x="468" y="184" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="650">系统与恢复</text>
    <rect x="468" y="208" width="336" height="70" rx="16" fill="#fff" opacity=".06"/>
    <text x="490" y="238" fill="#dce6f5" font-family="Segoe UI, Microsoft YaHei" font-size="16">侧边任务栏完整替代</text>
    <text x="490" y="261" fill="#91a2ba" font-family="Segoe UI, Microsoft YaHei" font-size="13">替代状态、恢复与安全控制</text>
    <rect x="468" y="294" width="336" height="118" rx="16" fill="#278bf0" opacity=".18" stroke="#75b7ff"/>
    <text x="490" y="327" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="17" font-weight="650">软件更新</text>
    <text x="490" y="351" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="13">GitHub Releases · 静态清单</text>
    <rect x="490" y="370" width="210" height="30" rx="10" fill="#278bf0"/>
    <text x="515" y="391" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="13" font-weight="600">一键检查并安装更新</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="884" y="196" width="256" height="168" rx="20" fill="#202c3f" stroke="#63748f"/>
    <circle cx="920" cy="232" r="14" fill="#278bf0"/>
    <path d="M913 232h14m-7-7v14" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="946" y="228" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="16" font-weight="650">发现新版本</text>
    <text x="946" y="251" fill="#9eacc0" font-family="Segoe UI, Microsoft YaHei" font-size="13">可用更新已准备好</text>
    <rect x="908" y="286" width="208" height="48" rx="12" fill="#278bf0"/>
    <text x="974" y="317" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="15" font-weight="650">打开更新</text>
  </g>
  <path d="M882 310C850 310 854 348 816 348" fill="none" stroke="#75b7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="850" y="390" text-anchor="middle" fill="#9cc9ff" font-family="Segoe UI, Microsoft YaHei" font-size="14">直接滚动并聚焦操作</text>
</svg>
