<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei UI,Segoe UI,sans-serif">
    <text x="56" y="62" fill="#f8fafc" font-size="29" font-weight="700">自动收起速度 · 由用户决定</text>
    <text x="56" y="94" fill="#94a3b8" font-size="15">普通离开使用所选档位；交互保护和安全宽限仍拥有更高优先级</text>

    <rect x="56" y="128" width="676" height="246" rx="24" fill="#111827" stroke="#475569"/>
    <text x="84" y="166" fill="#e2e8f0" font-size="17" font-weight="600">设置 · 外观与交互</text>
    <g transform="translate(84 190)" font-size="14" text-anchor="middle">
      <rect width="138" height="74" rx="17" fill="#1e293b" stroke="#475569"/>
      <text x="69" y="31" fill="#f8fafc" font-weight="600">快速</text><text x="69" y="54" fill="#94a3b8">0.3 秒</text>
      <g transform="translate(154 0)"><rect width="138" height="74" rx="17" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="69" y="31" fill="#eff6ff" font-weight="700">标准</text><text x="69" y="54" fill="#bfdbfe">0.5 秒 · 默认</text></g>
      <g transform="translate(308 0)"><rect width="138" height="74" rx="17" fill="#1e293b" stroke="#475569"/><text x="69" y="31" fill="#f8fafc" font-weight="600">从容</text><text x="69" y="54" fill="#94a3b8">0.8 秒</text></g>
      <g transform="translate(462 0)"><rect width="138" height="74" rx="17" fill="#1e293b" stroke="#475569"/><text x="69" y="31" fill="#f8fafc" font-weight="600">较慢</text><text x="69" y="54" fill="#94a3b8">1.2 秒</text></g>
    </g>
    <path d="M84 300h600" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
    <path d="M84 300h246" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
    <circle cx="330" cy="300" r="10" fill="#93c5fd"/>
    <text x="84" y="340" fill="#94a3b8" font-size="13">选择立即用于下一次普通鼠标离开，并通过 AppConfig 持久化</text>

    <rect x="764" y="128" width="380" height="246" rx="24" fill="#111827" stroke="#475569"/>
    <text x="792" y="166" fill="#e2e8f0" font-size="17" font-weight="600">不会被速度档位破坏的保护</text>
    <g font-size="14">
      <rect x="792" y="190" width="156" height="48" rx="14" fill="#134e4a"/><text x="870" y="220" text-anchor="middle" fill="#ccfbf1">输入与下拉框</text>
      <rect x="960" y="190" width="156" height="48" rx="14" fill="#134e4a"/><text x="1038" y="220" text-anchor="middle" fill="#ccfbf1">拖拽与菜单</text>
      <rect x="792" y="250" width="156" height="48" rx="14" fill="#312e81"/><text x="870" y="280" text-anchor="middle" fill="#e0e7ff">模态确认</text>
      <rect x="960" y="250" width="156" height="48" rx="14" fill="#312e81"/><text x="1038" y="280" text-anchor="middle" fill="#e0e7ff">固定展开</text>
    </g>
    <text x="792" y="334" fill="#94a3b8" font-size="13">主动唤出与失焦仍使用独立安全时序</text>
    <text x="600" y="422" text-anchor="middle" fill="#64748b" font-size="13">异常或旧值 → 标准 0.5 秒 · 不修改业务数据库结构</text>
  </g>
</svg>
