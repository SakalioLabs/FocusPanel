<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">状态中心逐窗口打开 DWM 实时缩略图卡</title>
  <desc id="desc">左侧是展开的后台应用与窗口列表，窗口行提供实时预览按钮；右侧是可直接控制窗口的 DWM 实时预览卡。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0e1726"/><stop offset="1" stop-color="#293a52"/></linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#263b54"/><stop offset="1" stop-color="#17263a"/></linearGradient>
  </defs>
  <rect width="1200" height="600" rx="36" fill="url(#bg)"/>
  <text x="48" y="62" fill="#f6f9ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">窗口缩略图，不再回到底部任务栏找</text>
  <text x="48" y="92" fill="#9eb5ce" font-family="Segoe UI, Microsoft YaHei" font-size="15">0.11.62 · Panel 状态中心 → 逐窗口预览 → 直接控制</text>

  <rect x="42" y="124" width="466" height="430" rx="26" fill="url(#surface)" stroke="#4b6684"/>
  <text x="70" y="166" fill="#eaf3ff" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="600">后台应用与窗口</text>
  <text x="452" y="166" text-anchor="end" fill="#9fb7d1" font-family="Segoe UI, Microsoft YaHei" font-size="14">9 项</text>
  <rect x="66" y="190" width="418" height="66" rx="15" fill="#35506f"/>
  <circle cx="101" cy="223" r="19" fill="#60a5fa"/>
  <text x="134" y="218" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="16" font-weight="600">浏览器</text>
  <text x="134" y="239" fill="#b2c8df" font-family="Segoe UI, Microsoft YaHei" font-size="13">3 个窗口 · 已展开</text>
  <g font-family="Segoe UI, Microsoft YaHei" font-size="14">
    <rect x="82" y="270" width="390" height="58" rx="13" fill="#243b55"/><text x="102" y="304" fill="#e6eff9">项目文档 — 浏览器</text><rect x="386" y="281" width="36" height="36" rx="10" fill="#2563a6"/><text x="404" y="305" text-anchor="middle" fill="#fff" font-size="18">▣</text><rect x="428" y="281" width="36" height="36" rx="10" fill="#344b65"/><text x="446" y="305" text-anchor="middle" fill="#dce8f5">×</text>
    <rect x="82" y="338" width="390" height="58" rx="13" fill="#243b55"/><text x="102" y="372" fill="#e6eff9">更新说明 — 浏览器</text><rect x="386" y="349" width="36" height="36" rx="10" fill="#2563a6"/><text x="404" y="373" text-anchor="middle" fill="#fff" font-size="18">▣</text><rect x="428" y="349" width="36" height="36" rx="10" fill="#344b65"/><text x="446" y="373" text-anchor="middle" fill="#dce8f5">×</text>
    <rect x="82" y="406" width="390" height="58" rx="13" fill="#243b55"/><text x="102" y="440" fill="#e6eff9">下载任务 — 浏览器</text><rect x="386" y="417" width="36" height="36" rx="10" fill="#2563a6"/><text x="404" y="441" text-anchor="middle" fill="#fff" font-size="18">▣</text><rect x="428" y="417" width="36" height="36" rx="10" fill="#344b65"/><text x="446" y="441" text-anchor="middle" fill="#dce8f5">×</text>
  </g>
  <text x="276" y="513" text-anchor="middle" fill="#79dfc1" font-family="Segoe UI, Microsoft YaHei" font-size="14">画面按钮是明确入口，不靠猜悬停位置</text>

  <path d="M526 334h94" stroke="#75d9bc" stroke-width="3"/><path d="m608 326 13 8-13 8" fill="none" stroke="#75d9bc" stroke-width="3"/>

  <rect x="642" y="124" width="516" height="430" rx="26" fill="url(#surface)" stroke="#4b6684"/>
  <text x="672" y="163" fill="#eaf3ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="600">浏览器</text>
  <text x="1128" y="163" text-anchor="end" fill="#79dfc1" font-family="Segoe UI, Microsoft YaHei" font-size="14">DWM 实时预览</text>
  <rect x="670" y="190" width="460" height="252" rx="16" fill="#0c1522" stroke="#47627d"/>
  <rect x="686" y="206" width="428" height="220" rx="11" fill="#dbe8f5"/>
  <rect x="686" y="206" width="428" height="36" rx="11" fill="#b9cee2"/>
  <circle cx="708" cy="224" r="6" fill="#fb7185"/><circle cx="728" cy="224" r="6" fill="#fbbf24"/><circle cx="748" cy="224" r="6" fill="#34d399"/>
  <rect x="710" y="270" width="178" height="18" rx="6" fill="#57799c"/><rect x="710" y="304" width="370" height="12" rx="6" fill="#9db5cb"/><rect x="710" y="330" width="312" height="12" rx="6" fill="#b2c5d7"/><rect x="710" y="356" width="345" height="12" rx="6" fill="#b2c5d7"/>
  <text x="676" y="477" fill="#e8f1fb" font-family="Segoe UI, Microsoft YaHei" font-size="15">项目文档 — 浏览器</text>
  <g font-family="Segoe UI, Microsoft YaHei" font-size="13" text-anchor="middle">
    <rect x="888" y="454" width="50" height="38" rx="11" fill="#304a66"/><text x="913" y="478" fill="#dce9f5">—</text>
    <rect x="946" y="454" width="50" height="38" rx="11" fill="#304a66"/><text x="971" y="478" fill="#dce9f5">□</text>
    <rect x="1004" y="454" width="50" height="38" rx="11" fill="#304a66"/><text x="1029" y="478" fill="#dce9f5">↗</text>
    <rect x="1062" y="454" width="50" height="38" rx="11" fill="#683847"/><text x="1087" y="478" fill="#ffd9df">×</text>
  </g>
  <text x="900" y="526" text-anchor="middle" fill="#9fb8d2" font-family="Segoe UI, Microsoft YaHei" font-size="13">无激活浮层 · 离开自动收起 · 拒绝时保留文字切换</text>
</svg>
