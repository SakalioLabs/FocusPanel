<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset="1" stop-color="#102640"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d7ebff" stop-opacity=".20"/><stop offset="1" stop-color="#7bb9ee" stop-opacity=".09"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".38"/></filter>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="180" cy="90" r="150" fill="#2c9cff" opacity=".11"/><circle cx="1020" cy="520" r="220" fill="#56d6c9" opacity=".08"/>
  <text x="58" y="70" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">运行应用重新可见 · Panel 直接固定到右上 / 右中 / 右下</text>
  <text x="60" y="106" fill="#9fb4cb" font-family="Segoe UI, Microsoft YaHei" font-size="16">应用快照主动刷新，位置选择不再依赖难发现的隐藏手势</text>

  <g transform="translate(58 145)" filter="url(#shadow)">
    <rect width="720" height="410" rx="24" fill="url(#glass)" stroke="#b9ddff" stroke-opacity=".22"/>
    <text x="34" y="48" fill="#dfeeff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">统一运行应用栏</text>
    <text x="34" y="76" fill="#8fa7bf" font-family="Segoe UI, Microsoft YaHei" font-size="14">固定项 + 所有已识别运行项，身份与顺序保持稳定</text>
    <g transform="translate(34 110)">
      <g><rect width="652" height="62" rx="15" fill="#172d44"/><rect x="12" y="15" width="32" height="32" rx="8" fill="#2f9ded"/><text x="60" y="27" fill="#eff7ff" font-family="Segoe UI, Microsoft YaHei" font-size="15">文件资源管理器</text><text x="60" y="48" fill="#8fa7bf" font-family="Segoe UI, Microsoft YaHei" font-size="12">正在运行 · 2 个窗口</text><rect x="636" y="19" width="4" height="24" rx="2" fill="#39aaff"/></g>
      <g transform="translate(0 74)"><rect width="652" height="62" rx="15" fill="#14273b"/><rect x="12" y="15" width="32" height="32" rx="8" fill="#7867f2"/><text x="60" y="27" fill="#eff7ff" font-family="Segoe UI, Microsoft YaHei" font-size="15">浏览器</text><text x="60" y="48" fill="#8fa7bf" font-family="Segoe UI, Microsoft YaHei" font-size="12">后台运行 · 4 个窗口</text><circle cx="638" cy="31" r="5" fill="#4eb4ff"/></g>
      <g transform="translate(0 148)"><rect width="652" height="62" rx="15" fill="#14273b"/><rect x="12" y="15" width="32" height="32" rx="8" fill="#2fbf71"/><text x="60" y="27" fill="#eff7ff" font-family="Segoe UI, Microsoft YaHei" font-size="15">音乐</text><text x="60" y="48" fill="#8fa7bf" font-family="Segoe UI, Microsoft YaHei" font-size="12">后台运行 · 无可见窗口</text><circle cx="638" cy="31" r="5" fill="#2fbf71"/></g>
      <g transform="translate(0 236)"><rect width="652" height="50" rx="14" fill="#0f2134" stroke="#2f9ded" stroke-opacity=".55"/><text x="326" y="30" text-anchor="middle" fill="#bfe5ff" font-family="Segoe UI, Microsoft YaHei" font-size="14">↻  空状态可直接刷新，不再留下无响应空白</text></g>
    </g>
  </g>

  <g transform="translate(830 145)" filter="url(#shadow)">
    <rect width="292" height="410" rx="24" fill="url(#glass)" stroke="#b9ddff" stroke-opacity=".22"/>
    <text x="28" y="48" fill="#dfeeff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">右缘位置</text>
    <g transform="translate(28 76)">
      <rect width="236" height="45" rx="13" fill="#18314a"/><text x="20" y="28" fill="#d8e8f7" font-family="Segoe UI, Microsoft YaHei" font-size="15">位置 · 上</text><text x="210" y="28" fill="#8fa7bf" font-size="14">⌄</text>
      <rect y="58" width="236" height="45" rx="13" fill="#268fd3"/><text x="20" y="86" fill="#fff" font-family="Segoe UI, Microsoft YaHei" font-size="15" font-weight="600">✓  右上</text>
      <rect y="115" width="236" height="45" rx="13" fill="#14273b"/><text x="20" y="143" fill="#d8e8f7" font-family="Segoe UI, Microsoft YaHei" font-size="15">　 右中</text>
      <rect y="172" width="236" height="45" rx="13" fill="#14273b"/><text x="20" y="200" fill="#d8e8f7" font-family="Segoe UI, Microsoft YaHei" font-size="15">　 右下</text>
      <path d="M118 236v63" stroke="#42aaf0" stroke-width="3" stroke-linecap="round"/><path d="M110 245l8-10 8 10M110 290l8 10 8-10" fill="none" stroke="#42aaf0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="118" y="330" text-anchor="middle" fill="#9fb4cb" font-family="Segoe UI, Microsoft YaHei" font-size="13">也可沿右缘拖动吸附</text>
    </g>
  </g>
</svg>
