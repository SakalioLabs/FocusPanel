<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="1" stop-color="#e4eaf7"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="1" stop-color="#edf5ff" stop-opacity=".84"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183b5e" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#287fc5"/>
    </marker>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="35" r="190" fill="#3f92e0" opacity=".11"/>
  <circle cx="70" cy="610" r="180" fill="#7964ce" opacity=".09"/>
  <text x="64" y="70" font-family="Microsoft YaHei, Segoe UI" font-size="25" font-weight="700" fill="#19283e">当前应用不会被新项目挤出视野</text>
  <text x="64" y="104" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#60738b">只在应用栏结构真正变化时重新定位，普通状态刷新不打断手动滚动</text>

  <rect x="82" y="146" width="282" height="376" rx="23" fill="#ffffff" stroke="#d4dfeb" filter="url(#shadow)"/>
  <text x="112" y="186" font-family="Microsoft YaHei, Segoe UI" font-size="18" font-weight="700" fill="#19283e">结构变化前</text>
  <g>
    <rect x="112" y="216" width="222" height="54" rx="13" fill="#f2f6fb"/>
    <circle cx="140" cy="243" r="14" fill="#6b7d91"/>
    <text x="166" y="249" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#324b65">固定应用 A</text>
    <rect x="112" y="282" width="222" height="54" rx="13" fill="#e6f3ff"/>
    <circle cx="140" cy="309" r="14" fill="#1677d2"/>
    <text x="166" y="315" font-family="Microsoft YaHei, Segoe UI" font-size="14" font-weight="700" fill="#1d4165">当前应用</text>
    <rect x="108" y="296" width="4" height="26" rx="2" fill="#1677d2"/>
    <rect x="112" y="348" width="222" height="54" rx="13" fill="#f2f6fb"/>
    <circle cx="140" cy="375" r="14" fill="#efb42a"/>
    <text x="166" y="381" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#324b65">运行应用 B</text>
  </g>
  <text x="112" y="456" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#60738b">用户仍可自由滚动浏览</text>

  <path d="M390 330 C425 330 440 330 476 330" fill="none" stroke="#287fc5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="500" y="126" width="598" height="416" rx="25" fill="#173f69" filter="url(#shadow)"/>
  <text x="534" y="169" font-family="Microsoft YaHei, Segoe UI" font-size="19" font-weight="700" fill="#ffffff">插入、移除或重排后</text>
  <rect x="532" y="199" width="80" height="44" rx="12" fill="#28547d"/>
  <text x="572" y="226" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#e5f2ff">▲ 上方 3</text>
  <rect x="532" y="255" width="532" height="62" rx="14" fill="#e8f5ed"/>
  <circle cx="565" cy="286" r="15" fill="#2daf68"/>
  <text x="594" y="282" font-family="Microsoft YaHei, Segoe UI" font-size="15" font-weight="700" fill="#21364e">需要注意的应用优先露出</text>
  <text x="594" y="303" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#5d7187">提醒项不在任务栏时回退当前应用</text>
  <rect x="532" y="331" width="532" height="62" rx="14" fill="#e7f2ff"/>
  <circle cx="565" cy="362" r="15" fill="#1677d2"/>
  <text x="594" y="358" font-family="Microsoft YaHei, Segoe UI" font-size="15" font-weight="700" fill="#21364e">当前应用保持在可操作区域</text>
  <text x="594" y="379" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#5d7187">避开上下 44px 溢出按钮遮挡</text>
  <rect x="984" y="406" width="80" height="44" rx="12" fill="#28547d"/>
  <text x="1024" y="433" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#e5f2ff">▼ 下方 4</text>
  <text x="532" y="491" font-family="Microsoft YaHei, Segoe UI" font-size="13" fill="#bdd9f2">一批通知只执行一次滚动与数量刷新</text>
  <text x="590" y="579" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#47617f">结构变化自动找回目标，内容变化保持安静</text>
</svg>
