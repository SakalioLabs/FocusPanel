<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="390" viewBox="0 0 1120 390" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 桌面收纳异步生命周期</title>
  <desc id="desc">文件监控、手动刷新和自动整理共享刷新闸门，收纳与恢复共享属性闸门，退出状态阻止迟到回调。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f8fc"/>
      <stop offset="1" stop-color="#e8eff8"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#278bd1"/>
      <stop offset="1" stop-color="#11639f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f314a" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1120" height="390" rx="28" fill="url(#background)"/>
  <text x="56" y="56" font-family="Segoe UI, Microsoft YaHei" font-size="25" font-weight="700" fill="#172033">桌面收纳：两个串行边界，一道退出检查</text>
  <text x="56" y="86" font-family="Segoe UI, Microsoft YaHei" font-size="15" fill="#627188">文件集合刷新与实体属性修改分开排队，既不重入，也不阻塞 UI</text>

  <g transform="translate(56 122)">
    <rect width="245" height="178" rx="18" fill="#ffffff" stroke="#d7dfeb" filter="url(#shadow)"/>
    <text x="24" y="34" font-family="Segoe UI, Microsoft YaHei" font-size="16" font-weight="700" fill="#172033">刷新来源</text>
    <rect x="24" y="52" width="197" height="30" rx="9" fill="#edf4fb"/>
    <text x="38" y="72" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#36516d">FileSystemWatcher 批处理</text>
    <rect x="24" y="92" width="197" height="30" rx="9" fill="#edf4fb"/>
    <text x="38" y="112" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#36516d">用户手动刷新</text>
    <rect x="24" y="132" width="197" height="30" rx="9" fill="#edf4fb"/>
    <text x="38" y="152" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#36516d">自动整理完成</text>
  </g>

  <path d="M321 211h68" stroke="#477496" stroke-width="4" stroke-linecap="round"/>
  <path d="m377 200 15 11-15 11" fill="none" stroke="#477496" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(410 122)" filter="url(#shadow)">
    <rect width="205" height="178" rx="18" fill="url(#blue)"/>
    <path d="M54 52h97v74H54z" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M76 42v20M129 42v20M76 116v20M129 116v20" stroke="#9fd9ff" stroke-width="4" stroke-linecap="round"/>
    <text x="102" y="158" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="14" fill="#ffffff">刷新闸门</text>
  </g>

  <path d="M635 211h68" stroke="#477496" stroke-width="4" stroke-linecap="round"/>
  <path d="m691 200 15 11-15 11" fill="none" stroke="#477496" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(724 122)">
    <rect width="340" height="178" rx="18" fill="#ffffff" stroke="#d7dfeb" filter="url(#shadow)"/>
    <text x="24" y="34" font-family="Segoe UI, Microsoft YaHei" font-size="16" font-weight="700" fill="#172033">UI 集合同步</text>
    <circle cx="48" cy="72" r="14" fill="#d8eefc"/>
    <path d="m41 72 5 5 10-11" fill="none" stroke="#1672af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="77" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#36516d">只在 Dispatcher 上更新</text>
    <circle cx="48" cy="108" r="14" fill="#d8eefc"/>
    <path d="m41 108 5 5 10-11" fill="none" stroke="#1672af" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="113" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#36516d">AllFiles / Files 单写者</text>
    <circle cx="48" cy="144" r="14" fill="#fee7e9"/>
    <path d="M42 138l12 12M54 138l-12 12" stroke="#c74455" stroke-width="3" stroke-linecap="round"/>
    <text x="76" y="149" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#7d3a45">退出后丢弃迟到回调</text>
  </g>

  <g transform="translate(196 326)">
    <rect width="728" height="40" rx="20" fill="#dceffc"/>
    <text x="364" y="25" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="13" fill="#195f91">收纳 / 多次拖放 / 自动整理 / 拖出恢复 → 文件属性闸门 → Hidden + System 与恢复记录原子更新</text>
  </g>
</svg>
