<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#091320"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55c7ff"/>
      <stop offset="1" stop-color="#917cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1120" height="620" rx="30" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei">
    <text x="56" y="66" fill="#f4f8ff" font-size="28" font-weight="600">内联计算：不打开应用，输入即得结果</text>
    <text x="56" y="103" fill="#9eb1ca" font-size="17">纯解析器 · 无脚本执行 · 点击或 Enter 复制 · 剪贴板占用自动重试</text>

    <g filter="url(#shadow)">
      <rect x="56" y="138" width="614" height="420" rx="26" fill="#1e2d45" stroke="#415a79"/>
      <text x="86" y="180" fill="#dce9f8" font-size="18" font-weight="600">应用、窗口、命令与计算</text>
      <rect x="84" y="198" width="558" height="60" rx="15" fill="#101b2d" stroke="#64bdfb" stroke-width="2"/>
      <text x="108" y="236" fill="#f4f8ff" font-size="20">(128.5 + 71.5) × 3 ÷ 2</text>

      <rect x="84" y="278" width="558" height="92" rx="18" fill="#294866" stroke="#70c1fb"/>
      <rect x="102" y="298" width="52" height="52" rx="14" fill="url(#accent)"/>
      <g fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
        <rect x="115" y="308" width="26" height="32" rx="3"/>
        <path d="M121 317h14M121 325h3M128 325h3M135 325h1M121 333h3M128 333h3M135 333h1"/>
      </g>
      <text x="174" y="317" fill="#fff" font-size="25" font-weight="600">300</text>
      <text x="174" y="346" fill="#bdd4e9" font-size="14">计算结果 · 点击或按 Enter 复制</text>
      <text x="612" y="332" text-anchor="end" fill="#91d4ff" font-size="25">↵</text>

      <rect x="84" y="390" width="558" height="62" rx="16" fill="#17253a"/>
      <circle cx="122" cy="421" r="18" fill="#273c59"/>
      <text x="122" y="427" text-anchor="middle" fill="#9bd2ff" font-size="17">计</text>
      <text x="158" y="417" fill="#eaf2fb" font-size="16">计算器</text>
      <text x="158" y="439" fill="#879eb8" font-size="13">应用 · 精确结果仍在计算项之后</text>

      <g transform="translate(84 476)">
        <rect width="558" height="50" rx="15" fill="#223752"/>
        <text x="18" y="31" fill="#9fd4ff" font-size="14">支持</text>
        <text x="70" y="31" fill="#e6effa" font-size="14">括号　小数　负数　+ − × ÷ %</text>
        <text x="530" y="31" text-anchor="end" fill="#7f96b0" font-size="13">最多 128 字符</text>
      </g>
    </g>

    <g transform="translate(718 144)">
      <rect width="346" height="408" rx="26" fill="#17243a" stroke="#405775"/>
      <text x="28" y="46" fill="#f1f6fd" font-size="20" font-weight="600">安全边界</text>

      <g font-size="15">
        <circle cx="46" cy="94" r="17" fill="#244d62"/>
        <path d="M38 94l6 6 11-13" fill="none" stroke="#78e0bc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="91" fill="#e9f2fb">递归下降解析</text>
        <text x="78" y="113" fill="#879eb8" font-size="13">不使用 eval / 脚本 / 进程</text>

        <circle cx="46" cy="158" r="17" fill="#244d62"/>
        <path d="M38 158l6 6 11-13" fill="none" stroke="#78e0bc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="78" y="155" fill="#e9f2fb">有限输入</text>
        <text x="78" y="177" fill="#879eb8" font-size="13">16 层括号 · decimal 溢出保护</text>

        <circle cx="46" cy="222" r="17" fill="#493641"/>
        <path d="M39 215l14 14M53 215l-14 14" stroke="#ff9baa" stroke-width="2.4" stroke-linecap="round"/>
        <text x="78" y="219" fill="#e9f2fb">拒绝伪表达式</text>
        <text x="78" y="241" fill="#879eb8" font-size="13">纯数字 · 路径 · 除零 · 指数语法</text>
      </g>

      <path d="M28 270h290" stroke="#354c68"/>
      <text x="28" y="307" fill="#dce8f6" font-size="16" font-weight="600">复制生命周期</text>
      <rect x="28" y="327" width="290" height="52" rx="15" fill="#223853"/>
      <text x="48" y="349" fill="#9ed5ff" font-size="14">剪贴板繁忙</text>
      <text x="48" y="369" fill="#879eb8" font-size="12">35ms × 最多 3 次异步重试</text>
      <circle cx="288" cy="353" r="14" fill="#354b6a"/>
      <path d="M282 353a6 6 0 1 1 3 5" fill="none" stroke="#9fcfff" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
