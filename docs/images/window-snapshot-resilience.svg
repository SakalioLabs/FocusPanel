<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#182840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51c7ff"/>
      <stop offset="1" stop-color="#8979ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1120" height="500" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8fc" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">运行窗口 · 最后有效快照与异常隔离</text>
  <text x="54" y="96" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">系统读取失败不会清空应用栏，单个窗口和订阅者故障互不扩散</text>

  <g filter="url(#shadow)">
    <rect x="54" y="134" width="244" height="236" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="78" y="176" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">WinEvent 合并刷新</text>
    <text x="78" y="220" fill="#b9c8dc" font-family="Segoe UI, Microsoft YaHei" font-size="15">CREATE / DESTROY</text>
    <text x="78" y="256" fill="#b9c8dc" font-family="Segoe UI, Microsoft YaHei" font-size="15">SHOW / HIDE</text>
    <text x="78" y="292" fill="#b9c8dc" font-family="Segoe UI, Microsoft YaHei" font-size="15">NAME / FOREGROUND</text>
    <rect x="78" y="320" width="192" height="30" rx="15" fill="#293b56"/>
    <text x="174" y="341" text-anchor="middle" fill="#7fd0ff" font-family="Segoe UI, Microsoft YaHei" font-size="13">退出后回调丢弃</text>
  </g>

  <path d="M318 252 H390" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M376 240 L394 252 L376 264" fill="none" stroke="#718cff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="412" y="120" width="296" height="264" rx="24" fill="#273a54" stroke="#587293"/>
    <text x="560" y="164" text-anchor="middle" fill="#e8f1fb" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">捕获后提交</text>
    <circle cx="450" cy="210" r="9" fill="#55d69d"/>
    <text x="474" y="216" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">完整成功 → 原子替换</text>
    <circle cx="450" cy="256" r="9" fill="#ffc66d"/>
    <text x="474" y="262" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">单窗口失败 → 跳过 / 降级</text>
    <circle cx="450" cy="302" r="9" fill="#ff7d8d"/>
    <text x="474" y="308" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">全量失败 → 保留旧快照</text>
    <rect x="438" y="338" width="244" height="30" rx="15" fill="#304765"/>
    <text x="560" y="359" text-anchor="middle" fill="#bcd0e7" font-family="Segoe UI, Microsoft YaHei" font-size="13">ResilientSnapshotStore</text>
  </g>

  <path d="M728 252 H800" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M786 240 L804 252 L786 264" fill="none" stroke="#8979ff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="822" y="134" width="244" height="236" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="846" y="176" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">安全发布</text>
    <circle cx="860" cy="222" r="7" fill="#55d69d"/>
    <text x="880" y="228" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">应用栏同步</text>
    <circle cx="860" cy="268" r="7" fill="#7fd0ff"/>
    <text x="880" y="274" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">状态消费者</text>
    <circle cx="860" cy="314" r="7" fill="#ffc66d"/>
    <text x="880" y="320" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">逐订阅者隔离</text>
  </g>

  <rect x="54" y="414" width="1012" height="50" rx="17" fill="#202f47" stroke="#3c506d"/>
  <text x="560" y="445" text-anchor="middle" fill="#c6d4e7" font-family="Segoe UI, Microsoft YaHei" font-size="15">结果：运行应用不闪空 · 受保护窗口仍可切换 · 迟到事件不触碰已释放界面</text>
</svg>
