<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="dock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#475569" stop-opacity=".88"/>
      <stop offset="1" stop-color="#1e293b" stop-opacity=".78"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="460" rx="28" fill="url(#bg)"/>
  <text x="54" y="60" fill="#f8fafc" font-family="Microsoft YaHei UI,Segoe UI,sans-serif" font-size="28" font-weight="700">不打开菜单，也能快速管理同一应用的多个窗口</text>
  <g font-family="Microsoft YaHei UI,Segoe UI,sans-serif">
    <rect x="54" y="105" width="520" height="292" rx="24" fill="#111827" stroke="#475569"/>
    <text x="82" y="145" fill="#e2e8f0" font-size="18" font-weight="600">图标滚轮循环</text>
    <rect x="86" y="180" width="58" height="170" rx="24" fill="url(#dock)" stroke="#64748b"/>
    <rect x="97" y="235" width="36" height="36" rx="11" fill="#0ea5e9"/>
    <circle cx="129" cy="239" r="9" fill="#1e293b" stroke="#38bdf8"/>
    <text x="129" y="243" fill="#e0f2fe" font-size="10" text-anchor="middle">3</text>
    <path d="M175 205v118" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <path d="M166 220l9-12 9 12M166 308l9 12 9-12" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="206" y="211" fill="#bae6fd" font-size="14">滚轮向上：上一个窗口</text>
    <text x="206" y="249" fill="#bae6fd" font-size="14">滚轮向下：下一个窗口</text>
    <text x="206" y="287" fill="#94a3b8" font-size="13">首尾环绕 · 记住刚选中的句柄</text>
    <text x="206" y="320" fill="#94a3b8" font-size="13">90ms 节流 · 单窗口不截获滚轮</text>
    <rect x="624" y="105" width="522" height="292" rx="24" fill="#111827" stroke="#475569"/>
    <text x="654" y="145" fill="#e2e8f0" font-size="18" font-weight="600">悬停列表快速关闭</text>
    <rect x="654" y="174" width="460" height="169" rx="18" fill="#273449" stroke="#64748b"/>
    <rect x="670" y="190" width="428" height="42" rx="10" fill="#1d4ed8" fill-opacity=".38"/>
    <text x="687" y="216" fill="#dbeafe" font-size="14">✓ FocusPanel — MainWindow.xaml.cs</text>
    <text x="1080" y="216" fill="#93c5fd" font-size="12" text-anchor="end">中键 / Del 关闭</text>
    <text x="687" y="264" fill="#e2e8f0" font-size="14">README.md — FocusPanel</text>
    <text x="1080" y="264" fill="#94a3b8" font-size="12" text-anchor="end">中键 / Del 关闭</text>
    <text x="687" y="310" fill="#e2e8f0" font-size="14">TaskbarController.cs — FocusPanel</text>
    <text x="1080" y="310" fill="#94a3b8" font-size="12" text-anchor="end">中键 / Del 关闭</text>
    <text x="654" y="374" fill="#fbbf24" font-size="13">左键切换 · 中键或 Delete 发送正常 WM_CLOSE · Esc 关闭列表</text>
  </g>
  <text x="54" y="430" fill="#94a3b8" font-family="Microsoft YaHei UI,Segoe UI,sans-serif" font-size="13">所有动作复用现有窗口跟踪与失败反馈边界，不强杀进程，不改变固定应用顺序。</text>
</svg>
