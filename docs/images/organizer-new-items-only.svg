<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#17283b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".06"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#70c0ff"/>
    </marker>
  </defs>
  <rect width="980" height="520" rx="28" fill="url(#bg)"/>
  <text x="52" y="58" fill="#f4f8ff" font-family="Segoe UI Variable Display,Segoe UI" font-size="24" font-weight="600">自动收纳只处理开启后新增的桌面项目</text>
  <text x="52" y="88" fill="#9eb0c6" font-family="Segoe UI Variable Text,Segoe UI" font-size="14">不扫描既有项目 · 不移动文件 · 恢复操作不会被规则抓回</text>

  <g transform="translate(52 124)">
    <rect width="244" height="310" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="24" y="38" fill="#f4f8ff" font-family="Segoe UI Variable Display,Segoe UI" font-size="17" font-weight="600">桌面监视批次</text>
    <g transform="translate(22 62)">
      <rect width="200" height="52" rx="12" fill="#287fbd" fill-opacity=".32"/>
      <circle cx="25" cy="26" r="9" fill="#58b8fa"/>
      <text x="45" y="23" fill="#ffffff" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">Created · 新增文件</text>
      <text x="45" y="40" fill="#a9cce8" font-family="Segoe UI Variable Text,Segoe UI" font-size="11">进入新增路径集合</text>
    </g>
    <g transform="translate(22 124)">
      <rect width="200" height="52" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <circle cx="25" cy="26" r="9" fill="#738499"/>
      <text x="45" y="23" fill="#dce5f0" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">Changed / Deleted</text>
      <text x="45" y="40" fill="#8fa0b4" font-family="Segoe UI Variable Text,Segoe UI" font-size="11">只刷新，不自动收纳</text>
    </g>
    <g transform="translate(22 186)">
      <rect width="200" height="74" rx="12" fill="#ffffff" fill-opacity=".06"/>
      <text x="18" y="25" fill="#dce5f0" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">临时文件 → 最终名称</text>
      <path d="M18 41 H180" stroke="#70c0ff" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="18" y="63" fill="#8fa0b4" font-family="Segoe UI Variable Text,Segoe UI" font-size="11">新增身份随重命名迁移</text>
    </g>
  </g>

  <path d="M314 278 H370" stroke="#70c0ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(386 124)">
    <rect width="244" height="310" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="24" y="38" fill="#f4f8ff" font-family="Segoe UI Variable Display,Segoe UI" font-size="17" font-weight="600">安全筛选</text>
    <g font-family="Segoe UI Variable Text,Segoe UI" font-size="13">
      <text x="28" y="82" fill="#7dd7aa">✓ 路径仍位于桌面根目录</text>
      <text x="28" y="118" fill="#7dd7aa">✓ 当前可见且尚未收纳</text>
      <text x="28" y="154" fill="#7dd7aa">✓ 不是需要恢复的记录</text>
      <text x="28" y="190" fill="#7dd7aa">✓ 开关仍处于启用状态</text>
      <text x="28" y="234" fill="#ffcc75">— 公共桌面：等待手动授权</text>
      <text x="28" y="270" fill="#ffcc75">— 内部恢复：一次性跳过</text>
    </g>
  </g>

  <path d="M648 278 H704" stroke="#70c0ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g transform="translate(720 124)">
    <rect width="208" height="310" rx="20" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".13"/>
    <text x="24" y="38" fill="#f4f8ff" font-family="Segoe UI Variable Display,Segoe UI" font-size="17" font-weight="600">按类型收纳</text>
    <g transform="translate(24 66)" font-family="Segoe UI Variable Text,Segoe UI">
      <rect width="160" height="48" rx="12" fill="#2c8ac9" fill-opacity=".28"/>
      <text x="18" y="29" fill="#edf7ff" font-size="13">图片 → 图片</text>
      <rect y="58" width="160" height="48" rx="12" fill="#2c8ac9" fill-opacity=".20"/>
      <text x="18" y="87" fill="#edf7ff" font-size="13">PDF → 文档</text>
      <rect y="116" width="160" height="48" rx="12" fill="#2c8ac9" fill-opacity=".16"/>
      <text x="18" y="145" fill="#edf7ff" font-size="13">文件夹 → 文件夹</text>
      <text x="0" y="198" fill="#9eb0c6" font-size="12">实体路径保持不变</text>
      <text x="0" y="222" fill="#9eb0c6" font-size="12">追加 Hidden + System</text>
    </g>
  </g>

  <text x="490" y="480" text-anchor="middle" fill="#9eb0c6" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">全量扫描只负责恢复视图，不再触发自动规则</text>
</svg>
