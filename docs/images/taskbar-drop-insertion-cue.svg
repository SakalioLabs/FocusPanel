<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#17243a"/>
    </linearGradient>
    <linearGradient id="app" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ea8ff"/>
      <stop offset="1" stop-color="#7468f4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity=".30"/>
    </filter>
  </defs>
  <rect width="1120" height="560" rx="30" fill="url(#bg)"/>
  <text x="56" y="66" fill="#f3f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="600">落点看得见，前后位置不再靠猜</text>
  <text x="56" y="100" fill="#9fb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">目标上半区插到之前，下半区插到之后</text>

  <g transform="translate(78 136)" font-family="Segoe UI, Microsoft YaHei">
    <rect width="426" height="340" rx="24" fill="#1d2c42" stroke="#3a5070" filter="url(#shadow)"/>
    <text x="28" y="42" fill="#cfe3ff" font-size="18" font-weight="600">插到目标之前</text>
    <text x="28" y="67" fill="#8fa3bd" font-size="14">指针进入图标上半区</text>
    <rect x="178" y="92" width="70" height="70" rx="20" fill="#354b69"/>
    <text x="213" y="137" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">A</text>
    <rect x="170" y="176" width="86" height="4" rx="2" fill="#68b5ff"/>
    <rect x="178" y="190" width="70" height="70" rx="20" fill="#354b69"/>
    <text x="213" y="235" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">B</text>
    <rect x="310" y="176" width="70" height="70" rx="20" fill="url(#app)"/>
    <text x="345" y="221" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">D</text>
    <path d="M320 236 C292 236 280 210 255 195" fill="none" stroke="#7fc0ff" stroke-width="4" stroke-dasharray="8 9"/>
    <path d="M257 195 l14 2-7 12z" fill="#7fc0ff"/>
    <text x="28" y="308" fill="#a8bad0" font-size="15">结果：A · D · B</text>
  </g>

  <g transform="translate(616 136)" font-family="Segoe UI, Microsoft YaHei">
    <rect width="426" height="340" rx="24" fill="#1d2c42" stroke="#3a5070" filter="url(#shadow)"/>
    <text x="28" y="42" fill="#cfe3ff" font-size="18" font-weight="600">插到目标之后</text>
    <text x="28" y="67" fill="#8fa3bd" font-size="14">指针进入图标下半区</text>
    <rect x="178" y="92" width="70" height="70" rx="20" fill="#354b69"/>
    <text x="213" y="137" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">A</text>
    <rect x="178" y="176" width="70" height="70" rx="20" fill="#354b69"/>
    <text x="213" y="221" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">B</text>
    <rect x="170" y="258" width="86" height="4" rx="2" fill="#68b5ff"/>
    <rect x="310" y="176" width="70" height="70" rx="20" fill="url(#app)"/>
    <text x="345" y="221" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">D</text>
    <path d="M320 236 C292 236 281 250 255 258" fill="none" stroke="#7fc0ff" stroke-width="4" stroke-dasharray="8 9"/>
    <path d="M256 258 l13-7-1 14z" fill="#7fc0ff"/>
    <text x="28" y="308" fill="#a8bad0" font-size="15">结果：A · B · D</text>
  </g>

  <text x="56" y="524" fill="#7f94af" font-family="Segoe UI, Microsoft YaHei" font-size="15">运行项拖入固定区仍会自动固定；提示只出现在能够真实保持的位置</text>
</svg>
