  <text x="848" y="351" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#34445c">排列窗口</text>
  <line x1="838" y1="374" x2="1110" y2="374" stroke="#e4eaf2"/>
  <text x="848" y="413" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#34445c">关闭窗口</text>

  <rect x="820" y="492" width="308" height="76" rx="16" fill="#163a63"/>
  <text x="846" y="522" font-family="Microsoft YaHei, Segoe UI" font-size="13" fill="#bcd8f5">安全恢复</text>
  <text x="846" y="548" font-family="Microsoft YaHei, Segoe UI" font-size="15" font-weight="700" fill="#fff">失败隔离 · 状态保留 · 可再次尝试</text>
