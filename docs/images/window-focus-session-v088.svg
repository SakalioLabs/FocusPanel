  <text x="151" y="207" font-family="Microsoft YaHei, Segoe UI" font-size="13" fill="#60708a">当前窗口 · 显示器 1 · 主屏</text>
  <rect x="591" y="174" width="128" height="34" rx="9" fill="#1677d2"/>
  <text x="655" y="196" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="13" fill="#fff">正在专注</text>

  <g opacity=".5">
    <rect x="86" y="239" width="656" height="58" rx="13" fill="#f4f7fb"/>
    <circle cx="120" cy="268" r="16" fill="#8190a7"/>
    <text x="151" y="265" font-family="Microsoft YaHei, Segoe UI" font-size="16" fill="#53627a">资料整理 · 文件资源管理器</text>
    <text x="151" y="285" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#77859a">已最小化</text>
    <rect x="86" y="309" width="656" height="58" rx="13" fill="#f4f7fb"/>
    <circle cx="120" cy="338" r="16" fill="#8190a7"/>
    <text x="151" y="335" font-family="Microsoft YaHei, Segoe UI" font-size="16" fill="#53627a">参考页面 · 浏览器</text>
    <text x="151" y="355" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#77859a">已最小化</text>
  </g>

  <rect x="86" y="397" width="656" height="78" rx="13" fill="#dcecff"/>
  <text x="108" y="429" font-family="Microsoft YaHei, Segoe UI" font-size="15" font-weight="700" fill="#174f84">窗口专注中 · Paint.NET · 已收起 2 个窗口</text>
  <text x="108" y="453" font-family="Microsoft YaHei, Segoe UI" font-size="12" fill="#536e8c">保留窗口状态，退出 Panel 时也会主动还原</text>
  <rect x="602" y="415" width="116" height="42" rx="10" fill="#1677d2"/>
  <text x="660" y="441" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="14" font-weight="700" fill="#fff">恢复窗口</text>

  <rect x="820" y="78" width="308" height="382" rx="18" fill="#ffffff" stroke="#d9e3f0" filter="url(#shadow)"/>
  <text x="848" y="118" font-family="Microsoft YaHei, Segoe UI" font-size="15" font-weight="700" fill="#18243a">Paint.NET</text>
  <line x1="838" y1="136" x2="1110" y2="136" stroke="#e4eaf2"/>
  <text x="848" y="173" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#34445c">切换到此窗口</text>
  <rect x="836" y="192" width="276" height="48" rx="10" fill="#dcecff"/>
  <circle cx="856" cy="216" r="6" fill="#1677d2"/>
  <text x="874" y="221" font-family="Microsoft YaHei, Segoe UI" font-size="14" font-weight="700" fill="#174f84">专注此窗口（收起其他窗口）</text>
  <text x="848" y="275" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#34445c">最小化窗口</text>
