<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff"/>
      <stop offset="1" stop-color="#d9e8ff"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".86"/>
      <stop offset="1" stop-color="#edf5ff" stop-opacity=".76"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#17365d" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="105" cy="86" r="122" fill="#58a6ff" opacity=".16"/>
  <circle cx="1048" cy="516" r="170" fill="#8b5cf6" opacity=".12"/>

  <rect x="52" y="52" width="724" height="516" rx="24" fill="url(#glass)" stroke="#ffffff" filter="url(#shadow)"/>
  <text x="86" y="102" font-family="Microsoft YaHei, Segoe UI" font-size="22" font-weight="700" fill="#18243a">全部窗口</text>
  <text x="86" y="132" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#60708a">不依赖原生任务栏的窗口管理</text>

  <rect x="86" y="157" width="656" height="66" rx="13" fill="#dcecff"/>
