      <rect width="58" height="42" rx="10"/><rect x="68" width="62" height="42" rx="10"/><rect x="140" width="116" height="42" rx="10"/>
    </g>
    <text x="479" y="178" fill="#f8fafc" font-size="14">Ctrl</text><text x="546" y="178" fill="#f8fafc" font-size="14">Shift</text><text x="615" y="178" fill="#f8fafc" font-size="14">Space</text>
    <text x="466" y="226" fill="#9fb0c9" font-size="13">自动尝试，不要求用户修改配置</text>
