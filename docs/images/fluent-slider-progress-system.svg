<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#187bc2"/>
      <stop offset="1" stop-color="#63b7f2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1180" height="500" rx="32" fill="url(#bg)"/>
  <text x="62" y="72" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">Fluent 滑块与进度状态</text>
  <text x="62" y="106" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">动态深浅色 · 标准模板部件 · 明确区分可调数值、确定进度与加载状态</text>

  <g transform="translate(62 150)" filter="url(#shadow)">
    <rect width="510" height="278" rx="22" fill="#232d39" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="28" y="42" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="600">音量 · 62%</text>
    <text x="28" y="72" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">整个 44px 高度均为有效交互区域</text>
    <rect x="34" y="132" width="434" height="4" rx="2" fill="#10151c"/>
    <rect x="34" y="132" width="269" height="4" rx="2" fill="url(#accent)"/>
    <circle cx="303" cy="134" r="11" fill="#187bc2" stroke="#63b7f2" stroke-width="2"/>
    <rect x="28" y="194" width="454" height="54" rx="13" fill="#ffffff" fill-opacity=".055"/>
    <text x="48" y="226" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">拖动 · 点击轨道 · 方向键 · 动态禁用状态</text>
  </g>

  <g transform="translate(620 150)">
    <rect width="496" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">确定进度 · 64%</text>
    <rect x="24" y="62" width="448" height="8" rx="4" fill="#10151c"/>
    <rect x="24" y="62" width="287" height="8" rx="4" fill="url(#accent)"/>
    <text x="24" y="100" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">PART_Track + PART_Indicator 按真实比例布局</text>
  </g>

  <g transform="translate(620 302)">
    <rect width="496" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">加载中</text>
    <rect x="24" y="62" width="448" height="8" rx="4" fill="#10151c"/>
    <rect x="24" y="62" width="448" height="8" rx="4" fill="url(#accent)" opacity=".58"/>
    <circle cx="410" cy="66" r="14" fill="#63b7f2" opacity=".12"/>
    <circle cx="410" cy="66" r="8" fill="#63b7f2" opacity=".24"/>
    <text x="24" y="100" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">强调色柔和脉冲，不伪造完成比例</text>
  </g>
</svg>
