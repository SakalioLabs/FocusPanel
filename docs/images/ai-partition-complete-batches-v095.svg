<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff"/>
      <stop offset="1" stop-color="#e7ebf8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183b5e" flood-opacity=".18"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#287fc5"/>
    </marker>
  </defs>
  <rect width="1180" height="620" rx="28" fill="url(#bg)"/>
  <circle cx="1080" cy="35" r="190" fill="#3f92e0" opacity=".11"/>
  <circle cx="75" cy="610" r="180" fill="#7964ce" opacity=".09"/>
  <text x="64" y="70" font-family="Microsoft YaHei, Segoe UI" font-size="25" font-weight="700" fill="#19283e">AI 智能分区不再漏掉第 81 个项目</text>
  <text x="64" y="104" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#60738b">全部候选连续分批；单批失败只影响本批，不清空已经完成的结果</text>

  <rect x="70" y="150" width="250" height="340" rx="23" fill="#ffffff" stroke="#d4dfeb" filter="url(#shadow)"/>
  <text x="100" y="190" font-family="Microsoft YaHei, Segoe UI" font-size="18" font-weight="700" fill="#19283e">全部候选</text>
  <g font-family="Microsoft YaHei, Segoe UI">
    <rect x="100" y="222" width="190" height="48" rx="12" fill="#e8f5ed"/>
    <text x="122" y="252" font-size="14" fill="#23445d">项目 1—80</text>
    <rect x="100" y="282" width="190" height="48" rx="12" fill="#e7f2ff"/>
    <text x="122" y="312" font-size="14" fill="#23445d">项目 81—160</text>
    <rect x="100" y="342" width="190" height="48" rx="12" fill="#f1ecff"/>
    <text x="122" y="372" font-size="14" fill="#23445d">项目 161—最后</text>
    <text x="100" y="434" font-size="12" fill="#60738b">不再 Take(80) 静默截断</text>
  </g>

  <path d="M340 320 C375 320 390 320 425 320" fill="none" stroke="#287fc5" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="450" y="128" width="660" height="404" rx="25" fill="#173f69" filter="url(#shadow)"/>
  <text x="484" y="171" font-family="Microsoft YaHei, Segoe UI" font-size="19" font-weight="700" fill="#ffffff">分批规划与安全合并</text>
  <g font-family="Microsoft YaHei, Segoe UI">
    <rect x="484" y="204" width="592" height="68" rx="14" fill="#e8f5ed"/>
    <circle cx="517" cy="238" r="15" fill="#2daf68"/>
    <text x="548" y="234" font-size="15" font-weight="700" fill="#21364e">第 1 批成功</text>
    <text x="548" y="255" font-size="12" fill="#5d7187">AI 决策立即保留并按路径合并</text>
    <rect x="484" y="286" width="592" height="68" rx="14" fill="#fff2e2"/>
    <circle cx="517" cy="320" r="15" fill="#eea31f"/>
    <text x="548" y="316" font-size="15" font-weight="700" fill="#66420f">第 2 批网络或 JSON 失败</text>
    <text x="548" y="337" font-size="12" fill="#715c3d">仅本批回到稳定的本地分类</text>
    <rect x="484" y="368" width="592" height="68" rx="14" fill="#e7f2ff"/>
    <circle cx="517" cy="402" r="15" fill="#1677d2"/>
    <text x="548" y="398" font-size="15" font-weight="700" fill="#21364e">第 3 批继续执行</text>
    <text x="548" y="419" font-size="12" fill="#5d7187">后续项目不会被前一批失败连带丢弃</text>
    <text x="484" y="484" font-size="13" fill="#bdd9f2">取消操作仍立即终止 · 每批都不发送完整路径或文件内容</text>
  </g>
  <text x="590" y="577" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI" font-size="14" fill="#47617f">自动收纳、显式分类、重新规划使用同一套完整批次语义</text>
</svg>
