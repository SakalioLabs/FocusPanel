<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#182640"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55a9ff"/>
      <stop offset="1" stop-color="#927cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="1120" height="600" rx="30" fill="url(#bg)"/>
  <g font-family="Segoe UI, Microsoft YaHei">
    <text x="56" y="66" fill="#f4f8ff" font-size="28" font-weight="600">应用与窗口：一处搜索，直接切换</text>
    <text x="56" y="102" fill="#9fb1ca" font-size="17">不用先找应用图标，再展开窗口列表；窗口标题本身就是入口</text>

    <g filter="url(#shadow)">
      <rect x="56" y="134" width="1008" height="74" rx="18" fill="#202f47" stroke="#405473"/>
      <circle cx="94" cy="171" r="16" fill="none" stroke="#8fc3ff" stroke-width="3"/>
      <line x1="106" y1="183" x2="118" y2="195" stroke="#8fc3ff" stroke-width="3" stroke-linecap="round"/>
      <text x="140" y="180" fill="#fff" font-size="23">季度方案</text>
      <text x="1016" y="180" text-anchor="end" fill="#91a6c2" font-size="15">↑ ↓ 选择 · Enter 切换</text>
    </g>

    <rect x="56" y="232" width="1008" height="86" rx="18" fill="#263a58" stroke="#68adff" stroke-width="2"/>
    <rect x="74" y="251" width="48" height="48" rx="14" fill="url(#accent)"/>
    <text x="98" y="283" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">W</text>
    <text x="144" y="268" fill="#fff" font-size="21" font-weight="600">季度方案</text>
    <text x="144" y="295" fill="#b7c8df" font-size="15">Word · 当前窗口</text>
    <rect x="902" y="253" width="132" height="42" rx="13" fill="#173c68"/>
    <text x="968" y="280" text-anchor="middle" fill="#c3e0ff" font-size="15">精确标题 · 1</text>

    <rect x="56" y="334" width="1008" height="78" rx="18" fill="#1b2a40" stroke="#354963"/>
    <rect x="74" y="349" width="48" height="48" rx="14" fill="#3c506d"/>
    <text x="98" y="381" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">F</text>
    <text x="144" y="369" fill="#e1ebf8" font-size="20">季度方案管理器</text>
    <text x="144" y="394" fill="#91a5bf" font-size="15">应用 · 名称包含</text>
    <text x="1018" y="380" text-anchor="end" fill="#8398b4" font-size="15">弱匹配随后</text>

    <rect x="56" y="428" width="1008" height="78" rx="18" fill="#1b2a40" stroke="#354963"/>
    <rect x="74" y="443" width="48" height="48" rx="14" fill="#3c506d"/>
    <text x="98" y="475" text-anchor="middle" fill="#fff" font-size="21" font-weight="700">E</text>
    <text x="144" y="463" fill="#e1ebf8" font-size="20">季度方案评审 - Edge</text>
    <text x="144" y="488" fill="#91a5bf" font-size="15">Microsoft Edge · 已打开窗口</text>
    <text x="1018" y="474" text-anchor="end" fill="#8398b4" font-size="15">稳定窗口句柄</text>

    <path d="M 56 548 H 1064" stroke="#334761"/>
    <text x="56" y="578" fill="#8ca0ba" font-size="15">空查询：只显示原有应用顺序　|　窗口变化：保持当前选择　|　Esc：返回紧凑栏搜索入口</text>
  </g>
</svg>
