<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#182840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51c7ff"/>
      <stop offset="1" stop-color="#8979ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1120" height="500" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8fc" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">桌面收纳 · 后台布局快照</text>
  <text x="54" y="96" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">文件监控、拖拽和视图调整不再把 SQLite 全表读取堆到 WPF UI 线程</text>

  <g filter="url(#shadow)">
    <rect x="54" y="136" width="250" height="230" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="78" y="178" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">交互请求合并</text>
    <circle cx="88" cy="222" r="7" fill="#55d69d"/>
    <text x="108" y="228" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">桌面监控与手动刷新</text>
    <circle cx="88" cy="266" r="7" fill="#7fd0ff"/>
    <text x="108" y="272" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">拖入、拖出与自动整理</text>
    <circle cx="88" cy="310" r="7" fill="#8979ff"/>
    <text x="108" y="316" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">只保留一次尾随读取</text>
  </g>

  <path d="M324 252 H390" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M376 240 L394 252 L376 264" fill="none" stroke="#718cff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="412" y="120" width="296" height="264" rx="24" fill="#273a54" stroke="#587293"/>
    <text x="560" y="164" text-anchor="middle" fill="#e8f1fb" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">后台单消费者</text>
    <circle cx="450" cy="210" r="9" fill="#55d69d"/>
    <text x="474" y="216" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">分区与文件偏好快照</text>
    <circle cx="450" cy="256" r="9" fill="#7fd0ff"/>
    <text x="474" y="262" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">布局设置合并落盘</text>
    <circle cx="450" cy="302" r="9" fill="#ffc66d"/>
    <text x="474" y="308" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">读取与写入严格串行</text>
    <rect x="438" y="338" width="244" height="30" rx="15" fill="#304765"/>
    <text x="560" y="359" text-anchor="middle" fill="#bcd0e7" font-family="Segoe UI, Microsoft YaHei" font-size="13">数据库忙时保留最后有效布局</text>
  </g>

  <path d="M728 252 H800" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M786 240 L804 252 L786 264" fill="none" stroke="#8979ff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="822" y="136" width="244" height="230" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="846" y="178" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">UI 差量提交</text>
    <circle cx="860" cy="222" r="7" fill="#55d69d"/>
    <text x="880" y="228" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">复用分区与文件卡片</text>
    <circle cx="860" cy="266" r="7" fill="#ffc66d"/>
    <text x="880" y="272" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">旧设置快照不回滚</text>
    <circle cx="860" cy="310" r="7" fill="#7fd0ff"/>
    <text x="880" y="316" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">滚动与展开状态保留</text>
  </g>

  <rect x="54" y="414" width="1012" height="50" rx="17" fill="#202f47" stroke="#3c506d"/>
  <text x="560" y="445" text-anchor="middle" fill="#c6d4e7" font-family="Segoe UI, Microsoft YaHei" font-size="15">结果：桌面变化不阻塞 Panel · 快速设置只保存最终值 · 收纳文件与数据库语义保持不变</text>
</svg>
