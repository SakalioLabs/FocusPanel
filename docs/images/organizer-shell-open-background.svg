<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="520" viewBox="0 0 1120 520">
  <defs>
    <linearGradient id="bgshellopen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a2a"/>
      <stop offset="1" stop-color="#28304f"/>
    </linearGradient>
    <linearGradient id="flowshellopen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60c9ff"/>
      <stop offset="1" stop-color="#a68cff"/>
