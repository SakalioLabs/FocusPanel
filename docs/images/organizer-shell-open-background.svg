  <path d="M353 251 L367 262 L353 273" fill="none" stroke="#68c6ff" stroke-width="5" stroke-linejoin="round"/>

  <rect x="390" y="118" width="340" height="288" rx="26" fill="#2b405f" stroke="#6382aa"/>
  <text x="560" y="160" text-anchor="middle" fill="#f3f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="700">ShellPathOpenCoordinator</text>
  <circle cx="430" cy="207" r="9" fill="#68c7ff"/>
  <text x="454" y="213" fill="#e2ebfa" font-family="Segoe UI, Microsoft YaHei" font-size="15">复制并清理路径字符串</text>
  <circle cx="430" cy="249" r="9" fill="#8ce4b9"/>
  <text x="454" y="255" fill="#e2ebfa" font-family="Segoe UI, Microsoft YaHei" font-size="15">每次请求独立进入工作线程</text>
  <circle cx="430" cy="291" r="9" fill="#ad97ff"/>
