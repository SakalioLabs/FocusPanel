  </defs>
  <rect width="1120" height="520" rx="30" fill="url(#bgshellopen)"/>
  <text x="54" y="62" fill="#f6f9ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">桌面收纳 · 文件后台打开</text>
  <text x="54" y="97" fill="#b9cce8" font-family="Segoe UI, Microsoft YaHei" font-size="16">慢磁盘、离线路径与失效文件关联不再占用 WPF 界面线程</text>

  <rect x="54" y="137" width="250" height="250" rx="24" fill="#223650" stroke="#496889"/>
