  <rect x="54" y="440" width="1012" height="46" rx="17" fill="#20334c" stroke="#426080"/>
  <text x="560" y="469" text-anchor="middle" fill="#dce9f8" font-family="Segoe UI, Microsoft YaHei" font-size="15">滚动持续响应 · 后续打开不排队 · 旧失败不覆盖新成功 · Shell 异常不闪退</text>
