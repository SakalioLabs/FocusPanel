<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10141c"/>
      <stop offset="1" stop-color="#202633"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1180" height="500" rx="28" fill="url(#bg)"/>
  <text x="52" y="62" fill="#f4f7fc" font-family="Segoe UI Variable Display,Segoe UI" font-size="28" font-weight="600">统一 Fluent 操作按钮</text>
  <text x="52" y="94" fill="#9da8ba" font-family="Segoe UI Variable Text,Segoe UI" font-size="15">整行操作和危险操作共享同一个单层圆角 Chrome，不再混入 WPF 原生矩形</text>

  <g transform="translate(52 132)" filter="url(#shadow)">
    <rect width="522" height="300" rx="20" fill="#1f252f" fill-opacity=".85" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="28" y="42" fill="#aeb8c8" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">应用搜索 · 整行启动</text>
    <g transform="translate(24 68)">
      <rect width="474" height="62" rx="8" fill="#ffffff" fill-opacity=".09" stroke="#87a9ff" stroke-opacity=".72" stroke-width="2"/>
      <rect x="14" y="11" width="40" height="40" rx="9" fill="#367eea"/>
      <path d="M25 23h18v18H25z" fill="#fff" opacity=".92"/>
      <text x="70" y="27" fill="#f5f7fb" font-family="Segoe UI Variable Text,Segoe UI" font-size="15" font-weight="600">文件资源管理器</text>
      <text x="70" y="48" fill="#aeb8c8" font-family="Segoe UI Variable Text,Segoe UI" font-size="12">按 Enter 启动 · 整行 44px+ 点击区</text>
      <text x="434" y="38" fill="#92b8ff" font-family="Segoe Fluent Icons" font-size="18"></text>
    </g>
    <g transform="translate(24 146)">
      <rect width="474" height="54" rx="8" fill="transparent"/>
      <text x="18" y="33" fill="#f5f7fb" font-family="Segoe UI Variable Text,Segoe UI" font-size="14">默认</text>
    </g>
    <g transform="translate(24 212)">
      <rect width="474" height="54" rx="8" fill="#ffffff" fill-opacity=".09"/>
      <text x="18" y="33" fill="#f5f7fb" font-family="Segoe UI Variable Text,Segoe UI" font-size="14">悬停 · 同一表面轻微提亮</text>
    </g>
  </g>

  <g transform="translate(606 132)" filter="url(#shadow)">
    <rect width="522" height="300" rx="20" fill="#f0f3f8" stroke="#101722" stroke-opacity=".11"/>
    <text x="28" y="42" fill="#5d6878" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">危险操作 · 动态主题</text>
    <g transform="translate(24 70)">
      <rect width="224" height="50" rx="8" fill="#d92d4b" fill-opacity=".13" stroke="#d92d4b"/>
      <text x="71" y="31" fill="#b5223e" font-family="Segoe UI Variable Text,Segoe UI" font-size="14" font-weight="600">删除目标</text>
    </g>
    <text x="272" y="101" fill="#596575" font-family="Segoe UI Variable Text,Segoe UI" font-size="13">浅色主题</text>
    <g transform="translate(24 140)">
