<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="430" viewBox="0 0 1080 430" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 任务入口快速收集</title>
  <desc id="desc">任务入口左键打开工作区，右键明确提供快速添加到 Inbox，选择后自动聚焦标题并按 Enter 保存。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081220"/>
      <stop offset="1" stop-color="#172a49"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#8664ff"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#020617" flood-opacity=".5"/>
    </filter>
  </defs>
  <rect width="1080" height="430" rx="28" fill="url(#bg)"/>
  <text x="50" y="58" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">记下一件事，不该先学会命令语法</text>
  <text x="50" y="90" fill="#9fb1d1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">保留左键直达任务工作区，同时把快速收集放进符合任务栏习惯的右键菜单</text>

  <g transform="translate(70 130)" filter="url(#shadow)">
    <rect width="154" height="224" rx="26" fill="#182642" stroke="#385078"/>
    <rect x="39" y="28" width="76" height="76" rx="20" fill="#243653"/>
    <path d="M58 51h38M58 66h28M58 81h34" stroke="#8eb4ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M95 80v22M84 91h22" stroke="#8eb4ff" stroke-width="4" stroke-linecap="round"/>
    <text x="77" y="137" text-anchor="middle" fill="#f3f6fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="650">任务</text>
    <rect x="28" y="158" width="98" height="40" rx="12" fill="url(#accent)"/>
    <text x="77" y="183" text-anchor="middle" fill="#fff" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13" font-weight="650">右键</text>
  </g>

  <path d="M252 242h68" stroke="#6f88b2" stroke-width="3" stroke-linecap="round"/>
  <path d="M308 233l12 9-12 9" fill="none" stroke="#6f88b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(350 165)" filter="url(#shadow)">
    <rect width="264" height="114" rx="20" fill="#1b2a45" stroke="#405a84"/>
    <text x="20" y="30" fill="#8fa4c8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">任务快捷菜单</text>
    <rect x="12" y="44" width="240" height="54" rx="13" fill="#263b61"/>
    <circle cx="38" cy="71" r="11" fill="#4f8cff"/>
    <path d="M38 65v12M32 71h12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <text x="60" y="77" fill="#eef3fb" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="650">快速添加到 Inbox…</text>
  </g>

  <path d="M642 242h68" stroke="#6f88b2" stroke-width="3" stroke-linecap="round"/>
  <path d="M698 233l12 9-12 9" fill="none" stroke="#6f88b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(740 122)" filter="url(#shadow)">
    <rect width="290" height="236" rx="22" fill="#1b2a45" stroke="#405a84"/>
    <text x="22" y="38" fill="#f3f6fc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="18" font-weight="650">快速添加到 Inbox</text>
    <text x="22" y="64" fill="#9fb1d1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">输入标题后按 Enter，直接保存到 Inbox</text>
    <rect x="20" y="84" width="250" height="52" rx="14" fill="#243653" stroke="#5e8fe8" stroke-width="2"/>
    <text x="38" y="116" fill="#e8eef9" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">任务 整理明天的演示材料</text>
    <rect x="20" y="154" width="250" height="56" rx="14" fill="#20324f"/>
    <text x="38" y="178" fill="#86a8e6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">Enter</text>
    <text x="38" y="198" fill="#c9d7ec" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">后台保存 · Toast 确认 · 角标刷新</text>
  </g>

  <text x="70" y="397" fill="#a8bad7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">左键仍打开任务工作区　·　右键快速收集　·　菜单与输入期间 Panel 保持展开</text>
</svg>
