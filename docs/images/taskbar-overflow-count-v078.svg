<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#1a2940"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c3b54" stop-opacity=".96"/><stop offset="1" stop-color="#151f31" stop-opacity=".91"/></linearGradient>
    <filter id="shadow" x="-70%" y="-30%" width="240%" height="180%"><feDropShadow dy="18" stdDeviation="22" flood-opacity=".46"/></filter>
  </defs>
  <rect width="1200" height="650" fill="url(#bg)"/>
  <circle cx="1020" cy="80" r="250" fill="#2e92e7" opacity=".11"/><circle cx="125" cy="610" r="230" fill="#7663e7" opacity=".09"/>
  <text x="70" y="80" fill="#f5f8fc" font-family="Segoe UI, Microsoft YaHei" font-size="34" font-weight="700">任务栏滚到哪里，一眼就知道</text>
  <text x="70" y="120" fill="#adbbcf" font-family="Segoe UI, Microsoft YaHei" font-size="20">上下箭头直接显示尚未露出的应用数量</text>

  <g transform="translate(120 170)" filter="url(#shadow)">
    <rect width="76" height="405" rx="24" fill="url(#glass)" stroke="#6f83a1" stroke-opacity=".55"/>
    <rect x="25" y="16" width="26" height="4" rx="2" fill="#9dabbe"/>
    <text x="38" y="57" fill="#dce6f2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="12">开始</text>
    <text x="38" y="96" fill="#dce6f2" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="12">窗口</text>
    <line x1="14" y1="116" x2="62" y2="116" stroke="#7688a1" stroke-opacity=".48"/>

    <g transform="translate(10 126)">
      <rect width="56" height="44" rx="12" fill="#26354c"/>
      <path d="M24 27l4-5 4 5" fill="none" stroke="#dce8f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="37" y="25" width="21" height="17" rx="8" fill="#182337" stroke="#4aa8f1"/>
      <text x="47.5" y="37" fill="#76c3ff" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="700">3</text>
    </g>

    <g transform="translate(15 177)"><rect width="46" height="46" rx="12" fill="#2f8fe4"/><circle cx="23" cy="23" r="12" fill="#fff"/><path d="M17 23h12M23 17v12" stroke="#2f8fe4" stroke-width="3"/></g>
    <g transform="translate(15 228)"><rect width="46" height="46" rx="12" fill="#26354c"/><circle cx="23" cy="23" r="12" fill="#45c87b"/><path d="M16 23l5 5 10-12" fill="none" stroke="#fff" stroke-width="3"/></g>
    <g transform="translate(15 279)"><rect width="46" height="46" rx="12" fill="#26354c"/><circle cx="23" cy="23" r="12" fill="#ffb84c"/><path d="M18 28l10-10M18 18h10v10" fill="none" stroke="#37260b" stroke-width="2.5"/></g>

    <g transform="translate(10 332)">
      <rect width="56" height="44" rx="12" fill="#26354c"/>
      <path d="M24 17l4 5 4-5" fill="none" stroke="#dce8f5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="35" y="2" width="23" height="17" rx="8" fill="#182337" stroke="#4aa8f1"/>
      <text x="46.5" y="14" fill="#76c3ff" text-anchor="middle" font-family="Segoe UI" font-size="11" font-weight="700">12</text>
    </g>
  </g>

  <g transform="translate(270 200)">
    <path d="M0 95h120" stroke="#48a9f3" stroke-width="3"/><path d="M110 85l14 10-14 10" fill="none" stroke="#48a9f3" stroke-width="3"/>
    <text x="58" y="70" fill="#7fc9ff" text-anchor="middle" font-family="Segoe UI, Microsoft YaHei" font-size="17">实时视口位置</text>
  </g>

  <g transform="translate(455 170)">
    <text x="0" y="30" fill="#f4f8fc" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">不再需要试着滚一滚</text>
    <g transform="translate(0 65)">
      <rect width="650" height="100" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="45" cy="50" r="21" fill="#2f94e8"/><text x="45" y="57" fill="#fff" text-anchor="middle" font-family="Segoe UI" font-size="21">3</text>
      <text x="84" y="43" fill="#eff5fb" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="600">上方还有 3 个应用</text>
      <text x="84" y="72" fill="#adbbcf" font-family="Segoe UI, Microsoft YaHei" font-size="16">点箭头、滚轮向上或按 Home 都能回去</text>
    </g>
    <g transform="translate(0 185)">
      <rect width="650" height="100" rx="18" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".12"/>
      <circle cx="45" cy="50" r="21" fill="#7764e8"/><text x="45" y="57" fill="#fff" text-anchor="middle" font-family="Segoe UI" font-size="18">12</text>
      <text x="84" y="43" fill="#eff5fb" font-family="Segoe UI, Microsoft YaHei" font-size="21" font-weight="600">下方还有 12 个应用</text>
      <text x="84" y="72" fill="#adbbcf" font-family="Segoe UI, Microsoft YaHei" font-size="16">活动应用和注意请求自动露出后数量同步变化</text>
    </g>
    <g transform="translate(0 305)">
      <rect width="650" height="84" rx="18" fill="#248ce3" fill-opacity=".14" stroke="#3b9be7" stroke-opacity=".55"/>
      <text x="28" y="35" fill="#d8eeff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="600">顶部 / 中部 / 底部状态清楚</text>
      <text x="28" y="62" fill="#9fd5ff" font-family="Segoe UI, Microsoft YaHei" font-size="16">到达边缘自动隐藏对应按钮 · 99 个以上显示 99+</text>
    </g>
