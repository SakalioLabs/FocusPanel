<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 应用搜索完整键盘路径</title>
  <desc id="desc">从搜索入口到立即输入、方向键选择、回车启动和 Esc 返回的流程，并说明后台索引保持选中项。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101727"/>
      <stop offset="1" stop-color="#1a2440"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62c7ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050914" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1120" height="360" rx="28" fill="url(#bg)"/>
  <text x="52" y="55" fill="#f5f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="25" font-weight="600">应用搜索：双手不离开键盘</text>
  <text x="52" y="84" fill="#9eabc5" font-family="Segoe UI, Microsoft YaHei" font-size="15">后台索引更新不会打断当前选择</text>

  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei">
    <g transform="translate(52 120)">
      <rect width="210" height="142" rx="20" fill="#202c47" stroke="#415070"/>
      <circle cx="38" cy="40" r="19" fill="url(#accent)"/>
      <path d="M31 40a7 7 0 1 1 12 5l6 6" fill="none" stroke="#0d1628" stroke-width="3" stroke-linecap="round"/>
      <text x="68" y="45" fill="#f4f7ff" font-size="18" font-weight="600">打开搜索</text>
      <text x="24" y="87" fill="#b7c2d8" font-size="15">自动聚焦并全选</text>
      <text x="24" y="113" fill="#7ed7ff" font-size="14">直接输入应用名称</text>
    </g>

    <g transform="translate(304 120)">
      <rect width="210" height="142" rx="20" fill="#202c47" stroke="#415070"/>
      <rect x="24" y="24" width="162" height="34" rx="10" fill="#2a3858"/>
      <text x="38" y="47" fill="#eef4ff" font-size="15">Visual Studio</text>
      <rect x="24" y="66" width="162" height="30" rx="10" fill="#172239"/>
      <text x="38" y="87" fill="#aab7cf" font-size="14">VS Code</text>
      <text x="24" y="123" fill="#7ed7ff" font-size="14">↑ ↓ 稳定移动选择</text>
    </g>

    <g transform="translate(556 120)">
      <rect width="210" height="142" rx="20" fill="#202c47" stroke="#415070"/>
      <rect x="24" y="24" width="72" height="42" rx="11" fill="url(#accent)"/>
      <text x="40" y="51" fill="#101729" font-size="15" font-weight="700">Enter</text>
      <text x="24" y="94" fill="#f4f7ff" font-size="18" font-weight="600">启动当前应用</text>
      <text x="24" y="121" fill="#aab7cf" font-size="14">未选择时使用首项</text>
    </g>

    <g transform="translate(808 120)">
      <rect width="260" height="142" rx="20" fill="#202c47" stroke="#415070"/>
      <rect x="24" y="24" width="58" height="42" rx="11" fill="#2a3858"/>
      <text x="39" y="51" fill="#eef4ff" font-size="15" font-weight="600">Esc</text>
      <text x="98" y="51" fill="#f4f7ff" font-size="18" font-weight="600">关闭并返回</text>
      <text x="24" y="94" fill="#aab7cf" font-size="14">焦点回到紧凑栏搜索入口</text>
      <text x="24" y="121" fill="#7ed7ff" font-size="14">继续浏览六入口任务栏</text>
    </g>
  </g>

  <g fill="none" stroke="#6bcfff" stroke-width="3" stroke-linecap="round" opacity=".9">
    <path d="M270 191h25"/>
    <path d="M522 191h25"/>
    <path d="M774 191h25"/>
  </g>
  <g fill="#6bcfff">
    <path d="M296 191l-9-6v12z"/>
    <path d="M548 191l-9-6v12z"/>
    <path d="M800 191l-9-6v12z"/>
  </g>

  <rect x="304" y="286" width="462" height="38" rx="19" fill="#18243b" stroke="#354765"/>
  <circle cx="327" cy="305" r="6" fill="#7ed7ff"/>
  <text x="344" y="311" fill="#b9c5da" font-family="Segoe UI, Microsoft YaHei" font-size="14">目录补全与固定变化 → 按应用身份恢复当前选择</text>
</svg>
