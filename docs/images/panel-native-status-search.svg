<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#26354b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1100" height="560" rx="30" fill="url(#bg)"/>
  <circle cx="160" cy="60" r="180" fill="#3b82f6" opacity=".12"/>
  <circle cx="970" cy="500" r="220" fill="#22d3ee" opacity=".09"/>

  <g filter="url(#shadow)">
    <rect x="58" y="64" width="544" height="432" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/>
    <text x="92" y="108" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei" font-size="24" font-weight="600">Panel 统一搜索</text>
    <rect x="88" y="132" width="484" height="58" rx="15" fill="#07101f" fill-opacity=".72" stroke="#5ea7ff"/>
    <text x="112" y="169" fill="#e8f2ff" font-family="Segoe UI, Microsoft YaHei" font-size="22">快捷设置</text>

    <g font-family="Segoe UI, Microsoft YaHei">
      <rect x="88" y="214" width="484" height="72" rx="16" fill="#3794ff" fill-opacity=".22" stroke="#62adff"/>
      <circle cx="124" cy="250" r="20" fill="#429cff"/>
      <text x="116" y="258" fill="#fff" font-size="22">⌁</text>
      <text x="160" y="244" fill="#fff" font-size="19" font-weight="600">网络与无线</text>
      <text x="160" y="269" fill="#b9d8ff" font-size="14">Panel 状态详情 · 不打开 Windows 任务栏浮层</text>

      <rect x="88" y="300" width="484" height="72" rx="16" fill="#fff" fill-opacity=".075"/>
      <circle cx="124" cy="336" r="20" fill="#fff" fill-opacity=".12"/>
      <text x="115" y="344" fill="#fff" font-size="20">中</text>
      <text x="160" y="330" fill="#f8fafc" font-size="19" font-weight="600">输入法</text>
      <text x="160" y="355" fill="#aab9cc" font-size="14">搜索“键盘 / Win+Space”也进入 Panel</text>

      <rect x="88" y="386" width="484" height="72" rx="16" fill="#fff" fill-opacity=".075"/>
      <circle cx="124" cy="422" r="20" fill="#fff" fill-opacity=".12"/>
      <text x="115" y="430" fill="#fff" font-size="20">♪</text>
      <text x="160" y="416" fill="#f8fafc" font-size="19" font-weight="600">应用音量</text>
      <text x="160" y="441" fill="#aab9cc" font-size="14">主音量、静音与每个应用的独立会话</text>
    </g>
  </g>

  <g filter="url(#shadow)" font-family="Segoe UI, Microsoft YaHei">
    <rect x="632" y="64" width="410" height="432" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".18"/>
    <text x="666" y="108" fill="#f8fafc" font-size="24" font-weight="600">状态中心</text>
    <text x="666" y="136" fill="#aab9cc" font-size="14">高频能力留在 Panel 内连续操作</text>

    <g>
      <rect x="666" y="164" width="166" height="54" rx="14" fill="#3d9cff" fill-opacity=".24" stroke="#62adff"/>
      <text x="704" y="198" fill="#fff" font-size="17">网络与无线</text>
      <rect x="842" y="164" width="166" height="54" rx="14" fill="#fff" fill-opacity=".08"/>
      <text x="884" y="198" fill="#fff" font-size="17">应用音量</text>
      <rect x="666" y="230" width="166" height="54" rx="14" fill="#fff" fill-opacity=".08"/>
      <text x="710" y="264" fill="#fff" font-size="17">媒体电池</text>
      <rect x="842" y="230" width="166" height="54" rx="14" fill="#fff" fill-opacity=".08"/>
      <text x="896" y="264" fill="#fff" font-size="17">输入法</text>
    </g>

    <rect x="666" y="310" width="342" height="124" rx="18" fill="#091321" fill-opacity=".58"/>
    <text x="690" y="344" fill="#f8fafc" font-size="17" font-weight="600">直接控制</text>
    <text x="690" y="374" fill="#b8c7d9" font-size="15">Wi‑Fi / 蓝牙 Radio　主音量　亮度</text>
    <text x="690" y="402" fill="#b8c7d9" font-size="15">附近网络　应用混音　输入法切换</text>
    <text x="666" y="470" fill="#73b8ff" font-size="14">✓ 无 Win+A　✓ 无 Win+Space　✓ 无 Win+Tab</text>
  </g>
</svg>
