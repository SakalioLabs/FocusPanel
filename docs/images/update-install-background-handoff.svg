<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
  <title id="title">更新安装后台备份与安全交接</title>
  <desc id="desc">更新下载完成后保持界面忙碌和交互锁，在工作线程检查并备份数据库；成功后恢复任务栏和桌面图标并启动安装，失败则恢复热区并提示。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1d2a44"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#7dd3fc"/>
    </marker>
  </defs>
  <rect width="1120" height="450" rx="28" fill="url(#background)"/>
  <text x="54" y="62" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="28" font-weight="650">下载完成后，先在后台安全备份再交给安装器</text>
  <text x="54" y="96" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="15">界面保持可响应，更新按钮与自动收起保持锁定</text>

  <g filter="url(#shadow)">
    <rect x="54" y="138" width="238" height="218" rx="22" fill="#1d2a42" stroke="#344969"/>
    <circle cx="91" cy="178" r="18" fill="#173d54"/>
    <path d="M82 178h18m-9-9v18" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"/>
    <text x="121" y="185" fill="#f8fafc" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600">更新已下载</text>
    <text x="80" y="233" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">保持 IsUpdateBusy</text>
    <text x="80" y="267" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">持有 Panel 交互锁</text>
    <text x="80" y="301" fill="#dbeafe" font-family="Segoe UI, sans-serif" font-size="14">暂停右缘监测</text>
    <rect x="80" y="320" width="172" height="25" rx="9" fill="#132137"/>
    <text x="94" y="338" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="12">WPF Dispatcher 可继续响应</text>
  </g>

  <path d="M312 247h75" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="321" y="228" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="13">await</text>

  <g filter="url(#shadow)">
    <rect x="407" y="122" width="286" height="250" rx="22" fill="#1d2a42" stroke="#50658a"/>
    <rect x="433" y="148" width="234" height="46" rx="13" fill="url(#accent)" opacity=".94"/>
    <text x="451" y="177" fill="#fff" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">后台安装准备</text>
    <circle cx="455" cy="229" r="10" fill="#38bdf8"/>
    <text x="477" y="235" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">SQLite quick_check</text>
    <circle cx="455" cy="271" r="10" fill="#818cf8"/>
    <text x="477" y="277" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">在线一致性备份</text>
    <circle cx="455" cy="313" r="10" fill="#a78bfa"/>
    <text x="477" y="319" fill="#e2e8f0" font-family="Segoe UI, sans-serif" font-size="14">滚动清理历史备份</text>
    <text x="433" y="351" fill="#9fb0c8" font-family="Segoe UI, sans-serif" font-size="12">异常转换为明确结果，不冲击 UI</text>
  </g>

  <path d="M713 206h83" stroke="#86efac" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="729" y="188" fill="#86efac" font-family="Segoe UI, sans-serif" font-size="13">成功</text>
  <path d="M713 302h83" stroke="#fda4af" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="729" y="284" fill="#fda4af" font-family="Segoe UI, sans-serif" font-size="13">失败</text>

  <g filter="url(#shadow)">
    <rect x="816" y="132" width="250" height="110" rx="20" fill="#17362d" stroke="#34705c"/>
    <text x="844" y="172" fill="#dcfce7" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">安全启动安装</text>
    <text x="844" y="201" fill="#a7f3d0" font-family="Segoe UI, sans-serif" font-size="13">恢复任务栏 · 桌面图标 · Velopack</text>
    <rect x="816" y="268" width="250" height="110" rx="20" fill="#3a222c" stroke="#824456"/>
    <text x="844" y="308" fill="#ffe4e6" font-family="Segoe UI, sans-serif" font-size="17" font-weight="600">保留当前会话</text>
    <text x="844" y="337" fill="#fecdd3" font-family="Segoe UI, sans-serif" font-size="13">恢复热区 · 显示原因 · 可重试</text>
  </g>

  <text x="54" y="414" fill="#93a4bd" font-family="Segoe UI, sans-serif" font-size="13">业务数据库仍位于原路径；准备失败不会覆盖、删除或替换现有数据。</text>
</svg>
