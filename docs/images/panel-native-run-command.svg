<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1000" height="420" rx="30" fill="url(#bg)"/>
  <text x="54" y="58" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="25" font-weight="600">“运行”也留在 Panel 内</text>
  <text x="54" y="88" fill="#94a3b8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14">不弹 Win+R · 不经过 cmd.exe · 显式输入 &gt; 才执行</text>

  <g filter="url(#shadow)">
    <rect x="54" y="124" width="214" height="226" rx="24" fill="#111c33" stroke="#334155"/>
  </g>
  <text x="80" y="160" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="17" font-weight="600">开始 · 右键</text>
  <line x1="80" y1="176" x2="242" y2="176" stroke="#334155"/>
  <g font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="14">
    <text x="82" y="207" fill="#cbd5e1">Panel 统一搜索</text>
    <text x="82" y="239" fill="#cbd5e1">文件资源管理器</text>
    <rect x="70" y="254" width="182" height="42" rx="12" fill="#0c4a6e"/>
    <text x="82" y="281" fill="#e0f2fe">Panel 运行…</text>
    <text x="82" y="326" fill="#94a3b8" font-size="12">也可在搜索建议点“运行”</text>
  </g>

  <path d="M286 233 C327 233 338 233 374 233" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M364 225 L376 233 L364 241" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="394" y="124" width="552" height="226" rx="24" fill="#111c33" stroke="#334155"/>
  </g>
  <text x="424" y="158" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="18" font-weight="600">Panel 运行</text>
  <text x="424" y="183" fill="#94a3b8" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="12">程序、文件、文件夹或网址 · 含空格目标使用双引号</text>
  <rect x="422" y="200" width="496" height="50" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".7"/>
  <text x="444" y="231" fill="#7dd3fc" font-family="Cascadia Mono,Microsoft YaHei,sans-serif" font-size="15">&gt; "D:\Tools\Paint.NET.exe" image.png</text>
  <g transform="translate(422,268)">
    <rect width="496" height="58" rx="15" fill="#183b58" stroke="#38bdf8" stroke-opacity=".55"/>
    <rect x="15" y="12" width="34" height="34" rx="9" fill="#0ea5e9"/>
    <text x="32" y="35" text-anchor="middle" fill="#f0f9ff" font-family="Segoe Fluent Icons,Segoe UI Symbol" font-size="16">▶</text>
    <text x="64" y="25" fill="#f8fafc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="15">运行 D:\Tools\Paint.NET.exe</text>
    <text x="64" y="44" fill="#7dd3fc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="11">Panel 运行命令 · Enter 执行</text>
  </g>
  <text x="54" y="394" fill="#a5b4fc" font-family="Segoe UI,Microsoft YaHei,sans-serif" font-size="13">支持环境变量与 Windows 文件关联　·　目标和参数分开传递　·　失败时给出明确原因</text>
</svg>
