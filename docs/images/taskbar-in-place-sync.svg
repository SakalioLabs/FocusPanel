<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#17233a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55b7ff"/>
      <stop offset="1" stop-color="#8b7cff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000" flood-opacity=".26"/>
    </filter>
  </defs>
  <rect width="1120" height="460" rx="28" fill="url(#bg)"/>
  <text x="56" y="66" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">统一应用栏 · 原位状态同步</text>
  <text x="56" y="100" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">窗口事件只改变已有项目的状态，不再替换 WPF 按钮视觉树</text>

  <g filter="url(#shadow)">
    <rect x="56" y="138" width="310" height="248" rx="22" fill="#202d44" stroke="#40506a"/>
    <text x="82" y="178" fill="#d9e4f4" font-family="Segoe UI, Microsoft YaHei" font-size="17" font-weight="600">前台切换前</text>
    <rect x="84" y="204" width="254" height="68" rx="16" fill="#293851"/>
    <rect x="96" y="220" width="4" height="18" rx="2" fill="#66bfff" opacity=".6"/>
    <rect x="116" y="218" width="32" height="32" rx="9" fill="#5475ff"/>
    <text x="164" y="240" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei" font-size="16">浏览器 · 后台运行</text>
    <rect x="84" y="286" width="254" height="68" rx="16" fill="#31445f"/>
    <rect x="96" y="304" width="4" height="28" rx="2" fill="#67c3ff"/>
    <rect x="116" y="304" width="32" height="32" rx="9" fill="#29a36a"/>
    <text x="164" y="326" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei" font-size="16">编辑器 · 正在使用</text>
  </g>

  <path d="M402 260 H696" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M682 248 L700 260 L682 272" fill="none" stroke="#8b7cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="450" y="188" width="200" height="54" rx="27" fill="#263550" stroke="#526789"/>
  <text x="550" y="221" text-anchor="middle" fill="#dce8f8" font-family="Segoe UI, Microsoft YaHei" font-size="15">PropertyChanged</text>
  <text x="550" y="305" text-anchor="middle" fill="#9fb0c7" font-family="Segoe UI, Microsoft YaHei" font-size="14">同一个 TaskbarAppItem</text>
  <text x="550" y="329" text-anchor="middle" fill="#9fb0c7" font-family="Segoe UI, Microsoft YaHei" font-size="14">集合无 Replace / Reset</text>

  <g filter="url(#shadow)">
    <rect x="736" y="138" width="328" height="248" rx="22" fill="#202d44" stroke="#40506a"/>
    <text x="762" y="178" fill="#d9e4f4" font-family="Segoe UI, Microsoft YaHei" font-size="17" font-weight="600">前台切换后</text>
    <rect x="764" y="204" width="272" height="68" rx="16" fill="#31445f"/>
    <rect x="776" y="222" width="4" height="28" rx="2" fill="#67c3ff"/>
    <rect x="796" y="218" width="32" height="32" rx="9" fill="#5475ff"/>
    <text x="844" y="240" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei" font-size="16">浏览器 · 正在使用</text>
    <rect x="764" y="286" width="272" height="68" rx="16" fill="#293851"/>
    <rect x="776" y="304" width="4" height="18" rx="2" fill="#66bfff" opacity=".6"/>
    <rect x="796" y="304" width="32" height="32" rx="9" fill="#29a36a"/>
    <text x="844" y="326" fill="#f4f7fb" font-family="Segoe UI, Microsoft YaHei" font-size="16">编辑器 · 后台运行</text>
  </g>

  <rect x="56" y="414" width="1008" height="1" fill="#34435b"/>
  <circle cx="75" cy="438" r="5" fill="#67c3ff"/>
  <text x="90" y="444" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="14">按钮实例、键盘焦点、滚动位置和图标呈现器全部保留</text>
</svg>
