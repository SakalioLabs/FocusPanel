<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#18253b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1090" cy="110" r="230" fill="#4f8cff" opacity=".14"/>
  <circle cx="170" cy="650" r="280" fill="#4fd1c5" opacity=".1"/>
  <text x="80" y="92" fill="#f5f8ff" font-family="Segoe UI, sans-serif" font-size="38" font-weight="600">公共桌面批量收纳 · 一次授权</text>
  <text x="80" y="132" fill="#aebbd0" font-family="Segoe UI, sans-serif" font-size="20">主壳保持普通权限，只为本次公共桌面属性写入创建短生命周期助手</text>

  <g filter="url(#shadow)">
    <rect x="70" y="190" width="300" height="410" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="105" y="240" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">桌面项目</text>
    <rect x="105" y="275" width="230" height="70" rx="16" fill="#64d8cb" fill-opacity=".18"/>
    <circle cx="140" cy="310" r="14" fill="#64d8cb"/>
    <text x="170" y="317" fill="#eafdfa" font-family="Segoe UI, sans-serif" font-size="19">用户桌面 × 6</text>
    <text x="105" y="380" fill="#91a0b8" font-family="Segoe UI, sans-serif" font-size="16">当前用户权限直接完成</text>
    <rect x="105" y="420" width="230" height="70" rx="16" fill="#ffbd5a" fill-opacity=".18"/>
    <circle cx="140" cy="455" r="14" fill="#ffbd5a"/>
    <text x="170" y="462" fill="#fff3dc" font-family="Segoe UI, sans-serif" font-size="19">公共桌面 × 8</text>
    <text x="105" y="525" fill="#91a0b8" font-family="Segoe UI, sans-serif" font-size="16">集中到一次授权批次</text>
  </g>

  <path d="M395 395 H485" stroke="#71a7ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M470 382 L487 395 L470 408" fill="none" stroke="#71a7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="500" y="250" width="280" height="290" rx="28" fill="url(#glass)" stroke="#71a7ff" stroke-opacity=".5"/>
    <circle cx="640" cy="325" r="42" fill="#4f8cff" fill-opacity=".22" stroke="#71a7ff"/>
    <path d="M622 328 l12 12 25-30" fill="none" stroke="#9bc0ff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="640" y="400" fill="#fff" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="25" font-weight="600">UAC 仅一次</text>
    <text x="640" y="438" fill="#aebbd0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17">随机命名管道</text>
    <text x="640" y="468" fill="#aebbd0" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17">逐项校验公共桌面路径</text>
  </g>

  <path d="M795 395 H885" stroke="#71a7ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M870 382 L887 395 L870 408" fill="none" stroke="#71a7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="900" y="190" width="310" height="410" rx="28" fill="url(#glass)" stroke="#ffffff" stroke-opacity=".16"/>
    <text x="935" y="240" fill="#fff" font-family="Segoe UI, sans-serif" font-size="24" font-weight="600">稳定完成</text>
    <rect x="935" y="280" width="240" height="62" rx="15" fill="#4f8cff" fill-opacity=".18"/>
    <text x="965" y="319" fill="#eaf1ff" font-family="Segoe UI, sans-serif" font-size="18">✓ 8 项连续写入</text>
    <rect x="935" y="360" width="240" height="62" rx="15" fill="#64d8cb" fill-opacity=".16"/>
    <text x="965" y="399" fill="#eafdfa" font-family="Segoe UI, sans-serif" font-size="18">✓ 失败回滚复用会话</text>
    <rect x="935" y="440" width="240" height="62" rx="15" fill="#ffffff" fill-opacity=".08"/>
    <text x="965" y="479" fill="#eef3fb" font-family="Segoe UI, sans-serif" font-size="18">✓ 单项失败不闪退</text>
    <text x="935" y="545" fill="#91a0b8" font-family="Segoe UI, sans-serif" font-size="16">批次结束后助手立即退出</text>
  </g>
</svg>
