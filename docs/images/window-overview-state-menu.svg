      <text x="174" y="475" fill="#8fa5c0" font-size="14">文件资源管理器 · 后台窗口</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="598" y="188" width="380" height="318" rx="18" fill="#202936" stroke="#516077"/>
      <rect x="616" y="206" width="344" height="58" rx="12" fill="#273446"/>
      <text x="638" y="241" fill="#f3f7fd" font-size="17" font-weight="600">季度方案.docx</text>
      <line x1="616" y1="279" x2="960" y2="279" stroke="#405065"/>
