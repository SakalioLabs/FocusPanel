      <rect x="474" y="238" width="44" height="44" rx="12" fill="#1d3049"/>
      <path d="M488 252 L504 268 M504 252 L488 268" stroke="#d8e8f8" stroke-width="2.4" stroke-linecap="round"/>

      <rect x="82" y="324" width="456" height="76" rx="16" fill="#1c2c43" stroke="#344963"/>
      <circle cx="128" cy="362" r="22" fill="#d98b45"/>
