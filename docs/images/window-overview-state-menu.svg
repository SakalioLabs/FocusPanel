      <text x="174" y="383" fill="#8fa5c0" font-size="14">Paint.NET · 后台窗口</text>

      <rect x="82" y="416" width="456" height="76" rx="16" fill="#1c2c43" stroke="#344963"/>
      <circle cx="128" cy="454" r="22" fill="#4f9d73"/>
