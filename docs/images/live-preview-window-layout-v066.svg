<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 实时窗口缩略卡直接排列窗口</title>
  <desc id="desc">左侧展示带实时画面的窗口卡片及排列按钮，右侧展示左右半屏和四角六种 Panel 自有布局。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101827"/><stop offset="1" stop-color="#26384d"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef7ff" stop-opacity=".24"/><stop offset="1" stop-color="#8eb6de" stop-opacity=".09"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".30"/></filter>
  </defs>
  <rect width="1200" height="620" rx="34" fill="url(#bg)"/>
  <circle cx="1055" cy="75" r="235" fill="#229cf0" opacity=".10"/>
  <text x="54" y="67" fill="#f6f9ff" font-family="Segoe UI, Microsoft YaHei" font-size="29" font-weight="700">从实时缩略图，直接把窗口放到位</text>
  <text x="54" y="102" fill="#a8bed4" font-family="Segoe UI, Microsoft YaHei" font-size="17">不发送 Win+Z · 不打开任务栏贴靠浮层 · 不抢当前焦点</text>

  <g filter="url(#shadow)">
    <rect x="54" y="140" width="498" height="420" rx="26" fill="url(#glass)" stroke="#bbd9f3" stroke-opacity=".34"/>
    <text x="82" y="182" fill="#f1f7ff" font-family="Microsoft YaHei" font-size="20" font-weight="600">浏览器 · 2 个运行窗口</text>
    <rect x="78" y="208" width="450" height="254" rx="18" fill="#142439"/>
    <rect x="94" y="224" width="418" height="176" rx="12" fill="#d8e8f6" opacity=".88"/>
    <rect x="110" y="243" width="118" height="18" rx="9" fill="#5e7891" opacity=".75"/>
    <rect x="110" y="276" width="366" height="12" rx="6" fill="#8da4b8" opacity=".72"/>
    <rect x="110" y="300" width="318" height="12" rx="6" fill="#8da4b8" opacity=".55"/>
    <rect x="110" y="338" width="112" height="42" rx="12" fill="#188bd8"/>
    <text x="166" y="365" fill="#fff" font-family="Microsoft YaHei" font-size="14" text-anchor="middle">当前页面</text>
    <circle cx="104" cy="431" r="5" fill="#2aa7f2"/>
    <text x="122" y="437" fill="#e9f3fc" font-family="Microsoft YaHei" font-size="15">项目文档 - 浏览器</text>
    <g transform="translate(328 414)">
      <rect x="0" width="36" height="36" rx="11" fill="#168dde"/>
      <path d="M9 10h8v7H9zm10 0h8v7h-8zM9 19h8v7H9zm10 0h8v7h-8z" fill="#fff" opacity=".95"/>
      <rect x="44" width="36" height="36" rx="11" fill="#293c51"/><path d="M55 24h14" stroke="#dceaf7" stroke-width="2"/>
      <rect x="88" width="36" height="36" rx="11" fill="#293c51"/><rect x="99" y="10" width="14" height="14" fill="none" stroke="#dceaf7" stroke-width="2"/>
      <rect x="132" width="36" height="36" rx="11" fill="#293c51"/><path d="M143 11l14 14m0-14l-14 14" stroke="#dceaf7" stroke-width="2"/>
    </g>
    <text x="346" y="478" fill="#73c4fa" font-family="Microsoft YaHei" font-size="14" text-anchor="middle">排列</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="584" y="140" width="562" height="420" rx="26" fill="url(#glass)" stroke="#bbd9f3" stroke-opacity=".34"/>
    <text x="614" y="182" fill="#f1f7ff" font-family="Microsoft YaHei" font-size="20" font-weight="600">排列窗口</text>
    <text x="614" y="208" fill="#a8bed4" font-family="Microsoft YaHei" font-size="14">菜单打开期间，预览卡不会自动收起</text>
    <g transform="translate(614 238)" font-family="Microsoft YaHei" font-size="14" fill="#e8f3fd">
      <g transform="translate(0 0)"><rect width="150" height="82" rx="15" fill="#14273b"/><rect x="16" y="14" width="54" height="44" rx="6" fill="#269fe9"/><rect x="72" y="14" width="62" height="44" rx="6" fill="#334b61"/><text x="75" y="74" text-anchor="middle">左半屏</text></g>
      <g transform="translate(166 0)"><rect width="150" height="82" rx="15" fill="#14273b"/><rect x="16" y="14" width="62" height="44" rx="6" fill="#334b61"/><rect x="80" y="14" width="54" height="44" rx="6" fill="#269fe9"/><text x="75" y="74" text-anchor="middle">右半屏</text></g>
      <g transform="translate(332 0)"><rect width="150" height="82" rx="15" fill="#14273b"/><rect x="16" y="14" width="54" height="20" rx="5" fill="#269fe9"/><rect x="72" y="14" width="62" height="20" rx="5" fill="#334b61"/><rect x="16" y="36" width="54" height="22" rx="5" fill="#334b61"/><rect x="72" y="36" width="62" height="22" rx="5" fill="#334b61"/><text x="75" y="74" text-anchor="middle">左上</text></g>
      <g transform="translate(0 100)"><rect width="150" height="82" rx="15" fill="#14273b"/><rect x="16" y="14" width="54" height="20" rx="5" fill="#334b61"/><rect x="72" y="14" width="62" height="20" rx="5" fill="#269fe9"/><rect x="16" y="36" width="54" height="22" rx="5" fill="#334b61"/><rect x="72" y="36" width="62" height="22" rx="5" fill="#334b61"/><text x="75" y="74" text-anchor="middle">右上</text></g>
      <g transform="translate(166 100)"><rect width="150" height="82" rx="15" fill="#14273b"/><rect x="16" y="14" width="54" height="20" rx="5" fill="#334b61"/><rect x="72" y="14" width="62" height="20" rx="5" fill="#334b61"/><rect x="16" y="36" width="54" height="22" rx="5" fill="#269fe9"/><rect x="72" y="36" width="62" height="22" rx="5" fill="#334b61"/><text x="75" y="74" text-anchor="middle">左下</text></g>
      <g transform="translate(332 100)"><rect width="150" height="82" rx="15" fill="#14273b"/><rect x="16" y="14" width="54" height="20" rx="5" fill="#334b61"/><rect x="72" y="14" width="62" height="20" rx="5" fill="#334b61"/><rect x="16" y="36" width="54" height="22" rx="5" fill="#334b61"/><rect x="72" y="36" width="62" height="22" rx="5" fill="#269fe9"/><text x="75" y="74" text-anchor="middle">右下</text></g>
    </g>
    <rect x="614" y="447" width="482" height="72" rx="16" fill="#14273b" opacity=".78"/>
    <text x="638" y="477" fill="#d9eaf8" font-family="Microsoft YaHei" font-size="15">目标显示器工作区</text>
    <text x="638" y="501" fill="#8fb0ca" font-family="Microsoft YaHei" font-size="13">支持负坐标、多屏幕与奇数分辨率，写入失败不改变窗口状态</text>
  </g>
</svg>
