  </defs>
  <rect width="1120" height="500" rx="30" fill="url(#bgdt)"/>
  <text x="54" y="62" fill="#f5f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="28" font-weight="700">Panel 所在屏幕 · 默认避开接缝，也可固定主屏</text>
  <text x="54" y="98" fill="#b9c8df" font-family="Segoe UI, Microsoft YaHei" font-size="16">一个设置同时控制 Panel、12px 热区和 3px 运行指示条</text>

  <rect x="54" y="136" width="472" height="264" rx="24" fill="#21344c" stroke="#537398"/>
  <circle cx="95" cy="178" r="18" fill="#3677a8"/>
