  <text x="126" y="183" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="700">最右侧屏幕 · 默认</text>
  <rect x="82" y="218" width="174" height="116" rx="14" fill="#2b4059" stroke="#607d9d"/>
  <rect x="256" y="197" width="234" height="158" rx="14" fill="#304c69" stroke="#76a0c5"/>
