  <text x="82" y="378" fill="#9edfff" font-family="Segoe UI, Microsoft YaHei" font-size="13">避免 Panel 落在两屏接缝</text>

  <rect x="594" y="136" width="472" height="264" rx="24" fill="#293452" stroke="#756da2"/>
  <circle cx="635" cy="178" r="18" fill="#6d62aa"/>
