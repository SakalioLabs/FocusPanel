  <text x="943" y="293" text-anchor="middle" fill="#d5d2e5" font-family="Segoe UI, Microsoft YaHei" font-size="13">副屏</text>
  <text x="622" y="378" fill="#d5cbff" font-family="Segoe UI, Microsoft YaHei" font-size="13">适合固定工作中心或非横向布局</text>

  <path d="M526 268 H594" stroke="#79cfff" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 8"/>
