  <text x="666" y="183" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="19" font-weight="700">Windows 主屏 · 可选</text>
  <rect x="622" y="218" width="234" height="136" rx="14" fill="#3a466b" stroke="#9289be"/>
  <rect x="856" y="239" width="174" height="105" rx="14" fill="#313b5b" stroke="#736f91"/>
