<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#182840"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#51c7ff"/>
      <stop offset="1" stop-color="#8979ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="1120" height="500" rx="28" fill="url(#bg)"/>
  <text x="54" y="62" fill="#f5f8fc" font-family="Segoe UI, Microsoft YaHei" font-size="27" font-weight="700">OKR · 后台快照与异步同步边界</text>
  <text x="54" y="96" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="16">打开工作区、访问飞书和创建 AI 草稿都不再同步等待 WPF UI 线程</text>

  <g filter="url(#shadow)">
    <rect x="54" y="136" width="250" height="230" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="78" y="178" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">Panel 即时展开</text>
    <circle cx="88" cy="222" r="7" fill="#55d69d"/>
    <text x="108" y="228" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">先显示加载状态</text>
    <circle cx="88" cy="266" r="7" fill="#7fd0ff"/>
    <text x="108" y="272" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">鼠标与键盘继续响应</text>
    <circle cx="88" cy="310" r="7" fill="#8979ff"/>
    <text x="108" y="316" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">重复请求自动合并</text>
  </g>

  <path d="M324 252 H390" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M376 240 L394 252 L376 264" fill="none" stroke="#718cff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="412" y="120" width="296" height="264" rx="24" fill="#273a54" stroke="#587293"/>
    <text x="560" y="164" text-anchor="middle" fill="#e8f1fb" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">工作线程单次快照</text>
    <circle cx="450" cy="210" r="9" fill="#55d69d"/>
    <text x="474" y="216" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">本地目标与关键结果</text>
    <circle cx="450" cy="256" r="9" fill="#7fd0ff"/>
    <text x="474" y="262" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">飞书配置与同步时间</text>
    <circle cx="450" cy="302" r="9" fill="#ffc66d"/>
    <text x="474" y="308" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">独立短生命周期 DbContext</text>
    <rect x="438" y="338" width="244" height="30" rx="15" fill="#304765"/>
    <text x="560" y="359" text-anchor="middle" fill="#bcd0e7" font-family="Segoe UI, Microsoft YaHei" font-size="13">读取失败保留最后有效界面</text>
  </g>

  <path d="M728 252 H800" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M786 240 L804 252 L786 264" fill="none" stroke="#8979ff" stroke-width="5" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="822" y="136" width="244" height="230" rx="22" fill="#223149" stroke="#40526e"/>
    <text x="846" y="178" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">修订隔离后提交</text>
    <circle cx="860" cy="222" r="7" fill="#55d69d"/>
    <text x="880" y="228" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">当前快照 → 原位显示</text>
    <circle cx="860" cy="266" r="7" fill="#ffc66d"/>
    <text x="880" y="272" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">编辑后旧快照 → 丢弃</text>
    <circle cx="860" cy="310" r="7" fill="#7fd0ff"/>
    <text x="880" y="316" fill="#edf4fc" font-family="Segoe UI, Microsoft YaHei" font-size="15">飞书同步 → 后台刷新</text>
  </g>

  <rect x="54" y="414" width="1012" height="50" rx="17" fill="#202f47" stroke="#3c506d"/>
  <text x="560" y="445" text-anchor="middle" fill="#c6d4e7" font-family="Segoe UI, Microsoft YaHei" font-size="15">结果：工作区展开不顿挫 · 本地编辑不回滚 · 网络与数据库操作不锁住 Panel</text>
</svg>
