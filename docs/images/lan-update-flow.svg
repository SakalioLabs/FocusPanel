<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="460" rx="32" fill="url(#bg)"/>
  <text x="70" y="74" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">局域网一键更新</text>
  <text x="70" y="108" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei" font-size="17">打包机发布一次，多台 Windows 设备从共享目录或 HTTP 地址自行更新</text>

  <g filter="url(#shadow)">
    <rect x="70" y="155" width="280" height="210" rx="24" fill="#1e293b" stroke="#334155"/>
    <rect x="460" y="155" width="280" height="210" rx="24" fill="#1e293b" stroke="#334155"/>
    <rect x="850" y="155" width="280" height="210" rx="24" fill="#1e293b" stroke="#334155"/>
  </g>
  <circle cx="118" cy="207" r="25" fill="#2563eb"/>
  <text x="118" y="215" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-size="22" font-weight="700">1</text>
  <text x="160" y="204" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei" font-size="22" font-weight="600">生成 0.9.25 包</text>
  <text x="100" y="252" fill="#cbd5e1" font-family="Consolas, monospace" font-size="15">package-release.ps1</text>
  <text x="100" y="288" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei" font-size="16">完整包 · 差分包 · 更新清单</text>
  <text x="100" y="320" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei" font-size="16">不会触碰客户端数据</text>

  <circle cx="508" cy="207" r="25" fill="#0ea5e9"/>
  <text x="508" y="215" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-size="22" font-weight="700">2</text>
  <text x="550" y="204" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei" font-size="22" font-weight="600">发布到局域网</text>
  <text x="490" y="252" fill="#cbd5e1" font-family="Consolas, monospace" font-size="15">publish-lan-update.ps1</text>
  <text x="490" y="288" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei" font-size="16">\\主机\FocusPanelUpdates</text>
  <text x="490" y="320" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei" font-size="16">或 http://192.168.1.10:8088/</text>

  <circle cx="898" cy="207" r="25" fill="#06b6d4"/>
  <text x="898" y="215" text-anchor="middle" fill="#fff" font-family="Segoe UI" font-size="22" font-weight="700">3</text>
  <text x="940" y="204" fill="#f8fafc" font-family="Segoe UI, Microsoft YaHei" font-size="22" font-weight="600">其他设备一键安装</text>
  <text x="880" y="252" fill="#cbd5e1" font-family="Segoe UI, Microsoft YaHei" font-size="16">设置来源一次并自动记忆</text>
  <text x="880" y="288" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei" font-size="16">检查 → 下载 → 安全恢复任务栏</text>
  <text x="880" y="320" fill="#94a3b8" font-family="Segoe UI, Microsoft YaHei" font-size="16">重启并安装，业务数据库保留</text>

  <path d="M365 260 H435" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M425 248 L439 260 L425 272" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M755 260 H825" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <path d="M815 248 L829 260 L815 272" fill="none" stroke="#22d3ee" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="70" y="399" width="1060" height="2" fill="#334155"/>
  <text x="600" y="430" text-anchor="middle" fill="#64748b" font-family="Segoe UI, Microsoft YaHei" font-size="14">清单最后发布，避免客户端读到尚未复制完整的新版本</text>
</svg>
