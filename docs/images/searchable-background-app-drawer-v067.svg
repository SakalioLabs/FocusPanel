      <text y="48">✓ 区分有窗口与纯后台进程</text>
      <text y="96">✓ 保留统一任务栏稳定顺序</text>
      <text y="144">✓ 多窗口继续原位展开管理</text>
      <text y="192">✓ 不读取 Explorer 私有托盘结构</text>
