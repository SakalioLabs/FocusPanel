<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17243a"/>
      <stop offset="1" stop-color="#07101e"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef7ff" stop-opacity=".25"/>
      <stop offset="1" stop-color="#9db8d8" stop-opacity=".12"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000" flood-opacity=".36"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="220" cy="120" r="180" fill="#2d7cf6" opacity=".18"/>
  <circle cx="1050" cy="610" r="240" fill="#47d7c3" opacity=".10"/>
  <text x="92" y="102" fill="#f5f9ff" font-family="Segoe UI, Microsoft YaHei" font-size="42" font-weight="700">后台应用与窗口</text>
  <text x="94" y="145" fill="#aebfd4" font-family="Segoe UI, Microsoft YaHei" font-size="22">Panel 自有入口 · 不调用原生任务栏隐藏图标区</text>
  <g transform="translate(548 58)" filter="url(#shadow)">
    <rect width="630" height="610" rx="32" fill="url(#glass)" stroke="#d9ebff" stroke-opacity=".28"/>
    <text x="34" y="56" fill="#f5f9ff" font-family="Segoe UI, Microsoft YaHei" font-size="25" font-weight="600">应用与窗口</text>
    <text x="520" y="56" fill="#b7c7d9" font-family="Segoe UI, Microsoft YaHei" font-size="18">3 / 12 项</text>
    <rect x="30" y="82" width="570" height="54" rx="15" fill="#081426" fill-opacity=".74" stroke="#b9d7f5" stroke-opacity=".25"/>
    <circle cx="58" cy="109" r="10" fill="none" stroke="#c9d9ea" stroke-width="3"/>
    <line x1="65" y1="116" x2="73" y2="124" stroke="#c9d9ea" stroke-width="3" stroke-linecap="round"/>
    <text x="88" y="117" fill="#f5f9ff" font-family="Segoe UI, Microsoft YaHei" font-size="19">sync</text>
    <g transform="translate(30 153)" font-family="Segoe UI, Microsoft YaHei" font-size="18">
      <rect width="180" height="44" rx="13" fill="#2589ee"/>
      <text x="90" y="29" text-anchor="middle" fill="white">全部</text>
      <rect x="195" width="180" height="44" rx="13" fill="#0b1728" fill-opacity=".65"/>
      <text x="285" y="29" text-anchor="middle" fill="#c4d2e1">有窗口</text>
      <rect x="390" width="180" height="44" rx="13" fill="#0b1728" fill-opacity=".65"/>
      <text x="480" y="29" text-anchor="middle" fill="#c4d2e1">纯后台</text>
    </g>
    <g transform="translate(30 218)" font-family="Segoe UI, Microsoft YaHei">
      <rect width="570" height="88" rx="17" fill="#0a1728" fill-opacity=".72"/>
      <circle cx="48" cy="44" r="23" fill="#37b4a4"/>
      <path d="M38 44h20M48 34v20" stroke="white" stroke-width="4" stroke-linecap="round"/>
      <text x="88" y="38" fill="#f5f9ff" font-size="20" font-weight="600">同步助手</text>
      <text x="88" y="64" fill="#9fb2c8" font-size="16">后台运行 · 无可见窗口</text>
      <circle cx="528" cy="44" r="7" fill="#50d6bd"/>
      <rect y="102" width="570" height="88" rx="17" fill="#0a1728" fill-opacity=".72"/>
      <circle cx="48" cy="146" r="23" fill="#5f82ee"/>
      <rect x="38" y="136" width="20" height="20" rx="4" fill="none" stroke="white" stroke-width="3"/>
      <text x="88" y="140" fill="#f5f9ff" font-size="20" font-weight="600">云盘同步</text>
      <text x="88" y="166" fill="#9fb2c8" font-size="16">后台运行 · 无可见窗口</text>
      <circle cx="528" cy="146" r="7" fill="#50d6bd"/>
      <rect y="204" width="570" height="88" rx="17" fill="#0a1728" fill-opacity=".72"/>
      <circle cx="48" cy="248" r="23" fill="#e9a23b"/>
      <path d="M37 249l8 8 15-19" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="242" fill="#f5f9ff" font-size="20" font-weight="600">SyncAgent</text>
      <text x="88" y="268" fill="#9fb2c8" font-size="16">已固定 · 未运行</text>
    </g>
    <text x="34" y="552" fill="#9fb2c8" font-family="Segoe UI, Microsoft YaHei" font-size="16">输入、菜单和窗口列表持有焦点时保持展开</text>
    <text x="34" y="580" fill="#6daff5" font-family="Segoe UI, Microsoft YaHei" font-size="16">Esc 关闭 · 顺序不会因筛选改变</text>
  </g>
  <g transform="translate(92 230)" font-family="Segoe UI, Microsoft YaHei">
    <text fill="#f5f9ff" font-size="28" font-weight="600">更快找到真正需要的应用</text>
    <g transform="translate(0 52)" fill="#c4d3e4" font-size="20">
