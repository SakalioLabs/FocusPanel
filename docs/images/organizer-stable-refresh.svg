<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1722"/>
      <stop offset="1" stop-color="#1c2b38"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#8fc5e8" stop-opacity=".06"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="30" fill="url(#bg)"/>
  <circle cx="100" cy="50" r="190" fill="#087ccb" opacity=".14"/>
  <circle cx="1100" cy="470" r="240" fill="#55b7dd" opacity=".09"/>
  <text x="66" y="66" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="31" font-weight="650">文件变了，当前位置不动</text>
  <text x="66" y="103" fill="#adbdcc" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="17">差量同步保留收纳盒对象、展开状态、选择和滚动偏移</text>

  <g transform="translate(66 144)" filter="url(#shadow)">
    <rect width="460" height="310" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/>
    <text x="26" y="42" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="650">刷新前 · 滚动位置 420px</text>
    <rect x="26" y="64" width="388" height="70" rx="14" fill="#fff" fill-opacity=".065"/>
    <text x="48" y="94" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="16">工作资料</text>
    <text x="48" y="117" fill="#91a8ba" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">折叠 · 8 个项目</text>
    <rect x="26" y="146" width="388" height="126" rx="14" fill="#fff" fill-opacity=".045"/>
    <text x="48" y="178" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="16">待处理</text>
    <rect x="48" y="194" width="88" height="54" rx="10" fill="#fff" fill-opacity=".08"/>
    <rect x="146" y="194" width="88" height="54" rx="10" fill="#147fc2" fill-opacity=".55"/>
    <rect x="244" y="194" width="88" height="54" rx="10" fill="#fff" fill-opacity=".08"/>
    <circle cx="190" cy="221" r="5" fill="#74d0ff"/>
    <rect x="428" y="76" width="6" height="184" rx="3" fill="#fff" fill-opacity=".08"/>
    <rect x="428" y="152" width="6" height="54" rx="3" fill="#65bdf3"/>
  </g>

  <g transform="translate(552 250)">
    <path d="M0 0h76" stroke="#65bdf3" stroke-width="2"/>
    <path d="m68-7 8 7-8 7" fill="none" stroke="#65bdf3" stroke-width="2"/>
    <text x="38" y="-18" text-anchor="middle" fill="#8fd3ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">Insert / Move</text>
    <text x="38" y="26" text-anchor="middle" fill="#8fd3ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">Remove</text>
  </g>

  <g transform="translate(654 144)" filter="url(#shadow)">
    <rect width="480" height="310" rx="24" fill="url(#glass)" stroke="#fff" stroke-opacity=".12"/>
    <text x="26" y="42" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="650">刷新后 · 仍为 420px</text>
    <rect x="26" y="64" width="408" height="70" rx="14" fill="#fff" fill-opacity=".065"/>
    <text x="48" y="94" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="16">工作资料</text>
    <text x="48" y="117" fill="#91a8ba" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">折叠保持 · 原对象复用</text>
    <rect x="26" y="146" width="408" height="126" rx="14" fill="#fff" fill-opacity=".045"/>
    <text x="48" y="178" fill="#f5f8ff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="16">待处理</text>
    <rect x="48" y="194" width="88" height="54" rx="10" fill="#fff" fill-opacity=".08"/>
    <rect x="146" y="194" width="88" height="54" rx="10" fill="#147fc2" fill-opacity=".55"/>
    <rect x="244" y="194" width="88" height="54" rx="10" fill="#fff" fill-opacity=".08"/>
    <rect x="342" y="194" width="68" height="54" rx="10" fill="#57c995" fill-opacity=".20"/>
    <path d="M368 212v18M359 221h18" stroke="#70dca9" stroke-width="2"/>
    <circle cx="190" cy="221" r="5" fill="#74d0ff"/>
    <rect x="448" y="76" width="6" height="184" rx="3" fill="#fff" fill-opacity=".08"/>
    <rect x="448" y="152" width="6" height="54" rx="3" fill="#65bdf3"/>
  </g>

  <g transform="translate(670 472)">
    <circle cx="7" cy="7" r="7" fill="#57c995"/>
    <path d="m3 7 3 3 5-6" stroke="#0f2820" stroke-width="2" fill="none"/>
    <text x="26" y="13" fill="#aee8cb" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">展开状态保留</text>
    <circle cx="172" cy="7" r="7" fill="#57c995"/>
    <path d="m168 7 3 3 5-6" stroke="#0f2820" stroke-width="2" fill="none"/>
    <text x="191" y="13" fill="#aee8cb" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">选中状态保留</text>
    <circle cx="350" cy="7" r="7" fill="#57c995"/>
    <path d="m346 7 3 3 5-6" stroke="#0f2820" stroke-width="2" fill="none"/>
    <text x="369" y="13" fill="#aee8cb" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">不再跳回顶部</text>
  </g>
