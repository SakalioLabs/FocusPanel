<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101d2c"/>
      <stop offset="1" stop-color="#1a2e42"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#59c8ff"/>
      <stop offset="1" stop-color="#8a7dff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02070d" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="1200" height="620" rx="30" fill="url(#bg)"/>
  <circle cx="1100" cy="58" r="168" fill="#59c8ff" opacity=".07"/>
  <circle cx="86" cy="584" r="210" fill="#8a7dff" opacity=".07"/>
  <text x="56" y="68" fill="#f5f9fd" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="28" font-weight="650">灵感不丢失：从任务栏搜索一步收进 Inbox</text>
  <text x="56" y="102" fill="#92aac1" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="15">明确命令 → 共享任务写入闸门 → 持久化确认 → Toast 反馈 / Inbox 增量同步</text>

  <g transform="translate(56 140)" filter="url(#shadow)">
    <rect width="700" height="402" rx="24" fill="#192b3d" stroke="#42617b"/>
    <text x="28" y="42" fill="#eaf3fb" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="18" font-weight="600">应用、窗口、命令、任务与计算</text>
    <rect x="28" y="66" width="644" height="58" rx="14" fill="#0e1c29" stroke="#5cc6ff" stroke-width="2"/>
    <text x="52" y="102" fill="#f7fbff" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="20">任务 整理明天的演示材料</text>

    <rect x="28" y="142" width="644" height="82" rx="16" fill="#24445d" stroke="#6bcbff"/>
    <rect x="48" y="160" width="48" height="48" rx="13" fill="#315a76"/>
    <path d="M61 174h22M61 184h15M61 194h18" stroke="#7fd3ff" stroke-width="3" stroke-linecap="round"/>
    <path d="M84 189l4 4 8-10" fill="none" stroke="#9b8dff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="116" y="178" fill="#f4f9fd" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="17" font-weight="600">收集任务：整理明天的演示材料</text>
    <text x="116" y="202" fill="#b9d0e3" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">任务快捷收集 · 点击或按 Enter 保存到 Inbox</text>

    <g font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="14">
      <rect x="28" y="244" width="200" height="54" rx="14" fill="#142535" stroke="#334e65"/>
      <text x="48" y="277" fill="#d9e8f4">待办：回复邮件</text>
      <rect x="242" y="244" width="204" height="54" rx="14" fill="#142535" stroke="#334e65"/>
      <text x="262" y="277" fill="#d9e8f4">todo book dentist</text>
      <rect x="460" y="244" width="212" height="54" rx="14" fill="#142535" stroke="#334e65"/>
      <text x="480" y="277" fill="#d9e8f4">task: prepare release</text>
    </g>
    <rect x="28" y="322" width="644" height="1" fill="#334c61"/>
    <text x="28" y="357" fill="#8ca6bd" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="13">系统命令隔离：task manager → 任务管理器，不会收集为任务</text>
    <text x="28" y="381" fill="#6f8aa2" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif" font-size="12">仅持久化成功后反馈；标题为空、超过 120 字或含控制字符时不写入</text>
  </g>

  <g transform="translate(792 142)" font-family="Segoe UI Variable, Microsoft YaHei UI, sans-serif">
    <rect width="352" height="408" rx="24" fill="#132536" stroke="#36546d"/>
    <text x="28" y="43" fill="#f0f6fb" font-size="18" font-weight="600">同一条可靠写入链</text>
    <g transform="translate(28 72)">
      <circle cx="20" cy="20" r="20" fill="#224661"/>
      <text x="20" y="27" fill="#70c8ff" font-size="18" text-anchor="middle">1</text>
      <text x="56" y="17" fill="#e7f0f8" font-size="14">严格解析明确前缀</text>
      <text x="56" y="38" fill="#8fa8bd" font-size="12">不抢系统 task manager</text>
      <path d="M20 44v26" stroke="#395970" stroke-width="2"/>
    </g>
    <g transform="translate(28 154)">
      <circle cx="20" cy="20" r="20" fill="#224661"/>
      <text x="20" y="27" fill="#70c8ff" font-size="18" text-anchor="middle">2</text>
      <text x="56" y="17" fill="#e7f0f8" font-size="14">共享 TaskService 闸门</text>
      <text x="56" y="38" fill="#8fa8bd" font-size="12">与任务页严格串行</text>
      <path d="M20 44v26" stroke="#395970" stroke-width="2"/>
    </g>
    <g transform="translate(28 236)">
      <circle cx="20" cy="20" r="20" fill="#224661"/>
      <text x="20" y="27" fill="#70c8ff" font-size="18" text-anchor="middle">3</text>
      <text x="56" y="17" fill="#e7f0f8" font-size="14">确认写入 Inbox</text>
      <text x="56" y="38" fill="#8fa8bd" font-size="12">失败不伪装成成功</text>
      <path d="M20 44v26" stroke="#395970" stroke-width="2"/>
    </g>
    <g transform="translate(28 318)">
      <circle cx="20" cy="20" r="20" fill="url(#accent)"/>
      <text x="20" y="27" fill="#08131e" font-size="18" font-weight="700" text-anchor="middle">4</text>
      <text x="56" y="17" fill="#e7f0f8" font-size="14">Toast + 可见 Inbox 同步</text>
      <text x="56" y="38" fill="#8fa8bd" font-size="12">点击即可查看任务</text>
    </g>
  </g>
</svg>
