<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">FocusPanel 应用任务栏窗口状态</title>
  <desc id="desc">任务栏准确区分当前、后台和最小化应用，并说明点击后的实际动作。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#20283a"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf4ff" stop-opacity=".20"/>
      <stop offset="1" stop-color="#94b8ef" stop-opacity=".08"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1080" cy="75" r="200" fill="#278bf0" opacity=".12"/>
  <circle cx="90" cy="470" r="190" fill="#8b5cf6" opacity=".09"/>

  <text x="62" y="68" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">下一次点击会发生什么，一眼看懂</text>
  <text x="62" y="102" fill="#aebbd0" font-family="Segoe UI, Microsoft YaHei" font-size="17">真实窗口状态贯穿图标、提示与读屏文本</text>

  <g filter="url(#shadow)">
    <rect x="62" y="142" width="360" height="312" rx="24" fill="url(#glass)" stroke="#6d809b"/>
    <text x="94" y="184" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="650">运行指示线也有含义</text>
    <g transform="translate(104 224)">
      <rect width="76" height="76" rx="18" fill="#278bf0" opacity=".22" stroke="#78bbff"/>
      <circle cx="42" cy="38" r="20" fill="#4f8ee8"/>
      <rect x="35" y="29" width="14" height="18" rx="2" fill="#fff" opacity=".9"/>
      <rect x="3" y="24" width="4" height="28" rx="2" fill="#78bbff"/>
      <text x="38" y="101" text-anchor="middle" fill="#e7f2ff" font-family="Segoe UI, Microsoft YaHei" font-size="14" font-weight="600">正在使用</text>
      <text x="38" y="122" text-anchor="middle" fill="#9eb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="12">24px · 强调</text>
    </g>
    <g transform="translate(204 224)">
      <rect width="76" height="76" rx="18" fill="#fff" opacity=".06"/>
      <circle cx="42" cy="38" r="20" fill="#f0b642"/>
      <rect x="34" y="31" width="16" height="14" rx="2" fill="#fff" opacity=".9"/>
      <rect x="3" y="32" width="4" height="12" rx="2" fill="#78bbff" opacity=".58"/>
      <text x="38" y="101" text-anchor="middle" fill="#dce7f6" font-family="Segoe UI, Microsoft YaHei" font-size="14" font-weight="600">后台运行</text>
      <text x="38" y="122" text-anchor="middle" fill="#9eb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="12">12px · 常规</text>
    </g>
    <g transform="translate(304 224)">
      <rect width="76" height="76" rx="18" fill="#fff" opacity=".04"/>
      <circle cx="42" cy="38" r="20" fill="#8794a9"/>
      <path d="M32 43h20" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <rect x="3" y="35" width="4" height="7" rx="2" fill="#78bbff" opacity=".34"/>
      <text x="38" y="101" text-anchor="middle" fill="#d0dae9" font-family="Segoe UI, Microsoft YaHei" font-size="14" font-weight="600">已最小化</text>
      <text x="38" y="122" text-anchor="middle" fill="#9eb0c8" font-family="Segoe UI, Microsoft YaHei" font-size="12">7px · 弱化</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="462" y="142" width="322" height="312" rx="24" fill="#202c3f" stroke="#63748f"/>
    <text x="494" y="184" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="650">提示直接说动作</text>
    <g font-family="Segoe UI, Microsoft YaHei">
      <rect x="494" y="210" width="258" height="60" rx="14" fill="#278bf0" opacity=".20" stroke="#78bbff"/>
      <text x="514" y="234" fill="#f4f8ff" font-size="15" font-weight="600">正在使用 · 1 个窗口</text>
      <text x="514" y="256" fill="#b8d9ff" font-size="13">左键最小化</text>
      <rect x="494" y="284" width="258" height="60" rx="14" fill="#fff" opacity=".06"/>
      <text x="514" y="308" fill="#e3ebf7" font-size="15" font-weight="600">后台运行 · 1 个窗口</text>
      <text x="514" y="330" fill="#aebbd0" font-size="13">左键切换</text>
      <rect x="494" y="358" width="258" height="60" rx="14" fill="#fff" opacity=".04" stroke="#708097"/>
      <text x="514" y="382" fill="#d9e2ef" font-size="15" font-weight="600">已最小化 · 1 个窗口</text>
      <text x="514" y="404" fill="#aebbd0" font-size="13">左键还原并切换</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="824" y="142" width="314" height="312" rx="24" fill="url(#glass)" stroke="#6d809b"/>
    <text x="856" y="184" fill="#f4f8ff" font-family="Segoe UI, Microsoft YaHei" font-size="20" font-weight="650">多窗口列表保留状态</text>
    <g font-family="Segoe UI, Microsoft YaHei">
      <rect x="856" y="210" width="250" height="56" rx="14" fill="#278bf0" opacity=".20"/>
      <text x="876" y="237" fill="#f4f8ff" font-size="15" font-weight="600">季度报告.docx</text>
      <text x="876" y="256" fill="#b8d9ff" font-size="12">当前窗口</text>
      <rect x="856" y="278" width="250" height="56" rx="14" fill="#fff" opacity=".06"/>
      <text x="876" y="305" fill="#e1eaf6" font-size="15">会议纪要.docx</text>
      <text x="876" y="324" fill="#9eb0c8" font-size="12">已最小化</text>
      <rect x="856" y="346" width="250" height="56" rx="14" fill="#fff" opacity=".06"/>
      <text x="876" y="373" fill="#e1eaf6" font-size="15">项目计划.docx</text>
      <text x="876" y="392" fill="#9eb0c8" font-size="12">已最大化</text>
    </g>
  </g>
</svg>
