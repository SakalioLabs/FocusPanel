  <rect x="54" y="438" width="1012" height="47" rx="18" fill="#1e3049" stroke="#3d5879"/>
  <text x="560" y="468" text-anchor="middle" fill="#d9e8fb" font-family="Segoe UI, Microsoft YaHei" font-size="15">启动只读取一次 Shell 快照 · 高频切换不会堆积重复写入 · 正常退出确保已接收的设置完成持久化</text>
