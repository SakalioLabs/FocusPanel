  <text x="108" y="226" fill="#d8e5f8" font-family="Segoe UI, Microsoft YaHei" font-size="15">切换浅色 / 深色 / 系统</text>
  <circle cx="88" cy="262" r="8" fill="#68b7ff"/>
  <text x="108" y="268" fill="#d8e5f8" font-family="Segoe UI, Microsoft YaHei" font-size="15">调整全屏热区策略</text>
