  <text x="448" y="272" fill="#dce8fa" font-family="Segoe UI, Microsoft YaHei" font-size="14">Shell.FullscreenHotZone</text>
  <text x="670" y="272" text-anchor="end" fill="#86e3b5" font-family="Segoe UI, Microsoft YaHei" font-size="14">严格串行</text>
