<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="500" viewBox="0 0 1180 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111821"/>
      <stop offset="1" stop-color="#1d2733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b82ca"/>
      <stop offset="1" stop-color="#64b9f3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1180" height="500" rx="32" fill="url(#bg)"/>
  <text x="62" y="72" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="30" font-weight="700">统一 Fluent 选择状态</text>
  <text x="62" y="106" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="17">跟随 Windows 强调色 · 低饱和选中表面 · 分段、开关与文件选择使用同一语言</text>

  <g transform="translate(62 150)" filter="url(#shadow)">
    <rect width="550" height="278" rx="22" fill="#232d39" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="28" y="42" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">任务视图</text>
    <rect x="28" y="68" width="494" height="54" rx="12" fill="#303a47"/>
    <g transform="translate(34 74)">
      <rect width="154" height="42" rx="9" fill="#1687d1" fill-opacity=".18" stroke="#ffffff" stroke-opacity=".12"/>
      <rect x="34" y="36" width="86" height="3" rx="2" fill="url(#accent)"/>
      <text x="61" y="27" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="15" font-weight="600">列表</text>
    </g>
    <text x="251" y="101" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="15">看板</text>
    <text x="414" y="101" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="15">字段</text>

    <text x="28" y="172" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">工具栏开关</text>
    <rect x="28" y="194" width="48" height="48" rx="10" fill="#1687d1" fill-opacity=".18" stroke="#64b9f3"/>
    <path d="M43 218h18M52 209v18" stroke="#f5f7ff" stroke-width="2" stroke-linecap="round"/>
    <rect x="88" y="194" width="48" height="48" rx="10" fill="transparent" stroke="#ffffff" stroke-opacity=".08"/>
    <path d="M102 212h20M102 220h14M102 228h17" stroke="#aeb5c8" stroke-width="2" stroke-linecap="round"/>
    <text x="158" y="224" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">选中有描边，未选中保持安静</text>
  </g>

  <g transform="translate(660 150)">
    <rect width="456" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">文件卡片 · 已选中</text>
    <rect x="24" y="52" width="408" height="50" rx="11" fill="#1687d1" fill-opacity=".18" stroke="#64b9f3"/>
    <rect x="42" y="66" width="24" height="24" rx="6" fill="#64b9f3" fill-opacity=".22"/>
    <text x="82" y="84" fill="#f5f7ff" font-family="Segoe UI Variable Text, Microsoft YaHei" font-size="15">季度计划.xlsx</text>
  </g>
  <g transform="translate(660 302)">
    <rect width="456" height="126" rx="20" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".1"/>
    <text x="24" y="34" fill="#f5f7ff" font-family="Segoe UI, Microsoft YaHei" font-size="18" font-weight="600">动态强调色</text>
    <circle cx="58" cy="76" r="20" fill="#1976b9"/>
    <circle cx="112" cy="76" r="20" fill="#a64ca6"/>
    <circle cx="166" cy="76" r="20" fill="#e07829"/>
    <text x="206" y="82" fill="#aeb5c8" font-family="Segoe UI, Microsoft YaHei" font-size="14">系统变化后自动更新柔和表面</text>
  </g>
</svg>
